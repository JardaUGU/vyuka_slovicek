<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Výuka Tablet Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --col-bg: #0b1528;
      --col-card: #18263e;
      --col-card-border: #31507d;
      --col-active-tab: #00bcd4;
      --col-green: #22c55e;
      --col-red: #ef4444;
      --col-yellow: #facc15;
      --col-text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Roboto', sans-serif;
    }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }
    #app-container {
      width: 100vw;
      max-width: 680px;
      height: 100vh;
      max-height: 480px;
      background-color: var(--col-bg);
      display: flex;
      flex-direction: column;
      border: 2px solid var(--col-card-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    @media (max-width: 680px), (max-height: 480px) {
      #app-container {
        border-radius: 0;
        border: none;
        max-width: 100vw;
        max-height: 100vh;
      }
    }
    header {
      height: 48px;
      background-color: var(--col-card);
      border-bottom: 2px solid var(--col-card-border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
    }
    .nav-btn {
      background: var(--col-active-tab);
      color: #fff;
      border: 1px solid #fff;
      border-radius: 6px;
      height: 34px;
      min-width: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    .badge {
      background: #242c3a;
      border: 1px solid var(--col-card-border);
      padding: 0 10px;
      height: 32px;
      display: flex;
      align-items: center;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }
    .badge.active { background: var(--col-active-tab); border-color: #fff; }
    .spacer { flex: 1; }

    main {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
    }

    footer {
      height: 30px;
      background-color: var(--col-card);
      border-top: 1px solid var(--col-card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 13px;
      color: var(--col-yellow);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      height: 100%;
    }
    .tile {
      background-color: var(--col-card);
      border: 1px solid var(--col-card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 10px;
      transition: transform 0.05s, border-color 0.1s;
    }
    .tile:active {
      transform: scale(0.97);
      border-color: #fff;
    }
    .tile h2 { font-size: 19px; color: #fff; margin-bottom: 4px; }
    .tile p { font-size: 12px; color: var(--col-text-muted); }

    .prompt-box {
      background: var(--col-card);
      border: 1px solid var(--col-card-border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      color: var(--col-yellow);
      margin-bottom: 10px;
    }
    .hebrew-text {
      font-family: 'Tinos', serif;
      direction: rtl;
      font-size: 32px !important;
      line-height: 1.4;
    }
    .action-btn {
      background: var(--col-active-tab);
      border: 1px solid #fff;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      margin-top: 8px;
    }
    .action-btn.green { background: var(--col-green); }
    .action-btn.red { background: var(--col-red); }

    .opt-btn {
      background: var(--col-card);
      border: 1px solid var(--col-active-tab);
      color: #fff;
      padding: 12px 6px;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .opt-btn.hebrew {
      font-family: 'Tinos', serif;
      direction: rtl;
      font-size: 26px;
    }
    .opt-btn.correct { background: var(--col-green) !important; border-color: #fff; }
    .opt-btn.wrong { background: var(--col-red) !important; border-color: #fff; }

    .slots-row, .letters-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .letter-slot {
      width: 44px;
      height: 48px;
      background: var(--col-card);
      border: 1px solid var(--col-active-tab);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }
    .letter-slot.filled {
      background: #143c28;
      border-color: var(--col-green);
      color: var(--col-green);
    }
    .letter-tile {
      width: 44px;
      height: 48px;
      background: var(--col-card);
      border: 1px solid var(--col-active-tab);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }
    .letter-tile.used {
      background: #181c24;
      border-color: #282d37;
      color: #4b5563;
      cursor: default;
    }
  </style>
</head>
<body>

<div id="app-container">
  <header>
    <div id="btn-back" class="nav-btn" onclick="goBack()">&lt;</div>
    <div id="badge-subj" class="badge">Výuka</div>
    <div id="badge-topic" class="badge" style="display:none;">Téma</div>
    <div class="spacer"></div>
    <div class="nav-btn" onclick="syncData()" title="Synchronizovat">🔄</div>
  </header>

  <main id="main-content">
    <div style="text-align:center; margin-top:50px; color:var(--col-text-muted);">
      Načítám data z Google Sheets...
    </div>
  </main>

  <footer>
    <div id="user-info">Daniel ★ <span id="star-count">0</span></div>
    <div id="status-info">Online</div>
  </footer>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxaxBIXP-ECpWstcqRDw8RuT_ds6UwcplU_3pZ9_-ksELN5FVeGt5EHjjexkJVmx1FR_w/exec";

  let appData = { vocab: [], quizzes: [], sequences: [] };
  let currentScreen = "SELECT_SUBJECT";
  let selectedSubject = "";
  let currentTopicType = "";
  let currentTopicIndex = -1;
  let selectedGame = "";
  let stars = Number(localStorage.getItem("stars") || 0);

  // Zvuky
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playTone(freq, type, duration) {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }
  function sndOk() { playTone(880, 'sine', 0.08); setTimeout(() => playTone(1320, 'sine', 0.1), 80); }
  function sndErr() { playTone(220, 'square', 0.15); }
  function addStar(count = 1) {
    stars += count;
    localStorage.setItem("stars", stars);
    document.getElementById("star-count").innerText = stars;
  }

  async function loadData() {
    const cached = localStorage.getItem("app_data");
    if (cached) {
      try {
        appData = JSON.parse(cached);
        renderScreen();
      } catch(e) {}
    }
    await syncData();
  }

  async function syncData() {
    document.getElementById("status-info").innerText = "Stahuji...";
    try {
      const res = await fetch(API_URL);
      const json = await res.json();
      if (json && json.vocab) {
        appData = json;
        localStorage.setItem("app_data", JSON.stringify(json));
        document.getElementById("status-info").innerText = "Data aktuální";
        renderScreen();
      }
    } catch(e) {
      document.getElementById("status-info").innerText = "Offline";
    }
  }

  // Odeslání pokroku zpět do Google Sheets
  async function saveWordMasteryToGoogle(lessonId, foreignWord, masteryLevel) {
    try {
      const formData = new URLSearchParams();
      formData.append("lessonId", lessonId);
      formData.append("foreign", foreignWord);
      formData.append("mastery", masteryLevel);

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        body: formData
      });
      console.log("Ukládám do Google Sheets:", foreignWord, "->", masteryLevel);
    } catch(e) {
      console.error("Chyba při ukládání:", e);
    }
  }

  function goBack() {
    if (currentScreen === "PLAYING") setScreen("SELECT_GAME");
    else if (currentScreen === "SELECT_GAME") setScreen("SELECT_TOPIC");
    else if (currentScreen === "SELECT_TOPIC") setScreen("SELECT_SUBJECT");
  }

  function setScreen(scr) {
    currentScreen = scr;
    renderScreen();
  }

  function getActiveTopic() {
    if (currentTopicType === "VOCAB") return appData.vocab[currentTopicIndex];
    if (currentTopicType === "QUIZ") return appData.quizzes[currentTopicIndex];
    if (currentTopicType === "SEQ") return appData.sequences[currentTopicIndex];
    return null;
  }

  function renderScreen() {
    document.getElementById("star-count").innerText = stars;
    const main = document.getElementById("main-content");
    const bSubj = document.getElementById("badge-subj");
    const bTopic = document.getElementById("badge-topic");

    if (currentScreen === "SELECT_SUBJECT") {
      bSubj.innerText = "Předměty";
      bTopic.style.display = "none";
      main.innerHTML = `
        <div class="grid-2">
          <div class="tile" onclick="chooseSubject('CZ')"><h2>Čeština</h2><p>Slovní druhy, pády, I/Y</p></div>
          <div class="tile" onclick="chooseSubject('EN')"><h2>Angličtina</h2><p>Slovíčka a lekce</p></div>
          <div class="tile" onclick="chooseSubject('DE')"><h2>Němčina</h2><p>Barvy, čísla, věty</p></div>
          <div class="tile" onclick="chooseSubject('HE')"><h2>Hebrejština</h2><p>Jonáš 1, Tanach</p></div>
        </div>
      `;
    } 
    else if (currentScreen === "SELECT_TOPIC") {
      bSubj.innerText = selectedSubject;
      bTopic.style.display = "none";

      let html = '<div style="display:flex;flex-direction:column;gap:8px;">';
      
      // 1. Slovíčkové lekce (bezpečné indexové volání)
      appData.vocab.forEach((l, idx) => {
        if (l.lang.toUpperCase() === selectedSubject) {
          html += `<div class="tile" style="flex-direction:row;justify-content:space-between;padding:12px;" onclick="selectTopic('VOCAB', ${idx})">
            <h2>${l.title}</h2><p>${l.words.length} slov</p>
          </div>`;
        }
      });

      // 2. Kvízy
      appData.quizzes.forEach((q, idx) => {
        if (q.subject.toUpperCase() === selectedSubject) {
          html += `<div class="tile" style="flex-direction:row;justify-content:space-between;padding:12px;" onclick="selectTopic('QUIZ', ${idx})">
            <h2>${q.title}</h2><p>Kvíz (${q.questions.length})</p>
          </div>`;
        }
      });

      // 3. Posloupnosti / Verše
      appData.sequences.forEach((s, idx) => {
        if (s.category.toUpperCase() === selectedSubject) {
          html += `<div class="tile" style="flex-direction:row;justify-content:space-between;padding:12px;" onclick="selectTopic('SEQ', ${idx})">
            <h2>${s.title}</h2><p>Řada na čas (${s.count})</p>
          </div>`;
        }
      });

      html += '</div>';
      main.innerHTML = html;
    }
    else if (currentScreen === "SELECT_GAME") {
      const topic = getActiveTopic();
      bTopic.style.display = "flex";
      bTopic.innerText = topic.title;

      main.innerHTML = `
        <div class="grid-2">
          <div class="tile" onclick="startGame('CARDS')"><h2>1. Karty</h2><p>Prohlížení a čtení</p></div>
          <div class="tile" onclick="startGame('ADAPTIVE')"><h2>2. Zkoušení</h2><p>Chytré okno po 3 slovech</p></div>
          <div class="tile" onclick="startGame('SCRAMBLE')"><h2>3. Skládání</h2><p>Rozsypaná písmena</p></div>
          <div class="tile" onclick="startGame('MISSING')"><h2>4. Doplň písmeno</h2><p>Vyber chybějící</p></div>
        </div>
      `;
    }
    else if (currentScreen === "PLAYING") {
      const topic = getActiveTopic();
      bTopic.style.display = "flex";
      bTopic.innerText = topic.title;
      renderActiveGame();
    }
  }

  function chooseSubject(subj) {
    selectedSubject = subj;
    setScreen("SELECT_TOPIC");
  }

  function selectTopic(type, index) {
    currentTopicType = type;
    currentTopicIndex = index;
    if (type === "VOCAB") {
      setScreen("SELECT_GAME");
    } else {
      selectedGame = type;
      initGameState();
      setScreen("PLAYING");
    }
  }

  function startGame(game) {
    selectedGame = game;
    initGameState();
    setScreen("PLAYING");
  }

  // ==========================================
  // LOGIKA ADAPTIVNÍHO ZKOUŠENÍ A MOTORŮ
  // ==========================================
  let vCardIdx = 0;
  let vActivePool = 3;
  let vMastery = {};
  let vQuizCur = 0;
  let vQuizRevealed = false;

  let scrambleCur = 0;
  let scramblePlaced = [];
  let scrambleLetters = [];

  let qCurStep = 0;
  let qAnswered = false;

  let seqTargetIdx = 0;
  let seqSlots = [];
  let seqStartTime = 0;
  let seqTimerInterval = null;

  function initGameState() {
    const topic = getActiveTopic();
    if (selectedGame === "CARDS") vCardIdx = 0;
    if (selectedGame === "ADAPTIVE") {
      // Načtení zvládnutí z Google Sheetů (pokud existuje)
      vMastery = {};
      let learnedCount = 0;
      topic.words.forEach((w, i) => {
        const m = Number(w.mastery || 0);
        vMastery[i] = m;
        if (m >= 2) learnedCount++;
      });
      // Aktivní okno začíná tam, kde jsme skončili + 3 nová slova
      vActivePool = Math.min(topic.words.length, Math.max(3, learnedCount + 3));
      nextAdaptiveWord();
    }
    if (selectedGame === "SCRAMBLE") initScramble();
    if (selectedGame === "QUIZ") { qCurStep = 0; qAnswered = false; }
    if (selectedGame === "SEQ") initSequence();
  }

  function renderActiveGame() {
    const main = document.getElementById("main-content");
    const topic = getActiveTopic();
    const isHebrew = selectedSubject === "HE";

    // 1. KARTY
    if (selectedGame === "CARDS") {
      const w = topic.words[vCardIdx];
      main.innerHTML = `
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}">${w.foreign}</div>
        <div class="prompt-box" style="color:#fff;font-size:22px;">${w.czech}</div>
        <div style="text-align:center;color:var(--col-active-tab);font-size:18px;margin-bottom:12px;">[ ${w.pron || ''} ]</div>
        <div class="grid-2">
          <div class="action-btn" onclick="vCardPrev()">Předchozí</div>
          <div class="action-btn" onclick="vCardNext()">Další (${vCardIdx+1}/${topic.words.length})</div>
        </div>
      `;
    }

    // 2. ADAPTIVNÍ ZKOUŠENÍ (Active Window + Leitner)
    else if (selectedGame === "ADAPTIVE") {
      const w = topic.words[vQuizCur];
      const mVal = vMastery[vQuizCur] || 0;
      main.innerHTML = `
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--col-text-muted);">
          <span>Zvládnuto: ${mVal}/2 ★</span>
          <span>Aktivní okno: ${vActivePool} z ${topic.words.length}</span>
        </div>
        <div class="prompt-box" style="color:#fff;margin-top:6px;">${w.czech}</div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}" style="color:${vQuizRevealed ? 'var(--col-yellow)' : 'var(--col-text-muted)'};">
          ${vQuizRevealed ? w.foreign : '[ ? ? ? ]'}
        </div>
        ${vQuizRevealed ? `
          <div style="text-align:center;color:var(--col-active-tab);margin-bottom:8px;">[ ${w.pron || ''} ]</div>
          <div class="grid-2">
            <div class="action-btn red" onclick="answerAdaptive(false)">Nevěděl jsem</div>
            <div class="action-btn green" onclick="answerAdaptive(true)">Věděl jsem (+1 ★)</div>
          </div>
        ` : `
          <div class="action-btn" onclick="vQuizRevealed=true;renderActiveGame();">ZKONTROLOVAT</div>
        `}
      `;
    }

    // 3. SKLÁDÁNÍ SLOVA (SCRAMBLE)
    else if (selectedGame === "SCRAMBLE") {
      const w = topic.words[scrambleCur];
      const isDone = scramblePlaced.length === w.foreign.length;
      main.innerHTML = `
        <div class="prompt-box" style="font-size:20px;color:#fff;">Slož: <b>${w.czech}</b></div>
        <div class="slots-row">
          ${w.foreign.split('').map((ch, i) => `
            <div class="letter-slot ${i < scramblePlaced.length ? 'filled' : ''}">
              ${i < scramblePlaced.length ? scramblePlaced[i] : '_'}
            </div>
          `).join('')}
        </div>
        ${!isDone ? `
          <div class="letters-row">
            ${scrambleLetters.map((item, idx) => `
              <div class="letter-tile ${item.used ? 'used' : ''}" onclick="clickScrambleLetter(${idx})">
                ${item.ch}
              </div>
            `).join('')}
          </div>
        ` : `
          <div class="action-btn green" onclick="nextScramble()">VÝBORNĚ! DALŠÍ SLOVO</div>
        `}
      `;
    }

    // 4. KVÍZ
    else if (selectedGame === "QUIZ") {
      const q = topic.questions[qCurStep];
      main.innerHTML = `
        <div style="font-size:12px;color:var(--col-text-muted);margin-bottom:4px;">Otázka ${qCurStep+1} z ${topic.questions.length}</div>
        <div class="prompt-box" style="font-size:20px;color:#fff;">${q.prompt}</div>
        <div class="grid-2" style="margin-top:10px;">
          ${q.options.map((opt, i) => `
            <div class="opt-btn ${qAnswered ? (i === q.correctIdx ? 'correct' : 'wrong') : ''}" onclick="clickQuizOpt(${i})">
              ${opt}
            </div>
          `).join('')}
        </div>
        ${qAnswered ? `<div class="action-btn" onclick="nextQuizStep()">DALŠÍ ➔</div>` : ''}
      `;
    }

    // 5. POSLOUPNOSTI NA ČAS (VERŠE / ŘADY)
    else if (selectedGame === "SEQ") {
      const isFinished = seqTargetIdx >= topic.items.length;
      main.innerHTML = `
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--col-text-muted);">
          <span>Krok ${Math.min(seqTargetIdx+1, topic.items.length)} z ${topic.items.length}</span>
          <span id="seq-timer" style="color:var(--col-yellow);font-weight:bold;">0.0 s</span>
        </div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}" style="margin:8px 0;min-height:56px;color:#fff;font-size:22px;">
          ${topic.items.slice(0, seqTargetIdx).join(' ')} <span style="color:var(--col-yellow);">[ ??? ]</span>
        </div>
        ${!isFinished ? `
          <div class="grid-2">
            ${seqSlots.map((itemIdx, slot) => `
              <div class="opt-btn ${isHebrew ? 'hebrew' : ''}" onclick="clickSeqSlot(${slot})">
                ${itemIdx !== -1 ? topic.items[itemIdx] : ''}
              </div>
            `).join('')}
          </div>
        ` : `
          <div class="action-btn green" onclick="initSequence();renderActiveGame();">DOKONČENO! HRÁT ZNOVU</div>
        `}
      `;
    }
  }

  function vCardPrev() {
    const topic = getActiveTopic();
    vCardIdx = (vCardIdx + topic.words.length - 1) % topic.words.length;
    renderActiveGame();
  }
  function vCardNext() {
    const topic = getActiveTopic();
    vCardIdx = (vCardIdx + 1) % topic.words.length;
    renderActiveGame();
  }

  function nextAdaptiveWord() {
    vQuizRevealed = false;
    const topic = getActiveTopic();
    // Priorita pro slova, která ještě nemají 2 úspěchy
    const cand = [];
    for (let i = 0; i < vActivePool; i++) {
      if ((vMastery[i] || 0) < 2) cand.push(i);
    }
    if (cand.length === 0 || (Math.random() < 0.25 && vActivePool > 1)) {
      vQuizCur = Math.floor(Math.random() * vActivePool);
    } else {
      vQuizCur = cand[Math.floor(Math.random() * cand.length)];
    }
  }

  function answerAdaptive(known) {
    const topic = getActiveTopic();
    const w = topic.words[vQuizCur];

    if (known) {
      sndOk();
      addStar(1);
      vMastery[vQuizCur] = (vMastery[vQuizCur] || 0) + 1;
      
      // Odemknutí dalšího slova
      if (vMastery[vQuizCur] >= 2 && vActivePool < topic.words.length) {
        vActivePool++;
      }
      // Odeslání nového skóre na Google Sheets
      saveWordMasteryToGoogle(topic.id, w.foreign, vMastery[vQuizCur]);
    } else {
      sndErr();
      vMastery[vQuizCur] = 0;
      saveWordMasteryToGoogle(topic.id, w.foreign, 0);
    }
    nextAdaptiveWord();
    renderActiveGame();
  }

  function initScramble() {
    const topic = getActiveTopic();
    scrambleCur = Math.floor(Math.random() * vActivePool);
    const w = topic.words[scrambleCur];
    scramblePlaced = [];
    scrambleLetters = w.foreign.split('').map(ch => ({ ch, used: false })).sort(() => Math.random() - 0.5);
  }
  function clickScrambleLetter(idx) {
    const topic = getActiveTopic();
    const item = scrambleLetters[idx];
    if (item.used) return;
    const w = topic.words[scrambleCur];
    const expected = w.foreign[scramblePlaced.length];
    if (item.ch === expected) {
      sndOk();
      item.used = true;
      scramblePlaced.push(item.ch);
      if (scramblePlaced.length === w.foreign.length) addStar(1);
    } else {
      sndErr();
    }
    renderActiveGame();
  }
  function nextScramble() { initScramble(); renderActiveGame(); }

  function clickQuizOpt(idx) {
    if (qAnswered) return;
    const topic = getActiveTopic();
    const q = topic.questions[qCurStep];
    qAnswered = true;
    if (idx === q.correctIdx) { sndOk(); addStar(1); }
    else sndErr();
    renderActiveGame();
  }
  function nextQuizStep() {
    const topic = getActiveTopic();
    qCurStep++;
    qAnswered = false;
    if (qCurStep >= topic.questions.length) setScreen("SELECT_TOPIC");
    else renderActiveGame();
  }

  function initSequence() {
    const topic = getActiveTopic();
    seqTargetIdx = 0;
    seqSlots = [-1, -1, -1, -1];
    seqSlots[0] = 0;
    if (topic.items.length > 1) seqSlots[1] = 1;
    for (let s = 2; s < Math.min(4, topic.items.length); s++) seqSlots[s] = s;
    seqSlots.sort(() => Math.random() - 0.5);

    seqStartTime = Date.now();
    if (seqTimerInterval) clearInterval(seqTimerInterval);
    seqTimerInterval = setInterval(() => {
      const el = document.getElementById("seq-timer");
      if (el && seqTargetIdx < topic.items.length) {
        el.innerText = ((Date.now() - seqStartTime) / 1000).toFixed(1) + " s";
      }
    }, 100);
  }
  function clickSeqSlot(slot) {
    const topic = getActiveTopic();
    if (seqSlots[slot] === seqTargetIdx) {
      sndOk();
      seqTargetIdx++;
      if (seqTargetIdx >= topic.items.length) {
        clearInterval(seqTimerInterval);
        addStar(3);
      } else {
        const next = seqTargetIdx + 1;
        seqSlots[slot] = next < topic.items.length ? next : -1;
      }
      renderActiveGame();
    } else {
      sndErr();
    }
  }

  loadData();
</script>
</body>
