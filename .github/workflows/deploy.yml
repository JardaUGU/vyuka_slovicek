name: Deploy Main and Dev to Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout ostrou verzi (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-files

      - name: Stáhnout vývojovou verzi (dev)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-files

      - name: Sestavit web pro GitHub Pages
        run: |
          mkdir -p site
          cp -r main-files/* site/
          mkdir -p site/dev
          cp -r dev-files/* site/dev/
          touch site/.nojekyll

      - name: Nastavení GitHub Pages
        uses: actions/configure-pages@v5

      - name: Příprava balíčku k nasazení
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Vystavení na web
        id: deployment
        uses: actions/deploy-pages@v4
