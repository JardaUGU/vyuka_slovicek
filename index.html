<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Výukový Systém</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --col-bg: #0b1528;
      --col-card: #18263e;
      --col-card-border: #31507d;
      --col-active-tab: #00bcd4;
      --col-green: #22c55e;
      --col-red: #ef4444;
      --col-yellow: #facc15;
      --col-orange: #f97316;
      --col-text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Roboto', sans-serif;
    }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }
    #app-container {
      width: 100vw;
      max-width: 680px;
      height: 100vh;
      max-height: 520px;
      background-color: var(--col-bg);
      display: flex;
      flex-direction: column;
      border: 2px solid var(--col-card-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    @media (max-width: 680px), (max-height: 520px) {
      #app-container { border-radius: 0; border: none; max-width: 100vw; max-height: 100vh; }
    }
    header {
      height: 48px;
      background-color: var(--col-card);
      border-bottom: 2px solid var(--col-card-border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
    }
    .nav-btn {
      background: var(--col-active-tab);
      color: #fff;
      border: 1px solid #fff;
      border-radius: 6px;
      height: 34px;
      min-width: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    .badge {
      background: #242c3a;
      border: 1px solid var(--col-card-border);
      padding: 0 10px;
      height: 32px;
      display: flex;
      align-items: center;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .badge.active { background: var(--col-active-tab); border-color: #fff; }
    .spacer { flex: 1; }
    main {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
    }
    footer {
      height: 32px;
      background-color: var(--col-card);
      border-top: 1px solid var(--col-card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 13px;
      color: var(--col-yellow);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      height: 100%;
    }
    .tile {
      background-color: var(--col-card);
      border: 1px solid var(--col-card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 10px;
      transition: transform 0.05s, border-color 0.1s;
    }
    .tile:active { transform: scale(0.97); border-color: #fff; }
    .tile h2 { font-size: 18px; color: #fff; margin-bottom: 4px; }
    .tile p { font-size: 12px; color: var(--col-text-muted); }

    .prompt-box {
      background: var(--col-card);
      border: 1px solid var(--col-card-border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      color: var(--col-yellow);
      margin-bottom: 10px;
    }
    .hebrew-text {
      font-family: 'Tinos', serif;
      direction: rtl;
      font-size: 32px !important;
      line-height: 1.4;
    }
    .action-btn {
      background: var(--col-active-tab);
      border: 1px solid #fff;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      margin-top: 8px;
    }
    .action-btn.green { background: var(--col-green); }
    .action-btn.red { background: var(--col-red); }

    .opt-btn {
      background: var(--col-card);
      border: 1px solid var(--col-active-tab);
      color: #fff;
      padding: 12px 6px;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .opt-btn.hebrew {
      font-family: 'Tinos', serif;
      direction: rtl;
      font-size: 26px;
    }
    .opt-btn.hint {
      background: #4d4411 !important;
      border-color: var(--col-yellow) !important;
      color: var(--col-yellow) !important;
    }
    .opt-btn.correct { background: var(--col-green) !important; border-color: #fff; }
    .opt-btn.wrong { background: var(--col-red) !important; border-color: #fff; }

    .slots-row, .letters-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .letter-slot {
      min-width: 44px;
      height: 48px;
      padding: 0 6px;
      background: var(--col-card);
      border: 1px solid var(--col-active-tab);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }
    .letter-slot.filled { background: #143c28; border-color: var(--col-green); color: var(--col-green); }
    .letter-tile {
      min-width: 44px;
      height: 48px;
      padding: 0 6px;
      background: var(--col-card);
      border: 1px solid var(--col-active-tab);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }
    .letter-tile.hebrew { font-family: 'Tinos', serif; font-size: 28px; }
    .letter-tile.used { background: #181c24; border-color: #282d37; color: #4b5563; cursor: default; }

    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #101b2d;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .toggle-btn {
      background: #24344d;
      color: #fff;
      border: 1px solid var(--col-card-border);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .toggle-btn.on { background: var(--col-active-tab); border-color: #fff; }
  </style>
</head>
<body>

<div id="app-container">
  <header>
    <div id="btn-back" class="nav-btn" onclick="goBack()">&lt;</div>
    <div id="badge-user" class="badge" onclick="setScreen('SELECT_USER')">Uživatel</div>
    <div id="badge-subj" class="badge" style="display:none;" onclick="setScreen('SELECT_TOPIC')">Předmět</div>
    <div id="badge-topic" class="badge" style="display:none;" onclick="setScreen('SELECT_GAME')">Téma</div>
    <div class="spacer"></div>
    <div class="nav-btn" onclick="syncData()" title="Synchronizovat">🔄</div>
  </header>

  <main id="main-content">
    <div style="text-align:center; margin-top:50px; color:var(--col-text-muted);">
      Načítám data z Google Sheets...
    </div>
  </main>

  <footer>
    <div id="footer-user">Žák: --</div>
    <div id="footer-goal">Cíl: 0/15 ★</div>
    <div id="status-info">Online</div>
  </footer>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxaxBIXP-ECpWstcqRDw8RuT_ds6UwcplU_3pZ9_-ksELN5FVeGt5EHjjexkJVmx1FR_w/exec";

  let appData = { users: [], vocab: [], quizzes: [], sequences: [] };
  let currentUser = JSON.parse(localStorage.getItem("cur_user") || '{"name":"Honzík","grade":9,"goal":25,"stars":0}');
  let filterGradeOnly = true;

  let currentScreen = "SELECT_USER";
  let selectedSubject = "";
  let currentTopicType = "";
  let currentTopicIndex = -1;
  let selectedGame = "";

  // Zvuky
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playTone(freq, type, duration) {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }
  function sndOk() { playTone(880, 'sine', 0.08); setTimeout(() => playTone(1320, 'sine', 0.1), 80); }
  function sndErr() { playTone(220, 'square', 0.15); }
  function sndFanfare() {
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.1), i * 110));
  }

  function addReward(count = 1, section = "Lekce") {
    currentUser.stars = (currentUser.stars || 0) + count;
    localStorage.setItem("cur_user", JSON.stringify(currentUser));
    updateFooter();

    try {
      const fd = new URLSearchParams();
      fd.append("action", "log_activity");
      fd.append("user", currentUser.name);
      fd.append("section", section);
      fd.append("stars", count);
      fetch(API_URL, { method: "POST", mode: "no-cors", body: fd });
    } catch(e) {}
  }

  function updateFooter() {
    document.getElementById("footer-user").innerText = `${currentUser.name} (${currentUser.grade}. tř.)`;
    document.getElementById("footer-goal").innerText = `Hvězdy: ${currentUser.stars}/${currentUser.goal} ★`;
  }

  async function loadData() {
    const cached = localStorage.getItem("app_data");
    if (cached) {
      try {
        appData = JSON.parse(cached);
        renderScreen();
      } catch(e) {}
    }
    await syncData();
  }

  async function syncData() {
    document.getElementById("status-info").innerText = "Stahuji...";
    try {
      const res = await fetch(API_URL);
      const json = await res.json();
      if (json && json.vocab) {
        appData = json;
        localStorage.setItem("app_data", JSON.stringify(json));
        document.getElementById("status-info").innerText = "Data aktuální";
        const foundU = appData.users.find(u => u.name === currentUser.name);
        if (foundU) {
          currentUser.goal = foundU.goal;
          currentUser.grade = foundU.grade;
        }
        renderScreen();
      }
    } catch(e) {
      document.getElementById("status-info").innerText = "Offline";
    }
  }

  async function saveWordMasteryToGoogle(lessonId, foreignWord, masteryLevel) {
    try {
      const fd = new URLSearchParams();
      fd.append("action", "save_mastery");
      fd.append("lessonId", lessonId);
      fd.append("foreign", foreignWord);
      fd.append("mastery", masteryLevel);
      fetch(API_URL, { method: "POST", mode: "no-cors", body: fd });
    } catch(e) {}
  }

  function goBack() {
    if (currentScreen === "PLAYING") setScreen("SELECT_GAME");
    else if (currentScreen === "SELECT_GAME") setScreen("SELECT_TOPIC");
    else if (currentScreen === "SELECT_TOPIC") setScreen("SELECT_SUBJECT");
    else if (currentScreen === "SELECT_SUBJECT") setScreen("SELECT_USER");
  }

  function setScreen(scr) {
    currentScreen = scr;
    renderScreen();
  }

  function getActiveTopic() {
    if (currentTopicType === "VOCAB") return appData.vocab[currentTopicIndex];
    if (currentTopicType === "QUIZ") return appData.quizzes[currentTopicIndex];
    if (currentTopicType === "SEQ") return appData.sequences[currentTopicIndex];
    return null;
  }

  function renderScreen() {
    updateFooter();
    const main = document.getElementById("main-content");
    const bUser = document.getElementById("badge-user");
    const bSubj = document.getElementById("badge-subj");
    const bTopic = document.getElementById("badge-topic");

    bUser.innerText = currentUser.name;

    // VÝBĚR ŽÁKA
    if (currentScreen === "SELECT_USER") {
      bSubj.style.display = "none";
      bTopic.style.display = "none";
      const uList = (appData.users && appData.users.length) ? appData.users : [
        {name: "Daniel", grade: 2, goal: 10, stars: 0},
        {name: "Pavel", grade: 5, goal: 15, stars: 0},
        {name: "Míša", grade: 7, goal: 20, stars: 0},
        {name: "Honzík", grade: 9, goal: 25, stars: 0},
        {name: "Táta", grade: 99, goal: 30, stars: 0}
      ];

      main.innerHTML = `
        <h2 style="font-size:18px;margin-bottom:12px;text-align:center;color:var(--col-yellow);">Kdo se jde učit?</h2>
        <div class="grid-2">
          ${uList.map(u => `
            <div class="tile" style="${currentUser.name === u.name ? 'border-color:var(--col-green);background:#142838;' : ''}" onclick="selectUser('${u.name}', ${u.grade}, ${u.goal})">
              <h2>${u.name}</h2>
              <p>${u.grade <= 9 ? u.grade + '. třída ZŠ' : 'Dospělý'}</p>
              <p style="color:var(--col-yellow);margin-top:4px;">Cíl: ${u.goal} ★</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    // VÝBĚR PŘEDMĚTU
    else if (currentScreen === "SELECT_SUBJECT") {
      bSubj.style.display = "none";
      bTopic.style.display = "none";
      main.innerHTML = `
        <div class="grid-2">
          <div class="tile" onclick="chooseSubject('CZ')"><h2>Český jazyk</h2><p>Slovní druhy, pády, I/Y, básničky</p></div>
          <div class="tile" onclick="chooseSubject('EN')"><h2>Angličtina</h2><p>Project 1 & slovíčka</p></div>
          <div class="tile" onclick="chooseSubject('DE')"><h2>Němčina</h2><p>Barvy, čísla, věty, členy</p></div>
          <div class="tile" onclick="chooseSubject('HE')"><h2>Hebrejština</h2><p>Jonáš 1, text Tanachu</p></div>
          <div class="tile" onclick="chooseSubject('PRV')"><h2>Prvouka & čas</h2><p>Dny, měsíce, abeceda</p></div>
        </div>
      `;
    }

    // VÝBĚR TÉMATU
    else if (currentScreen === "SELECT_TOPIC") {
      bSubj.style.display = "flex";
      bSubj.innerText = selectedSubject;
      bTopic.style.display = "none";

      let html = `
        <div class="filter-bar">
          <span>Filtr (${currentUser.grade}. tř.):</span>
          <button class="toggle-btn ${filterGradeOnly ? 'on' : ''}" onclick="filterGradeOnly=!filterGradeOnly;renderScreen();">
            ${filterGradeOnly ? 'Jen pro mou třídu' : 'Zobrazit vše'}
          </button>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
      `;

      let countShown = 0;

      appData.vocab.forEach((l, idx) => {
        if (l.lang.toUpperCase() === selectedSubject) {
          if (filterGradeOnly && l.minGrade > currentUser.grade) return;
          countShown++;
          html += `<div class="tile" style="flex-direction:row;justify-content:space-between;padding:12px;" onclick="selectTopic('VOCAB', ${idx})">
            <div style="text-align:left;">
              <h2>${l.title}</h2>
              <p>Lekce od ${l.minGrade}. třídy</p>
            </div>
            <span style="color:var(--col-active-tab);font-weight:bold;">${l.words.length} slov</span>
          </div>`;
        }
      });

      appData.quizzes.forEach((q, idx) => {
        if (q.subject.toUpperCase() === selectedSubject) {
          if (filterGradeOnly && q.minGrade > currentUser.grade) return;
          countShown++;
          html += `<div class="tile" style="flex-direction:row;justify-content:space-between;padding:12px;" onclick="selectTopic('QUIZ', ${idx})">
            <div style="text-align:left;">
              <h2>${q.title}</h2>
              <p>Kvíz od ${q.minGrade}. třídy</p>
            </div>
            <span style="color:var(--col-active-tab);font-weight:bold;">${q.questions.length} ot.</span>
          </div>`;
        }
      });

      appData.sequences.forEach((s, idx) => {
        if (s.category.toUpperCase() === selectedSubject) {
          if (filterGradeOnly && s.minGrade > currentUser.grade) return;
          countShown++;
          html += `<div class="tile" style="flex-direction:row;justify-content:space-between;padding:12px;" onclick="selectTopic('SEQ', ${idx})">
            <div style="text-align:left;">
              <h2>${s.title}</h2>
              <p>Řada na čas od ${s.minGrade}. třídy</p>
            </div>
            <span style="color:var(--col-active-tab);font-weight:bold;">${s.count} položek</span>
          </div>`;
        }
      });

      if (countShown === 0) {
        html += `<div style="text-align:center;padding:25px;color:var(--col-text-muted);">Pro ${currentUser.grade}. třídu tu zatím není specifické téma. Klikněte na "Zobrazit vše".</div>`;
      }

      html += '</div>';
      main.innerHTML = html;
    }

    // VÝBĚR HRY
    else if (currentScreen === "SELECT_GAME") {
      const topic = getActiveTopic();
      bSubj.style.display = "flex";
      bTopic.style.display = "flex";
      bTopic.innerText = topic.title;

      main.innerHTML = `
        <div class="grid-2">
          <div class="tile" onclick="startGame('CARDS')"><h2>1. Karty</h2><p>Prohlížení a čtení</p></div>
          <div class="tile" onclick="startGame('ADAPTIVE')"><h2>2. Zkoušení</h2><p>Adaptivní test (chyby se vrací)</p></div>
          <div class="tile" onclick="startGame('SCRAMBLE')"><h2>3. Skládání</h2><p>Skládej ze střepů (bez uvíznutí)</p></div>
          <div class="tile" onclick="startGame('MISSING')"><h2>4. Doplň písmeno</h2><p>Doplň chybějící znak</p></div>
        </div>
      `;
    }

    // SAMOTNÁ HRA
    else if (currentScreen === "PLAYING") {
      const topic = getActiveTopic();
      bSubj.style.display = "flex";
      bTopic.style.display = "flex";
      bTopic.innerText = topic.title;
      renderActiveGame();
    }
  }

  function selectUser(name, grade, goal) {
    currentUser = { name, grade, goal, stars: 0 };
    localStorage.setItem("cur_user", JSON.stringify(currentUser));
    setScreen("SELECT_SUBJECT");
  }

  function chooseSubject(subj) {
    selectedSubject = subj;
    setScreen("SELECT_TOPIC");
  }

  function selectTopic(type, index) {
    currentTopicType = type;
    currentTopicIndex = index;
    if (type === "VOCAB") setScreen("SELECT_GAME");
    else {
      selectedGame = type;
      initGameState();
      setScreen("PLAYING");
    }
  }

  function startGame(game) {
    selectedGame = game;
    initGameState();
    setScreen("PLAYING");
  }

  // ==========================================
  // ADAPTIVNÍ SPRÁVA SLOVÍČEK & SPOLEČNÝ BAZÉN
  // ==========================================
  let vMastery = {};      // wordIdx -> 0, 1, 2
  let vActivePool = 3;    // kolik slov je otevřeno
  let vCurrentWord = 0;   // index aktuálního slova
  let vCardIdx = 0;
  let vQuizRevealed = false;

  let scramblePlaced = [];
  let scrambleLetters = [];
  let scrambleHadMistake = false;
  let scrambleDone = false;

  let missingSlot = 0;
  let missingChoices = [];
  let missingChosen = -1;

  let qCurStep = 0;
  let qAnswered = false;

  let seqTargetIdx = 0;
  let seqSlots = [];
  let seqStartTime = 0;
  let seqTimerInterval = null;
  let seqHintActive = false;
  let seqInactivityTimer = null;

  // Rozdělení textu na grafémy (udrží hebrejské písmeno a tečky/nikkud jako jeden dílek!)
  function getGraphemes(str) {
    if (window.Intl && Intl.Segmenter) {
      const segmenter = new Intl.Segmenter('und', { granularity: 'grapheme' });
      return Array.from(segmenter.segment(str), s => s.segment);
    }
    return str.split('');
  }

  // Inicializace stavu při vstupu do hry
  function initGameState() {
    const topic = getActiveTopic();
    if (currentTopicType === "VOCAB") {
      vMastery = {};
      let masteredCount = 0;
      topic.words.forEach((w, i) => {
        const m = Number(w.mastery || 0);
        vMastery[i] = m;
        if (m >= 2) masteredCount++;
      });
      // Otevřeme všechna naučená slova plus 3 nenaučená
      vActivePool = Math.min(topic.words.length, Math.max(3, masteredCount + 3));
      pickNextVocabWord();

      if (selectedGame === "CARDS") vCardIdx = 0;
      if (selectedGame === "SCRAMBLE") initScramble();
      if (selectedGame === "MISSING") initMissing();
    }
    if (selectedGame === "QUIZ") { qCurStep = 0; qAnswered = false; }
    if (selectedGame === "SEQ") initSequence();
  }

  // VÝBĚR DALŠÍHO SLOVA (CHYTRÝ LEITNER)
  function pickNextVocabWord() {
    const topic = getActiveTopic();
    const unmastered = [];
    const mastered = [];

    for (let i = 0; i < vActivePool; i++) {
      if ((vMastery[i] || 0) < 2) unmastered.push(i);
      else mastered.push(i);
    }

    // Pokud jsou všechna slova v otevřeném okně naučena, otevřeme další z lekce!
    if (unmastered.length === 0 && vActivePool < topic.words.length) {
      vActivePool = Math.min(topic.words.length, vActivePool + 2);
      for (let i = 0; i < vActivePool; i++) {
        if ((vMastery[i] || 0) < 2) unmastered.push(i);
      }
    }

    // 80% šance na slovo s chybou/neprocvičené, 20% na zopakování
    if (unmastered.length > 0 && (Math.random() < 0.8 || mastered.length === 0)) {
      vCurrentWord = unmastered[Math.floor(Math.random() * unmastered.length)];
    } else if (mastered.length > 0) {
      vCurrentWord = mastered[Math.floor(Math.random() * mastered.length)];
    } else {
      vCurrentWord = 0;
    }
  }

  // Zaznamenání výsledku (úspěch / chyba) a synchronizace
  function recordWordResult(isSuccess) {
    const topic = getActiveTopic();
    const w = topic.words[vCurrentWord];

    if (isSuccess) {
      sndOk();
      addReward(1, topic.title);
      vMastery[vCurrentWord] = Math.min(2, (vMastery[vCurrentWord] || 0) + 1);

      // Pokud dosáhlo úrovně 2 a jsou v lekci další slova, rozšíříme okno
      if (vMastery[vCurrentWord] >= 2 && vActivePool < topic.words.length) {
        vActivePool++;
        sndFanfare();
      }
      saveWordMasteryToGoogle(topic.id, w.foreign, vMastery[vCurrentWord]);
    } else {
      sndErr();
      // CHYBA: slovo padá na nulu a zůstává v prioritním zkoušení!
      vMastery[vCurrentWord] = 0;
      saveWordMasteryToGoogle(topic.id, w.foreign, 0);
    }
  }

  function renderActiveGame() {
    const main = document.getElementById("main-content");
    const topic = getActiveTopic();
    const isHebrew = selectedSubject === "HE";

    // 1. KARTY
    if (selectedGame === "CARDS") {
      const w = topic.words[vCardIdx];
      main.innerHTML = `
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}">${w.foreign}</div>
        <div class="prompt-box" style="color:#fff;font-size:22px;">${w.czech}</div>
        <div style="text-align:center;color:var(--col-active-tab);font-size:18px;margin-bottom:12px;">[ ${w.pron || ''} ]</div>
        <div class="grid-2">
          <div class="action-btn" onclick="vCardPrev()">Předchozí</div>
          <div class="action-btn" onclick="vCardNext()">Další (${vCardIdx+1}/${topic.words.length})</div>
        </div>
      `;
    }

    // 2. ADAPTIVNÍ ZKOUŠENÍ
    else if (selectedGame === "ADAPTIVE") {
      const w = topic.words[vCurrentWord];
      const mVal = vMastery[vCurrentWord] || 0;
      main.innerHTML = `
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--col-text-muted);">
          <span>Naučeno: ${mVal}/2 ★</span>
          <span>Aktivní okno: ${vActivePool} z ${topic.words.length}</span>
        </div>
        <div class="prompt-box" style="color:#fff;margin-top:6px;">${w.czech}</div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}" style="color:${vQuizRevealed ? 'var(--col-yellow)' : 'var(--col-text-muted)'};">
          ${vQuizRevealed ? w.foreign : '[ ? ? ? ]'}
        </div>
        ${vQuizRevealed ? `
          <div style="text-align:center;color:var(--col-active-tab);margin-bottom:8px;">[ ${w.pron || ''} ]</div>
          <div class="grid-2">
            <div class="action-btn red" onclick="answerAdaptive(false)">Nevěděl jsem</div>
            <div class="action-btn green" onclick="answerAdaptive(true)">Věděl jsem (+1 ★)</div>
          </div>
        ` : `
          <div class="action-btn" onclick="vQuizRevealed=true;renderActiveGame();">ZKONTROLOVAT</div>
        `}
      `;
    }

    // 3. SKLÁDÁNÍ SLOVA (SCRAMBLE S EVIDENCÍ CHYB)
    else if (selectedGame === "SCRAMBLE") {
      const w = topic.words[vCurrentWord];
      const mVal = vMastery[vCurrentWord] || 0;
      const targetGraphemes = getGraphemes(w.foreign);

      main.innerHTML = `
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--col-text-muted);">
          <span>Naučeno: ${mVal}/2 ★ ${scrambleHadMistake ? '<b style="color:var(--col-red);">(s chybou)</b>' : ''}</span>
          <span>Okno: ${vActivePool} z ${topic.words.length}</span>
        </div>
        <div class="prompt-box" style="font-size:20px;color:#fff;margin-top:6px;">Slož: <b>${w.czech}</b></div>
        <div class="slots-row ${isHebrew ? 'hebrew-text' : ''}">
          ${targetGraphemes.map((ch, i) => `
            <div class="letter-slot ${i < scramblePlaced.length ? 'filled' : ''}">
              ${i < scramblePlaced.length ? scramblePlaced[i] : '_'}
            </div>
          `).join('')}
        </div>
        ${!scrambleDone ? `
          <div class="letters-row">
            ${scrambleLetters.map((item, idx) => `
              <div class="letter-tile ${isHebrew ? 'hebrew' : ''} ${item.used ? 'used' : ''}" onclick="clickScrambleLetter(${idx})">
                ${item.ch}
              </div>
            `).join('')}
          </div>
        ` : `
          <div style="text-align:center;color:var(--col-active-tab);margin-bottom:6px;">[ ${w.pron || ''} ]</div>
          <div class="action-btn ${scrambleHadMistake ? 'red' : 'green'}" onclick="nextScrambleStep()">
            ${scrambleHadMistake ? 'CHYBA -> SLOVO SE BRZY VRÁTÍ (DALŠÍ)' : 'VÝBORNĚ! DALŠÍ SLOVO ➔'}
          </div>
        `}
      `;
    }

    // 4. DOPLŇOVÁNÍ PÍSMENE
    else if (selectedGame === "MISSING") {
      const w = topic.words[vCurrentWord];
      const mVal = vMastery[vCurrentWord] || 0;
      const letters = getGraphemes(w.foreign);

      let maskedWord = "";
      letters.forEach((ch, idx) => {
        if (idx === missingSlot) {
          maskedWord += missingChosen === -1 ? " [ _ ] " : ` [ ${ch} ] `;
        } else {
          maskedWord += ch + " ";
        }
      });

      main.innerHTML = `
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--col-text-muted);">
          <span>Naučeno: ${mVal}/2 ★</span>
          <span>Okno: ${vActivePool} z ${topic.words.length}</span>
        </div>
        <div class="prompt-box" style="font-size:20px;color:#fff;margin-top:6px;">Doplň: <b>${w.czech}</b></div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}">${maskedWord}</div>
        <div class="grid-2">
          ${missingChoices.map((ch, i) => {
            const isCorrect = ch === letters[missingSlot];
            const cls = missingChosen !== -1 ? (isCorrect ? 'correct' : (i === missingChosen ? 'wrong' : '')) : '';
            return `<div class="opt-btn ${isHebrew ? 'hebrew' : ''} ${cls}" onclick="clickMissingOption(${i})">${ch}</div>`;
          }).join('')}
        </div>
        ${missingChosen !== -1 ? `<div class="action-btn" onclick="nextMissingStep()">DALŠÍ ➔</div>` : ''}
      `;
    }

    // 5. KVÍZ
    else if (selectedGame === "QUIZ") {
      const q = topic.questions[qCurStep];
      main.innerHTML = `
        <div style="font-size:12px;color:var(--col-text-muted);margin-bottom:4px;">Otázka ${qCurStep+1} z ${topic.questions.length}</div>
        <div class="prompt-box" style="font-size:20px;color:#fff;">${q.prompt}</div>
        <div class="grid-2" style="margin-top:10px;">
          ${q.options.map((opt, i) => `
            <div class="opt-btn ${qAnswered ? (i === q.correctIdx ? 'correct' : 'wrong') : ''}" onclick="clickQuizOpt(${i})">
              ${opt}
            </div>
          `).join('')}
        </div>
        ${qAnswered ? `<div class="action-btn" onclick="nextQuizStep()">DALŠÍ ➔</div>` : ''}
      `;
    }

    // 6. POSLOUPNOSTI NA ČAS (S NAPOVÍDÁNÍM)
    else if (selectedGame === "SEQ") {
      const isFinished = seqTargetIdx >= topic.items.length;
      const targetWord = topic.items[seqTargetIdx];

      main.innerHTML = `
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--col-text-muted);">
          <span>Položka ${Math.min(seqTargetIdx+1, topic.items.length)} z ${topic.items.length} ${seqHintActive ? '<b style="color:var(--col-yellow);">[NÁPOVĚDA]</b>' : ''}</span>
          <span id="seq-timer" style="color:var(--col-yellow);font-weight:bold;">0.0 s</span>
        </div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}" style="margin:8px 0;min-height:56px;color:#fff;font-size:22px;">
          ${topic.items.slice(0, seqTargetIdx).join(' ')} 
          <span style="color:var(--col-yellow);">${seqHintActive ? `[ ${targetWord}! ]` : '[ ??? ]'}</span>
        </div>
        ${!isFinished ? `
          <div class="grid-2">
            ${seqSlots.map((itemIdx, slot) => {
              const isHintSlot = (seqHintActive && itemIdx === seqTargetIdx);
              return `
                <div id="seq-btn-${slot}" class="opt-btn ${isHebrew ? 'hebrew' : ''} ${isHintSlot ? 'hint' : ''}" onclick="clickSeqSlot(${slot})">
                  ${itemIdx !== -1 ? topic.items[itemIdx] : ''}
                </div>
              `;
            }).join('')}
          </div>
        ` : `
          <div class="action-btn green" onclick="initSequence();renderActiveGame();">DOKONČENO! HRÁT ZNOVU</div>
        `}
      `;
    }
  }

  // KARTY
  function vCardPrev() {
    const topic = getActiveTopic();
    vCardIdx = (vCardIdx + topic.words.length - 1) % topic.words.length;
    renderActiveGame();
  }
  function vCardNext() {
    const topic = getActiveTopic();
    vCardIdx = (vCardIdx + 1) % topic.words.length;
    renderActiveGame();
  }

  // ADAPTIVNÍ ZKOUŠENÍ
  function answerAdaptive(known) {
    recordWordResult(known);
    vQuizRevealed = false;
    pickNextVocabWord();
    renderActiveGame();
  }

  // SKLÁDÁNÍ SLOVA (SCRAMBLE)
  function initScramble() {
    const topic = getActiveTopic();
    const w = topic.words[vCurrentWord];
    scramblePlaced = [];
    scrambleHadMistake = false;
    scrambleDone = false;

    const graphemes = getGraphemes(w.foreign);
    scrambleLetters = graphemes.map(ch => ({ ch, used: false })).sort(() => Math.random() - 0.5);
  }

  function clickScrambleLetter(idx) {
    if (scrambleDone) return;
    const topic = getActiveTopic();
    const item = scrambleLetters[idx];
    if (item.used) return;

    const w = topic.words[vCurrentWord];
    const targetGraphemes = getGraphemes(w.foreign);
    const expected = targetGraphemes[scramblePlaced.length];

    if (item.ch === expected) {
      sndOk();
      item.used = true;
      scramblePlaced.push(item.ch);

      if (scramblePlaced.length === targetGraphemes.length) {
        scrambleDone = true;
        // Evidujeme úspěch nebo chybu podle toho, jestli se během skládání spletl!
        recordWordResult(!scrambleHadMistake);
      }
    } else {
      sndErr();
      scrambleHadMistake = true; // Zaznamenána chyba!
    }
    renderActiveGame();
  }

  function nextScrambleStep() {
    pickNextVocabWord();
    initScramble();
    renderActiveGame();
  }

  // DOPLŇOVÁNÍ PÍSMENE
  function initMissing() {
    const topic = getActiveTopic();
    const w = topic.words[vCurrentWord];
    const letters = getGraphemes(w.foreign);
    missingSlot = Math.floor(Math.random() * letters.length);
    const correctCh = letters[missingSlot];
    missingChosen = -1;

    // Generování 3 možností
    const alphabet = "abcdefghijklmnopqrstuvwxyz";
    missingChoices = [correctCh];
    while (missingChoices.length < 3) {
      let r = alphabet[Math.floor(Math.random() * alphabet.length)];
      if (!missingChoices.includes(r)) missingChoices.push(r);
    }
    missingChoices.sort(() => Math.random() - 0.5);
  }

  function clickMissingOption(idx) {
    if (missingChosen !== -1) return;
    missingChosen = idx;
    const topic = getActiveTopic();
    const w = topic.words[vCurrentWord];
    const letters = getGraphemes(w.foreign);
    const isCorrect = missingChoices[idx] === letters[missingSlot];

    recordWordResult(isCorrect);
    renderActiveGame();
  }

  function nextMissingStep() {
    pickNextVocabWord();
    initMissing();
    renderActiveGame();
  }

  // KVÍZ
  function clickQuizOpt(idx) {
    if (qAnswered) return;
    const topic = getActiveTopic();
    const q = topic.questions[qCurStep];
    qAnswered = true;
    if (idx === q.correctIdx) { sndOk(); addReward(1, topic.title); }
    else sndErr();
    renderActiveGame();
  }
  function nextQuizStep() {
    const topic = getActiveTopic();
    qCurStep++;
    qAnswered = false;
    if (qCurStep >= topic.questions.length) setScreen("SELECT_TOPIC");
    else renderActiveGame();
  }

  // SEKVENČNÍ HRA S NÁPOVĚDOU
  function resetInactivityTimer() {
    if (seqInactivityTimer) clearTimeout(seqInactivityTimer);
    seqInactivityTimer = setTimeout(() => {
      seqHintActive = true;
      renderActiveGame();
    }, 3000);
  }

  function initSequence() {
    const topic = getActiveTopic();
    seqTargetIdx = 0;
    seqHintActive = false;
    seqSlots = [-1, -1, -1, -1];
    seqSlots[0] = 0;
    if (topic.items.length > 1) seqSlots[1] = 1;
    for (let s = 2; s < Math.min(4, topic.items.length); s++) seqSlots[s] = s;
    seqSlots.sort(() => Math.random() - 0.5);

    seqStartTime = Date.now();
    if (seqTimerInterval) clearInterval(seqTimerInterval);
    seqTimerInterval = setInterval(() => {
      const el = document.getElementById("seq-timer");
      if (el && seqTargetIdx < topic.items.length) {
        el.innerText = ((Date.now() - seqStartTime) / 1000).toFixed(1) + " s";
      }
    }, 100);

    resetInactivityTimer();
  }

  function clickSeqSlot(slot) {
    const topic = getActiveTopic();
    const btnEl = document.getElementById(`seq-btn-${slot}`);

    if (seqSlots[slot] === seqTargetIdx) {
      sndOk();
      seqTargetIdx++;
      seqHintActive = false;

      if (seqTargetIdx >= topic.items.length) {
        clearInterval(seqTimerInterval);
        if (seqInactivityTimer) clearTimeout(seqInactivityTimer);
        sndFanfare();
        addReward(3, topic.title);
      } else {
        const next = seqTargetIdx + 1;
        seqSlots[slot] = next < topic.items.length ? next : -1;
        resetInactivityTimer();
      }
      renderActiveGame();
    } else {
      sndErr();
      if (btnEl) {
        btnEl.classList.add("wrong");
        setTimeout(() => { if (btnEl) btnEl.classList.remove("wrong"); }, 250);
      }
      seqHintActive = true;
      resetInactivityTimer();
      renderActiveGame();
    }
  }

  loadData();
</script>
</body>
</html>
