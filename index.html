<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Výukový Systém</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Výuka">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1528">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --col-bg: #0b1528;
      --col-card: #18263e;
      --col-card-border: #31507d;
      --col-active-tab: #00bcd4;
      --col-green: #22c55e;
      --col-red: #ef4444;
      --col-yellow: #facc15;
      --col-orange: #f97316;
      --col-text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Roboto', sans-serif; }
    body { background-color: #030712; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #ffffff; }
    #app-container {
      width: 100vw; max-width: 680px; height: 100vh; max-height: 600px;
      background-color: var(--col-bg); display: flex; flex-direction: column;
      border: 2px solid var(--col-card-border); border-radius: 12px; overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    @media (max-width: 680px), (max-height: 600px) {
      #app-container { border-radius: 0; border: none; max-width: 100vw; max-height: 100vh; }
    }
    header { height: 48px; background-color: var(--col-card); border-bottom: 2px solid var(--col-card-border); display: flex; align-items: center; padding: 0 8px; gap: 6px; }
    .nav-btn { background: var(--col-active-tab); color: #fff; border: 1px solid #fff; border-radius: 6px; height: 34px; min-width: 38px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; font-size: 15px; }
    .badge { background: #242c3a; border: 1px solid var(--col-card-border); padding: 0 8px; height: 32px; display: flex; align-items: center; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; max-width: 130px; }
    .badge.active { background: var(--col-active-tab); border-color: #fff; }
    .spacer { flex: 1; }
    .tts-toggle-btn { background: #24344d; border: 1px solid var(--col-card-border); color: #fff; border-radius: 6px; padding: 4px 6px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 3px; }
    .tts-toggle-btn.active { background: var(--col-green); border-color: #fff; }
    .study-timer-box { background: #101c2e; border: 1px solid var(--col-card-border); padding: 4px 7px; border-radius: 6px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .study-timer-box.bonus { border-color: var(--col-yellow); color: var(--col-yellow); background: #2d2605; }
    .study-timer-box.paused { border-color: var(--col-orange); color: var(--col-orange); }
    main { flex: 1; padding: 12px; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
    footer { height: 32px; background-color: var(--col-card); border-top: 1px solid var(--col-card-border); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12px; color: var(--col-yellow); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile { background-color: var(--col-card); border: 1px solid var(--col-card-border); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; text-align: center; padding: 10px; transition: transform 0.05s, border-color 0.1s; }
    .tile:active { transform: scale(0.97); border-color: #fff; }
    .tile h2 { font-size: 17px; color: #fff; margin-bottom: 4px; }
    .tile p { font-size: 12px; color: var(--col-text-muted); }
    .bargraph-container { background: #111a2a; border: 1px solid var(--col-card-border); border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
    .bargraph-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; }
    .bargraph-track { width: 100%; height: 10px; background: #1e293b; border-radius: 5px; overflow: hidden; border: 1px solid #334155; }
    .bargraph-fill { height: 100%; background: linear-gradient(90deg, var(--col-active-tab), var(--col-green)); border-radius: 5px; transition: width 0.3s ease; }
    .prompt-box { background: var(--col-card); border: 1px solid var(--col-card-border); border-radius: 10px; padding: 14px; text-align: center; font-size: 22px; font-weight: 500; color: var(--col-yellow); margin-bottom: 10px; position: relative; }
    .hebrew-text { font-family: 'Tinos', serif; direction: rtl; font-size: 32px !important; line-height: 1.4; }
    .audio-btn { position: absolute; right: 12px; top: 12px; font-size: 20px; cursor: pointer; opacity: 0.8; }
    .action-btn { background: var(--col-active-tab); border: 1px solid #fff; color: #fff; padding: 12px; border-radius: 8px; font-size: 17px; font-weight: bold; text-align: center; cursor: pointer; margin-top: 8px; }
    .action-btn.green { background: var(--col-green); }
    .action-btn.red { background: var(--col-red); }
    .opt-btn { background: var(--col-card); border: 1px solid var(--col-active-tab); color: #fff; padding: 12px 6px; border-radius: 8px; font-size: 18px; text-align: center; cursor: pointer; font-weight: 500; display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s; }
    .opt-btn.correct { background: var(--col-green) !important; border-color: #fff; }
    .opt-btn.wrong { background: var(--col-red) !important; border-color: #fff; }
    .slots-row, .letters-row { display: flex; justify-content: center; gap: 8px; margin: 8px auto; flex-wrap: wrap; max-width: 580px; }
    .letter-slot { min-width: 50px; height: 52px; padding: 0 10px; background: var(--col-card); border: 2px solid var(--col-active-tab); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
    .letter-slot.word-slot { min-width: 80px; font-size: 19px; }
    .letter-slot.filled { background: #143c28; border-color: var(--col-green); color: var(--col-green); }
    .letter-tile { min-width: 50px; height: 52px; padding: 0 10px; background: var(--col-card); border: 2px solid var(--col-active-tab); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.3); }
    .letter-tile.word-tile { min-width: 80px; font-size: 19px; padding: 6px 12px; }
    .letter-tile.used { background: #181c24; border-color: #282d37; color: #4b5563; cursor: default; box-shadow: none; }
    .pexeso-grid { display: grid; gap: 10px; width: 100%; flex: 1; min-height: 340px; margin: 4px 0; }
    .pexeso-card { background: var(--col-card); border: 2px solid var(--col-card-border); border-radius: 10px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px 4px; cursor: pointer; font-size: 16px; font-weight: bold; color: #fff; }
    .pexeso-card.hidden { background: #121c2c; color: var(--col-text-muted); font-size: 26px; }
    .pexeso-card.flipped { background: #1d3557; border-color: var(--col-active-tab); color: #fff; }
    .pexeso-card.matched { background: #143c28; border-color: var(--col-green); color: var(--col-green); cursor: default; }
    .filter-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: #101b2d; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    .toggle-btn { background: #24344d; color: #fff; border: 1px solid var(--col-card-border); padding: 4px 10px; border-radius: 6px; cursor: pointer; }
    .toggle-btn.on { background: var(--col-active-tab); border-color: #fff; }
    .streak-badge { color: var(--col-orange); font-weight: bold; font-size: 13px; margin-left: 4px; }
    /* ARKÁDA */
    .arcade-arena { flex: 1; position: relative; background: radial-gradient(circle at 50% 30%, #11223d 0%, #080f1e 100%); border: 2px solid var(--col-card-border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-height: 380px; }
    .arcade-top-bar { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: rgba(11, 21, 40, 0.7); border-bottom: 1px solid var(--col-card-border); font-size: 14px; font-weight: bold; z-index: 10; }
    .arcade-playfield { flex: 1; position: relative; overflow: hidden; }
    .arcade-danger-line { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: repeating-linear-gradient(45deg, #ef4444, #ef4444 10px, #7f1d1d 10px, #7f1d1d 20px); opacity: 0.8; }
    .falling-item { position: absolute; left: 50%; transform: translateX(-50%); background: #192a47; border: 2px solid var(--col-active-tab); box-shadow: 0 6px 16px rgba(0, 188, 212, 0.35); border-radius: 10px; padding: 8px 18px; text-align: center; white-space: nowrap; pointer-events: none; transition: transform 0.15s, background-color 0.15s; }
    .falling-item.hit { background-color: var(--col-green) !important; border-color: #fff !important; transform: translateX(-50%) scale(1.15) !important; }
    .falling-item.miss { background-color: var(--col-red) !important; border-color: #fff !important; transform: translateX(-50%) scale(1.05) !important; }
    .falling-main-word { font-size: 26px; font-weight: bold; color: #fff; }
    .falling-sub-word { font-size: 13px; color: var(--col-yellow); margin-top: 2px; }
    .arcade-bottom-bar { padding: 10px; background: rgba(11, 21, 40, 0.9); border-top: 1px solid var(--col-card-border); display: flex; gap: 10px; z-index: 10; }
    .arcade-btn { flex: 1; height: 62px; background: var(--col-card); border: 2px solid var(--col-active-tab); border-radius: 10px; color: #fff; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .arcade-btn:active { transform: scale(0.94); background: var(--col-active-tab); }
  </style>

  <!-- DIAGNOSTICKÝ DETEKTOR CHYB -->
  <script>
    window.addEventListener('error', function(e) {
      const m = document.getElementById('main-content');
      if (m) {
        m.innerHTML = '<div style="background:#ef4444;color:#fff;padding:15px;border-radius:8px;margin:20px;text-align:left;">' +
          '<b>Chyba v JavaScriptu:</b><br>' + e.message + '<br><small>' + (e.filename || '') + ':' + e.lineno + '</small></div>';
      }
    });
  </script>
</head>
<body>

<div id="app-container">
  <header>
    <div id="btn-back" class="nav-btn" onclick="goBack()">&lt;</div>
    <div id="badge-user" class="badge" onclick="setScreen('SELECT_USER')">Uživatel</div>
    <div id="badge-subj" class="badge" style="display:none;" onclick="setScreen('SELECT_GROUP')">Předmět</div>
    <div id="badge-group" class="badge" style="display:none;" onclick="setScreen('SELECT_GAME')">Skupina</div>
    <div class="spacer"></div>
    <div id="btn-tts-auto" class="tts-toggle-btn active" onclick="toggleAutoTTS()" title="Automatické čtení">🔊 Auto</div>
    <div id="study-timer" class="study-timer-box" title="Čas studia dnes">⏱️ 00:00 / 15:00</div>
    <div class="nav-btn" onclick="syncData()" title="Synchronizovat">🔄</div>
  </header>

  <main id="main-content">
    <div style="text-align:center; margin-top:50px; color:var(--col-text-muted);">
      Načítám výuku...
    </div>
  </main>

  <footer>
    <div id="footer-user">Žák: --</div>
    <div id="footer-status" style="color:var(--col-active-tab);cursor:pointer;" onclick="forceHardReload()">v4.5 (Restart)</div>
    <div id="footer-goal">0 / 15 min ⏱️</div>
  </footer>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxaxBIXP-ECpWstcqRDw8RuT_ds6UwcplU_3pZ9_-ksELN5FVeGt5EHjjexkJVmx1FR_w/exec";

  let appData = { users: [], progress: {}, items: [] };
  let currentUser = JSON.parse(localStorage.getItem("cur_user") || 'null');
  let filterExactGradeOnly = true;
  let viewMode = "LESSONS";

  let currentScreen = "SELECT_USER";
  let selectedSubject = "";
  let selectedGroupKey = "";
  let activeItems = [];
  let selectedGame = "";
  let testingDirection = localStorage.getItem("testing_dir") || "DIR_OUT";

  function forceHardReload() {
    window.location.href = window.location.origin + window.location.pathname + '?reload=' + Date.now();
  }

  function cleanCzechTranslation(text) {
    if (!text) return "";
    return text.replace(/\s*\([^)]*r\.\)/gi, '').replace(/\s*\((sg|pl)\.\)/gi, '').trim();
  }

  function getVocabItems() { return (activeItems || []).filter(it => it.type === "SLOVO"); }
  function getQuizItems()  { return (activeItems || []).filter(it => it.type === "KVIZ"); }
  function getSeqItems()   { return (activeItems || []).filter(it => it.type === "RADA"); }

  function getAdaptiveWindowSize(grade) {
    const g = parseInt(grade) || 2;
    if (g >= 90) return 12;
    if (g >= 10) return 10;
    return Math.max(3, g);
  }

  function getGraphemes(str) {
    if (window.Intl && Intl.Segmenter) {
      const segmenter = new Intl.Segmenter('und', { granularity: 'grapheme' });
      return Array.from(segmenter.segment(str), s => s.segment);
    }
    return str.split('');
  }

  function getQuickChoiceMode() {
    const vItems = getVocabItems();
    const s = (selectedSubject || '').toLowerCase();
    if (s.includes("nemc") || s === "de") {
      if (vItems.filter(it => /^(der|die|das)\s/i.test(it.question)).length >= 3) return "DER_DIE_DAS";
    }
    if (s.includes("angli") || s === "en") {
      if (vItems.filter(it => /^(a|an)\s/i.test(it.question)).length >= 3) return "A_AN";
    }
    if (s.includes("cest") || s === "cs") {
      if (vItems.filter(it => it.question.includes('_')).length >= 3) return "I_Y";
    }
    return null;
  }

  // --- ČASOVAČ ---
  function getStudyTimeKey(userName) {
    const d = new Date();
    return `study_sec_${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}_${(userName || 'user').toLowerCase().trim()}`;
  }
  function loadUserStudyTime(userName) {
    if (!userName) return 0;
    return Number(localStorage.getItem(getStudyTimeKey(userName)) || 0);
  }
  function getUserStreak(userName) {
    if (!userName) return 0;
    return Number(localStorage.getItem(`streak_${userName.toLowerCase().trim()}`) || 0);
  }

  let todaySecondsStudied = currentUser ? loadUserStudyTime(currentUser.name) : 0;
  let lastUserActivityTime = Date.now();
  let isTimerPaused = false;

  function registerUserAction() {
    lastUserActivityTime = Date.now();
    if (isTimerPaused) { isTimerPaused = false; updateStudyTimerUI(); }
  }
  window.addEventListener('click', registerUserAction, true);
  window.addEventListener('touchstart', registerUserAction, true);

  setInterval(() => {
    if (currentScreen === "PLAYING" && currentUser) {
      const idleTime = Date.now() - lastUserActivityTime;
      if (idleTime < 15000) {
        todaySecondsStudied++;
        localStorage.setItem(getStudyTimeKey(currentUser.name), todaySecondsStudied);
        isTimerPaused = false;
      } else {
        isTimerPaused = true;
      }
    } else {
      isTimerPaused = true;
    }
    updateStudyTimerUI();
  }, 1000);

  function updateStudyTimerUI() {
    const box = document.getElementById("study-timer");
    const footerGoal = document.getElementById("footer-goal");
    if (!box || !currentUser) return;
    const targetSec = (currentUser.targetMinutes || 15) * 60;
    const format = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    if (footerGoal) footerGoal.innerText = `${Math.floor(todaySecondsStudied/60)} / ${currentUser.targetMinutes || 15} min ⏱️`;
    if (currentScreen !== "PLAYING" || isTimerPaused) {
      box.className = "study-timer-box paused"; box.innerText = `⏸️ ${format(todaySecondsStudied)} / ${format(targetSec)}`;
    } else if (todaySecondsStudied < targetSec) {
      box.className = "study-timer-box"; box.innerText = `⏱️ ${format(todaySecondsStudied)} / ${format(targetSec)}`;
    } else {
      box.className = "study-timer-box bonus"; box.innerText = `★ BONUS: +${format(todaySecondsStudied - targetSec)}`;
    }
  }

  // --- AUDIO & TTS ---
  let isAutoTTS = localStorage.getItem("auto_tts") !== "false";
  function toggleAutoTTS() { isAutoTTS = !isAutoTTS; localStorage.setItem("auto_tts", isAutoTTS); updateTTSBtnUI(); }
  function updateTTSBtnUI() {
    const btn = document.getElementById("btn-tts-auto");
    if (btn) { btn.className = isAutoTTS ? "tts-toggle-btn active" : "tts-toggle-btn"; btn.innerText = isAutoTTS ? "🔊 Auto" : "🔇 Vyp"; }
  }
  function speakWord(text, subjectName) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    let toSpeak = text.replace(/\//g, ' or ').replace(/-/g, ', ');
    const u = new SpeechSynthesisUtterance(toSpeak);
    const s = (subjectName || selectedSubject || '').toLowerCase();
    let targetLang = 'cs-CZ';
    if (s.includes('angli') || s === 'en') targetLang = 'en-US';
    else if (s.includes('nemc') || s === 'de') targetLang = 'de-DE';
    else if (s.includes('hebr') || s === 'he') targetLang = 'he-IL';
    u.lang = targetLang; u.rate = 0.86;
    window.speechSynthesis.speak(u);
  }

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playTone(freq, type, duration) {
    try {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }
  function sndOk() { playTone(880, 'sine', 0.08); setTimeout(() => playTone(1320, 'sine', 0.1), 80); }
  function sndErr() { playTone(220, 'square', 0.15); }
  function sndFanfare() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.1), i * 110)); }

  function addReward(count = 1, section = "Lekce") {
    if (!currentUser) return;
    currentUser.stars = (currentUser.stars || 0) + count;
    localStorage.setItem("cur_user", JSON.stringify(currentUser));
    updateFooter();
    try {
      const fd = new URLSearchParams();
      fd.append("action", "log_activity"); fd.append("user", currentUser.name);
      fd.append("subject", selectedSubject); fd.append("section", section);
      fd.append("stars", count); fd.append("minutes", (todaySecondsStudied / 60).toFixed(1));
      fetch(API_URL, { method: "POST", mode: "no-cors", body: fd });
    } catch(e) {}
  }

  function updateFooter() {
    if (!currentUser) return;
    const g = parseInt(currentUser.grade) || 2;
    const gradeLabel = g >= 10 && g < 90 ? `${g - 9}. ročník SŠ` : (g <= 9 ? `${g}. tř.` : 'Dospělý');
    document.getElementById("footer-user").innerHTML = `${currentUser.name} (${gradeLabel}) <span class="streak-badge">🔥 ${getUserStreak(currentUser.name)}</span>`;
  }

  // --- DATA SYNC S TIMEOUTEM (NEZAMRZNE) ---
  async function loadData() {
    const cached = localStorage.getItem("app_data");
    if (cached) {
      try {
        appData = JSON.parse(cached);
        if (!appData.items) appData.items = [];
        renderScreen(); // OKAMŽITÝ NÁBĚH
      } catch(e) {}
    } else {
      renderScreen();
    }
    await syncData();
  }

  async function syncData() {
    const statusEl = document.getElementById("footer-status");
    if (statusEl) statusEl.innerText = "Stahuji...";
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000); // 4s timeout
      const res = await fetch(API_URL, { signal: controller.signal });
      clearTimeout(timeoutId);
      const json = await res.json();
      if (json && json.items) {
        appData = json;
        localStorage.setItem("app_data", JSON.stringify(json));
        if (statusEl) statusEl.innerText = `OK: ${appData.items.length} úloh`;
      }
    } catch(e) {
      if (statusEl) statusEl.innerText = "Offline";
    }
    renderScreen();
  }

  async function saveWordMasteryToGoogle(itemQuestion, masteryLevel, direction) {
    if (!currentUser) return;
    try {
      const uKey = currentUser.name.toLowerCase().trim();
      const compKey = `${selectedSubject}:::${itemQuestion}:::${direction}`;
      if (!appData.progress) appData.progress = {};
      if (!appData.progress[uKey]) appData.progress[uKey] = {};
      appData.progress[uKey][compKey] = masteryLevel;
      localStorage.setItem("app_data", JSON.stringify(appData));
      const fd = new URLSearchParams();
      fd.append("action", "save_mastery"); fd.append("user", currentUser.name);
      fd.append("subject", selectedSubject); fd.append("foreign", itemQuestion);
      fd.append("mastery", masteryLevel); fd.append("direction", direction);
      fetch(API_URL, { method: "POST", mode: "no-cors", body: fd });
    } catch(e) {}
  }

  function getSavedMastery(itemQuestion, direction) {
    if (!currentUser || !appData.progress) return 0;
    const uKey = currentUser.name.toLowerCase().trim();
    const userMap = appData.progress[uKey];
    if (!userMap) return 0;
    const compKey = `${selectedSubject}:::${itemQuestion}:::${direction}`;
    if (userMap[compKey] !== undefined) return Number(userMap[compKey]);
    return Number(userMap[itemQuestion] || 0);
  }

  function getGroupMasteryPercent(groupItems, subjName) {
    if (!currentUser || !groupItems || groupItems.length === 0) return 0;
    const vList = groupItems.filter(it => it.type === "SLOVO");
    if (vList.length === 0) return 0;
    let points = 0;
    vList.forEach(it => {
      points += getSavedMastery(it.question, "DIR_OUT") + getSavedMastery(it.question, "DIR_IN");
    });
    return Math.min(100, Math.round((points / (vList.length * 4)) * 100));
  }

  function goBack() {
    stopArcadeLoop();
    if (currentScreen === "PLAYING" && selectedGame === "PEXESO") setScreen("SELECT_PEXESO_SIZE");
    else if (currentScreen === "SELECT_PEXESO_SIZE") setScreen("SELECT_GAME");
    else if (currentScreen === "PLAYING") {
      if (selectedSubject === "Matematika") setScreen("SELECT_MATH_OP");
      else setScreen("SELECT_GAME");
    }
    else if (currentScreen === "SELECT_MATH_OP") setScreen("SELECT_SUBJECT");
    else if (currentScreen === "SELECT_GAME") setScreen("SELECT_GROUP");
    else if (currentScreen === "SELECT_GROUP") setScreen("SELECT_SUBJECT");
    else if (currentScreen === "SELECT_SUBJECT") setScreen("SELECT_USER");
  }

  function setScreen(scr) { currentScreen = scr; registerUserAction(); renderScreen(); }

  function selectUser(name, grade, targetMinutes) {
    currentUser = { name, grade: parseInt(grade) || 2, targetMinutes: parseInt(targetMinutes) || 15, stars: 0 };
    localStorage.setItem("cur_user", JSON.stringify(currentUser));
    todaySecondsStudied = loadUserStudyTime(currentUser.name);
    isTimerPaused = false;
    updateStudyTimerUI();
    setScreen("SELECT_SUBJECT");
  }

  function chooseSubject(subj) { selectedSubject = subj; setScreen("SELECT_GROUP"); }
  function chooseGroup(groupName) {
    selectedGroupKey = groupName;
    const userG = parseInt(currentUser.grade) || 2;
    activeItems = (appData.items || []).filter(it => {
      if (it.subject !== selectedSubject) return false;
      if (filterExactGradeOnly && userG < 90 && (parseInt(it.minGrade) || 2) !== userG) return false;
      return (viewMode === "LESSONS" ? it.lesson : it.topic) === groupName;
    });
    setScreen("SELECT_GAME");
  }

  function toggleTestingDirection() {
    testingDirection = (testingDirection === "DIR_OUT") ? "DIR_IN" : "DIR_OUT";
    localStorage.setItem("testing_dir", testingDirection);
    initGameState();
    renderScreen();
  }

  // ==========================================
  // MATEMATIKA S VÝBĚREM OPERACÍ
  // ==========================================
  let mathOperation = "MIX_G2";
  let mathTask = { q: "2 + 2 = ?", ans: 4, opts: [2, 3, 4, 5] };
  let mathStreak = 0;
  let mathChosenAnswer = null;

  function openMathOperationSelect() { selectedSubject = "Matematika"; setScreen("SELECT_MATH_OP"); }

  function renderMathOpSelection() {
    const main = document.getElementById("main-content");
    const g = parseInt(currentUser.grade) || 2;
    let ops = (g <= 2) ? [
      { id: "ADD_SUB_20_NO", title: "+ a - do 20 bez přechodu", desc: "12 + 5, 17 - 4" },
      { id: "ADD_SUB_20_YES", title: "+ a - do 20 s přechodem", desc: "8 + 7, 15 - 9" },
      { id: "TENS_100", title: "Desítky do 100", desc: "30 + 40, 90 - 50" },
      { id: "MUL_SMALL", title: "Malá násobilka (2, 3, 4, 5)", desc: "Základy násobení" },
      { id: "COMPARE", title: "Porovnávání čísel (<, =, >)", desc: "48 ... 84" }
    ] : [
      { id: "MUL_FULL", title: "Kompletní násobilka (1–10)", desc: "7 · 8, 9 · 6" },
      { id: "DIV_EXACT", title: "Dělení beze zbytku", desc: "56 : 7, 72 : 9" },
      { id: "ADD_1000", title: "+ a - do 1 000", desc: "350 + 280" }
    ];

    main.innerHTML = `
      <h2 style="font-size:18px;margin-bottom:12px;text-align:center;color:var(--col-yellow);">Vyber matematiku:</h2>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${ops.map(o => `
          <div class="tile" style="flex-direction:row;justify-content:space-between;padding:12px;text-align:left;" onclick="startMathPractice('${o.id}', '${o.title}')">
            <div><h2>${o.title}</h2><p>${o.desc}</p></div>
            <span style="color:var(--col-active-tab);font-weight:bold;font-size:20px;">➔</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  function startMathPractice(opId, opTitle) {
    mathOperation = opId;
    selectedGroupKey = opTitle;
    selectedGame = "PROCEDURAL_MATH";
    mathStreak = 0;
    generateMathTask();
    setScreen("PLAYING");
  }

  function generateMathTask() {
    mathChosenAnswer = null;
    let a, b, ans;
    if (mathOperation === "ADD_SUB_20_NO") {
      a = 10 + Math.floor(Math.random() * 8); b = Math.floor(Math.random() * (19 - a)) + 1;
      mathTask = { q: `${a} + ${b} = ?`, ans: a + b, opts: makeNumOpts(a + b) };
    } else if (mathOperation === "ADD_SUB_20_YES") {
      a = Math.floor(Math.random() * 5) + 6; b = Math.floor(Math.random() * 5) + 5;
      mathTask = { q: `${a} + ${b} = ?`, ans: a + b, opts: makeNumOpts(a + b) };
    } else if (mathOperation === "TENS_100") {
      a = (Math.floor(Math.random() * 7) + 1) * 10; b = (Math.floor(Math.random() * (9 - a/10)) + 1) * 10;
      mathTask = { q: `${a} + ${b} = ?`, ans: a + b, opts: makeNumOpts(a + b, 10) };
    } else if (mathOperation === "MUL_SMALL") {
      a = Math.floor(Math.random() * 4) + 2; b = Math.floor(Math.random() * 10) + 1;
      mathTask = { q: `${a} · ${b} = ?`, ans: a * b, opts: makeNumOpts(a * b) };
    } else if (mathOperation === "COMPARE") {
      a = Math.floor(Math.random() * 90) + 10; b = Math.floor(Math.random() * 90) + 10;
      ans = a < b ? "<" : (a > b ? ">" : "=");
      mathTask = { q: `${a}  ___  ${b}`, ans: ans, opts: ["<", "=", ">"] };
    } else if (mathOperation === "DIV_EXACT") {
      b = Math.floor(Math.random() * 8) + 2; ans = Math.floor(Math.random() * 9) + 2;
      mathTask = { q: `${b * ans} : ${b} = ?`, ans: ans, opts: makeNumOpts(ans) };
    } else {
      a = Math.floor(Math.random() * 9) + 2; b = Math.floor(Math.random() * 9) + 2;
      mathTask = { q: `${a} · ${b} = ?`, ans: a * b, opts: makeNumOpts(a * b) };
    }
  }

  function makeNumOpts(correct, step = 1) {
    const opts = [correct];
    while (opts.length < 4) {
      const delta = (Math.floor(Math.random() * 5) - 2) * step;
      const fake = correct + (delta === 0 ? step : delta);
      if (!opts.includes(fake) && fake >= 0) opts.push(fake);
    }
    return opts.sort(() => Math.random() - 0.5);
  }

  function clickMathChoice(opt) {
    if (mathChosenAnswer !== null) return;
    mathChosenAnswer = opt;
    if (String(opt) === String(mathTask.ans)) {
      sndOk(); mathStreak++; addReward(1, "Matematika");
    } else {
      sndErr(); mathStreak = 0;
    }
    renderActiveGame();
  }

  // ==========================================
  // ARKÁDA: PADAJÍCÍ SLOVA (METEORITY)
  // ==========================================
  let arcadeDeck = [];
  let arcadeCurrent = null;
  let arcadeLives = 3;
  let arcadeScore = 0;
  let arcadeLevel = 1;
  let arcadeY = 0;
  let arcadeSpeed = 0.8;
  let arcadeAnimId = null;
  let arcadeState = "PLAYING";

  function stopArcadeLoop() {
    if (arcadeAnimId) { cancelAnimationFrame(arcadeAnimId); arcadeAnimId = null; }
  }

  function startArcadeGame() {
    stopArcadeLoop();
    const vItems = getVocabItems();
    const mode = getQuickChoiceMode();
    arcadeDeck = vItems.filter(it => {
      if (mode === "DER_DIE_DAS") return /^(der|die|das)\s/i.test(it.question);
      if (mode === "A_AN") return /^(a|an)\s/i.test(it.question);
      if (mode === "I_Y") return it.question.includes('_');
      return false;
    }).sort(() => Math.random() - 0.5);

    if (arcadeDeck.length === 0) { alert("Málo vhodných slov v této lekci."); return; }
    arcadeLives = 3; arcadeScore = 0; arcadeLevel = 1; arcadeSpeed = 0.8; arcadeState = "PLAYING";
    selectedGame = "ARCADE";
    setScreen("PLAYING");
    spawnArcadeWord();
  }

  function spawnArcadeWord() {
    if (arcadeLives <= 0) { arcadeState = "GAMEOVER"; stopArcadeLoop(); renderActiveGame(); return; }
    if (arcadeDeck.length === 0) {
      const vItems = getVocabItems();
      arcadeDeck = [...vItems].sort(() => Math.random() - 0.5);
    }
    arcadeCurrent = arcadeDeck.pop();
    arcadeY = 5;
    arcadeState = "PLAYING";
    renderActiveGame();
    runArcadeLoop();
  }

  function runArcadeLoop() {
    stopArcadeLoop();
    function step() {
      if (currentScreen !== "PLAYING" || selectedGame !== "ARCADE" || arcadeState !== "PLAYING") return;
      if (!isTimerPaused) {
        arcadeY += arcadeSpeed;
        const el = document.getElementById("arcade-falling-elem");
        const playfield = document.getElementById("arcade-field");
        if (el && playfield) {
          el.style.top = arcadeY + "px";
          if (arcadeY >= playfield.clientHeight - el.clientHeight - 8) {
            handleArcadeMiss();
            return;
          }
        }
      }
      arcadeAnimId = requestAnimationFrame(step);
    }
    arcadeAnimId = requestAnimationFrame(step);
  }

  function clickArcadeChoice(choice) {
    if (arcadeState !== "PLAYING" || !arcadeCurrent) return;
    const mode = getQuickChoiceMode();
    let isCorrect = false;
    if (mode === "DER_DIE_DAS" || mode === "A_AN") isCorrect = arcadeCurrent.question.toLowerCase().startsWith(choice.toLowerCase() + " ");
    if (mode === "I_Y") isCorrect = arcadeCurrent.answer.trim().toLowerCase() === choice.toLowerCase();

    if (isCorrect) {
      arcadeState = "HIT"; stopArcadeLoop(); sndOk(); arcadeScore++; addReward(1, "Padající slova");
      if (arcadeScore % 7 === 0) { arcadeLevel++; arcadeSpeed += 0.35; sndFanfare(); }
      const el = document.getElementById("arcade-falling-elem");
      if (el) el.classList.add("hit");
      setTimeout(spawnArcadeWord, 350);
    } else {
      handleArcadeMiss();
    }
  }

  function handleArcadeMiss() {
    arcadeState = "MISS"; stopArcadeLoop(); sndErr(); arcadeLives--;
    const el = document.getElementById("arcade-falling-elem");
    if (el) {
      el.classList.add("miss");
      const m = el.querySelector(".falling-main-word");
      if (m) m.innerText = arcadeCurrent.question; // Ukáže správný tvar
    }
    if (isAutoTTS) speakWord(arcadeCurrent.question, selectedSubject);
    setTimeout(spawnArcadeWord, 1400);
  }

  // ==========================================
  // ZKOUŠENÍ Z HLAVY & OSTATNÍ HRY
  // ==========================================
  let vMastery = {}, vActivePool = 3, vCurrentWord = 0, vLastWord = -1, vCardIdx = 0, vQuizRevealed = false;
  let scrambleDeck = [], scramblePlaced = [], scrambleTiles = [], scrambleIsWordMode = false, scrambleHadMistake = false, scrambleDone = false;
  let pexesoPairCount = 4, pexesoCards = [], pexesoFlipped = [], pexesoMatched = [], pexesoLocked = false, pexesoAttempts = 0;
  let qCurStep = 0, qAnswered = false;

  function initGameState() {
    const vItems = getVocabItems();
    if (vItems.length > 0) {
      vMastery = {}; let masteredCount = 0;
      vItems.forEach((w, i) => {
        const m = getSavedMastery(w.question, testingDirection);
        vMastery[i] = m; if (m >= 2) masteredCount++;
      });
      vActivePool = Math.min(vItems.length, Math.max(getAdaptiveWindowSize(currentUser ? currentUser.grade : 2), masteredCount + 3));
      vLastWord = -1;
      if (selectedGame === "CARDS") { vCardIdx = 0; if (isAutoTTS) speakWord(vItems[0].question, selectedSubject); }
      if (selectedGame === "ADAPTIVE") pickNextAdaptiveWord();
      if (selectedGame === "SCRAMBLE") initScramble();
    }
    if (selectedGame === "QUIZ") { qCurStep = 0; qAnswered = false; }
  }

  function pickNextAdaptiveWord() {
    const vItems = getVocabItems();
    vQuizRevealed = false;
    let available = [];
    for (let i = 0; i < vActivePool; i++) { if ((vMastery[i] || 0) < 2) available.push(i); }
    if (available.length === 0) {
      for (let i = 0; i < vItems.length; i++) { if ((vMastery[i] || 0) < 2) available.push(i); }
    }
    if (available.length === 0) { vCurrentWord = -1; return; }

    let candidates = available.length > 1 && vLastWord !== -1 ? available.filter(i => i !== vLastWord) : available;
    const mistakes = candidates.filter(i => (vMastery[i] || 0) === 0);
    vCurrentWord = (mistakes.length > 0 && Math.random() < 0.75) ? mistakes[Math.floor(Math.random() * mistakes.length)] : candidates[Math.floor(Math.random() * candidates.length)];
    vLastWord = vCurrentWord;
  }

  function answerAdaptive(known) {
    const vItems = getVocabItems();
    const w = vItems[vCurrentWord];
    if (known) {
      sndOk(); addReward(1, selectedGroupKey);
      vMastery[vCurrentWord] = Math.min(2, (vMastery[vCurrentWord] || 0) + 1);
      if (vMastery[vCurrentWord] >= 2 && vActivePool < vItems.length) vActivePool++;
      saveWordMasteryToGoogle(w.question, vMastery[vCurrentWord], testingDirection);
    } else {
      sndErr(); vMastery[vCurrentWord] = 0;
      saveWordMasteryToGoogle(w.question, 0, testingDirection);
    }
    pickNextAdaptiveWord();
    renderActiveGame();
  }

  function initScramble() {
    const vItems = getVocabItems();
    if (!scrambleDeck || scrambleDeck.length === 0) scrambleDeck = vItems.map((_, i) => i).sort(() => Math.random() - 0.5);
    vCurrentWord = scrambleDeck.pop();
    const w = vItems[vCurrentWord];
    scramblePlaced = []; scrambleHadMistake = false; scrambleDone = false;
    const raw = w.question.trim();
    if (raw.split(/\s+/).length >= 3 || raw.length > 15) {
      scrambleIsWordMode = true;
      const tokens = raw.includes('-') ? raw.split('-').map(s => s.trim()) : raw.split(/\s+/);
      scrambleTiles = tokens.map((chunk, idx) => ({ text: chunk, used: false })).sort(() => Math.random() - 0.5);
    } else {
      scrambleIsWordMode = false;
      scrambleTiles = getGraphemes(raw).map((ch, idx) => ({ text: ch, used: false })).sort(() => Math.random() - 0.5);
    }
  }

  function clickScrambleTile(idx) {
    if (scrambleDone) return;
    const item = scrambleTiles[idx];
    if (item.used) return;
    const w = getVocabItems()[vCurrentWord];
    const target = scrambleIsWordMode ? (w.question.includes('-') ? w.question.split('-').map(s=>s.trim()) : w.question.trim().split(/\s+/)) : getGraphemes(w.question.trim());

    if (item.text === target[scramblePlaced.length]) {
      sndOk(); item.used = true; scramblePlaced.push(item.text);
      if (scramblePlaced.length === target.length) {
        scrambleDone = true;
        if (!scrambleHadMistake) { addReward(1, selectedGroupKey); sndFanfare(); }
        if (isAutoTTS) speakWord(w.question, selectedSubject);
      }
    } else {
      sndErr(); scrambleHadMistake = true;
    }
    renderActiveGame();
  }

  function startPexesoGame(pairCount) {
    pexesoPairCount = pairCount; selectedGame = "PEXESO";
    const vItems = getVocabItems();
    const count = Math.min(pexesoPairCount, vItems.length);
    const shuffled = [...vItems].sort(() => Math.random() - 0.5).slice(0, count);
    pexesoCards = [];
    shuffled.forEach((w, idx) => {
      pexesoCards.push({ wordIdx: idx, text: w.question, isForeign: true });
      pexesoCards.push({ wordIdx: idx, text: cleanCzechTranslation(w.answer), isForeign: false });
    });
    pexesoCards.sort(() => Math.random() - 0.5);
    pexesoFlipped = []; pexesoMatched = []; pexesoLocked = false; pexesoAttempts = 0;
    setScreen("PLAYING");
  }

  function clickPexesoCard(idx) {
    if (pexesoLocked || pexesoFlipped.includes(idx) || pexesoMatched.includes(pexesoCards[idx].wordIdx)) return;
    pexesoFlipped.push(idx);
    if (isAutoTTS && pexesoCards[idx].isForeign) speakWord(pexesoCards[idx].text, selectedSubject);
    renderActiveGame();
    if (pexesoFlipped.length === 2) {
      pexesoAttempts++;
      const [c1, c2] = [pexesoCards[pexesoFlipped[0]], pexesoCards[pexesoFlipped[1]]];
      if (c1.wordIdx === c2.wordIdx) {
        sndOk(); pexesoMatched.push(c1.wordIdx); pexesoFlipped = [];
        if (pexesoMatched.length === Math.min(pexesoPairCount, getVocabItems().length)) {
          sndFanfare(); addReward(2, selectedGroupKey);
        }
        renderActiveGame();
      } else {
        sndErr(); pexesoLocked = true;
        setTimeout(() => { pexesoFlipped = []; pexesoLocked = false; renderActiveGame(); }, 900);
      }
    }
  }

  function startGame(game) { stopArcadeLoop(); selectedGame = game; initGameState(); setScreen("PLAYING"); }

  // ==========================================
  // HLAVNÍ RENDERÉR OBRAZOVEK
  // ==========================================

    else if (currentScreen === "SELECT_SUBJECT") {

    // 3. VÝBĚR MATEMATIKY
    else if (currentScreen === "SELECT_MATH_OP") {
      bSubj.style.display = "flex"; bSubj.innerText = "Matematika"; bGroup.style.display = "none";

    else if (currentScreen === "SELECT_GROUP") {

        const k = viewMode === "LESSONS" ? it.lesson : it.topic;
        if (!k) return;
        if (!groupsMap[k]) groupsMap[k] = { name: k, count: 0, raw: [] };
        groupsMap[k].count++; groupsMap[k].raw.push(it);
      });

      main.innerHTML = `

          <button class="toggle-btn ${viewMode==='LESSONS'?'on':''}" onclick="viewMode='LESSONS';renderScreen();">Lekce</button>

    // 5. VÝBĚR HRY
    else if (currentScreen === "SELECT_GAME") {
      bSubj.style.display = "flex"; bGroup.style.display = "flex"; bGroup.innerText = selectedGroupKey;
      const vItems = getVocabItems(), qItems = getQuizItems(), quickMode = getQuickChoiceMode();
      let html = `<div class="grid-2">`;
      if (vItems.length > 0) {
        html += `

        html += `

          </div>
        `;
      }
      if (qItems.length > 0) {
        html += `<div class="tile" style="border-color:var(--col-green);" onclick="startGame('QUIZ')"><h2 style="color:var(--col-green);">📝 Kvíz</h2><p>${qItems.length} otázek</p></div>`;
      }
      html += `</div>`;
      main.innerHTML = html;
    }

    // 6. VELIKOST PEXESA
    else if (currentScreen === "SELECT_PEXESO_SIZE") {
      bGroup.style.display = "flex"; bGroup.innerText = selectedGroupKey;
      main.innerHTML = `
        <h2 style="font-size:18px;margin-bottom:12px;text-align:center;color:var(--col-yellow);">Vyber velikost pexesa:</h2>
        <div class="grid-2">
          <div class="tile" onclick="startPexesoGame(3)"><h2>6 KARET</h2><p>3 dvojice</p></div>
          <div class="tile" onclick="startPexesoGame(4)"><h2>8 KARET</h2><p>4 dvojice</p></div>
          <div class="tile" onclick="startPexesoGame(6)"><h2>12 KARET</h2><p>6 dvojic</p></div>
          <div class="tile" onclick="startPexesoGame(8)"><h2>16 KARET</h2><p>8 dvojic</p></div>
        </div>
      `;
    }

    // 7. AKTIVNÍ HRA
    else if (currentScreen === "PLAYING") {
      bSubj.style.display = "flex"; bSubj.innerText = selectedSubject;
      bGroup.style.display = "flex"; bGroup.innerText = selectedGroupKey;
      renderActiveGame();
    }
  }

  // ==========================================
  // RENDERÉR JEDNOTLIVÝCH HER
  // ==========================================
  function renderActiveGame() {
    const main = document.getElementById("main-content");
    const vItems = getVocabItems();

    // 1. KARTY
    if (selectedGame === "CARDS") {
      const w = vItems[vCardIdx];
      main.innerHTML = `
        <div class="prompt-box">${w.question} <span class="audio-btn" onclick="speakWord('${w.question}')">🔊</span></div>
        <div class="prompt-box" style="color:#fff;">${cleanCzechTranslation(w.answer)}</div>
        <div class="grid-2">
          <div class="action-btn" onclick="vCardIdx=(vCardIdx+vItems.length-1)%vItems.length;renderActiveGame();">Předchozí</div>
          <div class="action-btn" onclick="vCardIdx=(vCardIdx+1)%vItems.length;renderActiveGame();">Další (${vCardIdx+1}/${vItems.length})</div>
        </div>
      `;
    }

    // 2. ZKOUŠENÍ
    else if (selectedGame === "ADAPTIVE") {
      if (vCurrentWord === -1) {
        main.innerHTML = `
          <div style="text-align:center;padding:30px;">
            <h2 style="color:var(--col-green);margin-bottom:10px;">VŠECHNO ZVLÁDNUTO! 🎉</h2>
            <div class="action-btn" onclick="toggleTestingDirection()">PŘEPNOUT SMĚR ⇄</div>
            <div class="action-btn green" onclick="setScreen('SELECT_GAME')">ZPĚT DO MENU</div>
          </div>
        `;
        return;
      }
      const w = vItems[vCurrentWord];
      const isDirOut = testingDirection === "DIR_OUT";
      main.innerHTML = `
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
          <span>Slovo: ${vMastery[vCurrentWord]||0}/2 ★</span>
          <button class="toggle-btn on" onclick="toggleTestingDirection()">${isDirOut?'🇨🇿 ➔ Cizí':'Cizí ➔ 🇨🇿'}</button>
        </div>
        <div class="prompt-box" style="color:#fff;">${isDirOut ? cleanCzechTranslation(w.answer) : w.question}</div>
        <div class="prompt-box" style="color:${vQuizRevealed?'var(--col-yellow)':'var(--col-text-muted)'};">
          ${vQuizRevealed ? (isDirOut ? w.question : cleanCzechTranslation(w.answer)) : '[ ? ? ? ]'}
        </div>
        ${vQuizRevealed ? `
          <div class="grid-2">
            <div class="action-btn red" onclick="answerAdaptive(false)">Nevěděl jsem (0 ★)</div>
            <div class="action-btn green" onclick="answerAdaptive(true)">Věděl jsem (+1 ★)</div>
          </div>
        ` : `<div class="action-btn" onclick="vQuizRevealed=true;renderActiveGame();">ZKONTROLOVAT</div>`}
      `;
    }

    // 3. ARKÁDA PADAJÍCÍ SLOVA
    else if (selectedGame === "ARCADE") {
      const mode = getQuickChoiceMode();
      let btns = mode === "DER_DIE_DAS" ? ['DER', 'DIE', 'DAS'] : (mode === "A_AN" ? ['A', 'AN'] : ['I / Í', 'Y / Ý']);
      if (arcadeState === "GAMEOVER") {
        main.innerHTML = `
          <div style="text-align:center;padding:35px;">
            <h2 style="color:var(--col-red);font-size:28px;">KONEC HRY! 💔</h2>
            <p style="font-size:20px;color:#fff;margin:10px 0;">Sestřeleno: <b>${arcadeScore} slov</b> (LVL ${arcadeLevel})</p>
            <div class="action-btn green" onclick="startArcadeGame()">HRÁT ZNOVU ➔</div>
            <div class="action-btn" onclick="setScreen('SELECT_GAME')">ZPĚT</div>
          </div>
        `;
        return;
      }
      let disp = arcadeCurrent ? arcadeCurrent.question.replace(/^(der|die|das|a|an)\s+/i, '') : "";
      main.innerHTML = `
        <div class="arcade-arena">
          <div class="arcade-top-bar">
            <span>${"❤️".repeat(arcadeLives)}</span>
            <span style="color:var(--col-yellow);">LVL ${arcadeLevel}</span>
            <span style="color:var(--col-active-tab);">Body: ${arcadeScore}</span>
          </div>
          <div class="arcade-playfield" id="arcade-field">
            ${arcadeCurrent ? `
              <div id="arcade-falling-elem" class="falling-item" style="top:${arcadeY}px;">
                <div class="falling-main-word">${disp}</div>
                <div class="falling-sub-word">${cleanCzechTranslation(arcadeCurrent.answer)}</div>
              </div>
            ` : ''}
            <div class="arcade-danger-line"></div>
          </div>
          <div class="arcade-bottom-bar">
            ${btns.map(b => `<div class="arcade-btn" onclick="clickArcadeChoice('${b}')">${b}</div>`).join('')}
          </div>
        </div>
      `;
    }

    // 4. MATEMATIKA
    else if (selectedGame === "PROCEDURAL_MATH") {
      const isAns = mathChosenAnswer !== null;
      main.innerHTML = `
        <div class="bargraph-header"><span>Série: ${mathStreak} 🔥</span><span style="color:var(--col-active-tab);">${selectedGroupKey}</span></div>
        <div class="prompt-box" style="font-size:36px;color:#fff;margin:20px 0;">${mathTask.q}</div>
        <div class="grid-2">
          ${mathTask.opts.map(opt => `
            <div class="opt-btn ${isAns ? (String(opt)===String(mathTask.ans)?'correct':(opt===mathChosenAnswer?'wrong':'')) : ''}" style="height:60px;font-size:26px;font-weight:bold;" onclick="clickMathChoice('${opt}')">${opt}</div>
          `).join('')}
        </div>
        ${isAns ? `<div class="action-btn ${String(mathChosenAnswer)===String(mathTask.ans)?'green':'red'}" onclick="generateMathTask();renderActiveGame();">DALŠÍ PŘÍKLAD ➔</div>` : ''}
      `;
    }

    // 5. SKLÁDÁNÍ
    else if (selectedGame === "SCRAMBLE") {
      const w = vItems[vCurrentWord];
      main.innerHTML = `
        <div class="prompt-box">Slož: <b>${cleanCzechTranslation(w.answer)}</b></div>
        <div class="slots-row">
          ${scrambleTiles.map((t, i) => `<div class="letter-slot ${scrambleIsWordMode?'word-slot':''} ${i<scramblePlaced.length?'filled':''}">${i<scramblePlaced.length?scramblePlaced[i]:'_'}</div>`).join('')}
        </div>
        ${!scrambleDone ? `
          <div class="letters-row">
            ${scrambleTiles.map((t, idx) => `<div class="letter-tile ${scrambleIsWordMode?'word-tile':''} ${t.used?'used':''}" onclick="clickScrambleTile(${idx})">${t.text}</div>`).join('')}
          </div>
        ` : `<div class="action-btn ${scrambleHadMistake?'red':'green'}" onclick="initScramble();renderActiveGame();">DALŠÍ SLOVO ➔</div>`}
      `;
    }

    // 6. PEXESO
    else if (selectedGame === "PEXESO") {
      const isDone = pexesoMatched.length === Math.min(pexesoPairCount, vItems.length);
      main.innerHTML = !isDone ? `
        <div class="pexeso-grid" style="grid-template-columns: repeat(4, 1fr);">
          ${pexesoCards.map((c, i) => {
            const m = pexesoMatched.includes(c.wordIdx), f = pexesoFlipped.includes(i);
            return `<div class="pexeso-card ${m?'matched':(f?'flipped':'hidden')}" onclick="clickPexesoCard(${i})">${m||f?c.text:'❓'}</div>`;
          }).join('')}
        </div>
      ` : `
        <div style="text-align:center;padding:30px;">
          <h2 style="color:var(--col-green);">HOTOVO ZA ${pexesoAttempts} POKUSŮ! 🎉</h2>
          <div class="action-btn green" onclick="startPexesoGame(pexesoPairCount)">HRÁT ZNOVU</div>
          <div class="action-btn" onclick="setScreen('SELECT_PEXESO_SIZE')">ZMĚNIT VELIKOST</div>
        </div>
      `;
    }
  }

  loadData();
</script>
</body>
</html>
