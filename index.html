<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Výukový Systém</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --col-bg: #0b1528;
      --col-card: #18263e;
      --col-card-border: #31507d;
      --col-active-tab: #00bcd4;
      --col-green: #22c55e;
      --col-red: #ef4444;
      --col-yellow: #facc15;
      --col-orange: #f97316;
      --col-text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Roboto', sans-serif;
    }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }
    #app-container {
      width: 100vw;
      max-width: 680px;
      height: 100vh;
      max-height: 560px;
      background-color: var(--col-bg);
      display: flex;
      flex-direction: column;
      border: 2px solid var(--col-card-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    @media (max-width: 680px), (max-height: 560px) {
      #app-container { border-radius: 0; border: none; max-width: 100vw; max-height: 100vh; }
    }
    header {
      height: 48px;
      background-color: var(--col-card);
      border-bottom: 2px solid var(--col-card-border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
    }
    .nav-btn {
      background: var(--col-active-tab);
      color: #fff;
      border: 1px solid #fff;
      border-radius: 6px;
      height: 34px;
      min-width: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    .badge {
      background: #242c3a;
      border: 1px solid var(--col-card-border);
      padding: 0 10px;
      height: 32px;
      display: flex;
      align-items: center;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .badge.active { background: var(--col-active-tab); border-color: #fff; }
    .spacer { flex: 1; }

    .tts-toggle-btn {
      background: #24344d;
      border: 1px solid var(--col-card-border);
      color: #fff;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tts-toggle-btn.active { background: var(--col-green); border-color: #fff; }

    .study-timer-box {
      background: #101c2e;
      border: 1px solid var(--col-card-border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .study-timer-box.bonus { border-color: var(--col-yellow); color: var(--col-yellow); background: #2d2605; }
    .study-timer-box.paused { border-color: var(--col-orange); color: var(--col-orange); }

    main {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
    }
    footer {
      height: 32px;
      background-color: var(--col-card);
      border-top: 1px solid var(--col-card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 13px;
      color: var(--col-yellow);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .tile {
      background-color: var(--col-card);
      border: 1px solid var(--col-card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 10px;
      transition: transform 0.05s, border-color 0.1s;
    }
    .tile:active { transform: scale(0.97); border-color: #fff; }
    .tile h2 { font-size: 18px; color: #fff; margin-bottom: 4px; }
    .tile p { font-size: 12px; color: var(--col-text-muted); }

    .bargraph-container {
      background: #111a2a;
      border: 1px solid var(--col-card-border);
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bargraph-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
    }
    .bargraph-track {
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .bargraph-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--col-active-tab), var(--col-green));
      border-radius: 5px;
      transition: width 0.3s ease;
    }

    .prompt-box {
      background: var(--col-card);
      border: 1px solid var(--col-card-border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      color: var(--col-yellow);
      margin-bottom: 10px;
      position: relative;
    }
    .hebrew-text {
      font-family: 'Tinos', serif;
      direction: rtl;
      font-size: 32px !important;
      line-height: 1.4;
    }
    .audio-btn {
      position: absolute;
      right: 12px;
      top: 12px;
      font-size: 20px;
      cursor: pointer;
      opacity: 0.8;
    }

    .action-btn {
      background: var(--col-active-tab);
      border: 1px solid #fff;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      margin-top: 8px;
    }
    .action-btn.green { background: var(--col-green); }
    .action-btn.red { background: var(--col-red); }

    .opt-btn {
      background: var(--col-card);
      border: 1px solid var(--col-active-tab);
      color: #fff;
      padding: 12px 6px;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .opt-btn.hebrew { font-family: 'Tinos', serif; direction: rtl; font-size: 26px; }
    .opt-btn.hint { background: #4d4411 !important; border-color: var(--col-yellow) !important; color: var(--col-yellow) !important; }
    .opt-btn.correct { background: var(--col-green) !important; border-color: #fff; }
    .opt-btn.wrong { background: var(--col-red) !important; border-color: #fff; }

    .slots-row, .letters-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 8px auto;
      flex-wrap: wrap;
      max-width: 580px;
    }
    .letter-slot {
      min-width: 52px;
      height: 56px;
      padding: 0 8px;
      background: var(--col-card);
      border: 2px solid var(--col-active-tab);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }
    .letter-slot.filled { background: #143c28; border-color: var(--col-green); color: var(--col-green); }
    .letter-tile {
      min-width: 52px;
      height: 56px;
      padding: 0 8px;
      background: var(--col-card);
      border: 2px solid var(--col-active-tab);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      transition: transform 0.05s;
    }
    .letter-tile:active { transform: scale(0.92); }
    .letter-tile.hebrew { font-family: 'Tinos', serif; font-size: 32px; }
    .letter-tile.used { background: #181c24; border-color: #282d37; color: #4b5563; cursor: default; box-shadow: none; }

    .pexeso-grid {
      display: grid;
      gap: 10px;
      width: 100%;
      flex: 1;
      min-height: 360px;
      margin: 4px 0;
    }
    .pexeso-card {
      background: var(--col-card);
      border: 2px solid var(--col-card-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 4px;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
      color: #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .pexeso-card:active { transform: scale(0.95); }
    .pexeso-card.hidden { background: #121c2c; color: var(--col-text-muted); font-size: 28px; }
    .pexeso-card.flipped { background: #1d3557; border-color: var(--col-active-tab); color: #fff; }
    .pexeso-card.matched { background: #143c28; border-color: var(--col-green); color: var(--col-green); cursor: default; }
    .pexeso-card.hebrew { font-family: 'Tinos', serif; direction: rtl; font-size: 26px; }

    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #101b2d;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .toggle-btn {
      background: #24344d;
      color: #fff;
      border: 1px solid var(--col-card-border);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .toggle-btn.on { background: var(--col-active-tab); border-color: #fff; }
  </style>
</head>
<body>

<div id="app-container">
  <header>
    <div id="btn-back" class="nav-btn" onclick="goBack()">&lt;</div>
    <div id="badge-user" class="badge" onclick="setScreen('SELECT_USER')">Uživatel</div>
    <div id="badge-subj" class="badge" style="display:none;" onclick="setScreen('SELECT_GROUP')">Předmět</div>
    <div id="badge-group" class="badge" style="display:none;" onclick="setScreen('SELECT_GAME')">Skupina</div>
    <div class="spacer"></div>
    <div id="btn-tts-auto" class="tts-toggle-btn active" onclick="toggleAutoTTS()" title="Automatické čtení">🔊 Auto</div>
    <div id="study-timer" class="study-timer-box" title="Čas studia dnes">⏱️ 00:00 / 15:00</div>
    <div class="nav-btn" onclick="syncData()" title="Synchronizovat">🔄</div>
  </header>

  <main id="main-content">
    <div style="text-align:center; margin-top:50px; color:var(--col-text-muted);">
      Načítám data z Google Sheets...
    </div>
  </main>

  <footer>
    <div id="footer-user">Žák: --</div>
    <div id="footer-goal">Cíl dnes: 0 / 15 min ⏱️</div>
    <div id="status-info">Online</div>
  </footer>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxaxBIXP-ECpWstcqRDw8RuT_ds6UwcplU_3pZ9_-ksELN5FVeGt5EHjjexkJVmx1FR_w/exec";

  let appData = { users: [], progress: {}, items: [] };
  let currentUser = JSON.parse(localStorage.getItem("cur_user") || 'null');
  let filterExactGradeOnly = true; // PŘÍSNÝ FILTR: POUZE PŘESNÝ ROČNÍK!
  let viewMode = "LESSONS";

  let currentScreen = "SELECT_USER";
  let selectedSubject = "";
  let selectedGroupKey = "";
  let activeItems = [];
  let selectedGame = "";

  let isAutoTTS = localStorage.getItem("auto_tts") !== "false";

  function toggleAutoTTS() {
    isAutoTTS = !isAutoTTS;
    localStorage.setItem("auto_tts", isAutoTTS);
    updateTTSBtnUI();
  }

  function updateTTSBtnUI() {
    const btn = document.getElementById("btn-tts-auto");
    if (!btn) return;
    if (isAutoTTS) {
      btn.className = "tts-toggle-btn active";
      btn.innerText = "🔊 Auto";
    } else {
      btn.className = "tts-toggle-btn";
      btn.innerText = "🔇 Vyp";
    }
  }

  function speakWord(text, langCode) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const clean = text.split('-')[0].trim();
    const u = new SpeechSynthesisUtterance(clean);
    if (langCode === 'EN') u.lang = 'en-US';
    else if (langCode === 'DE') u.lang = 'de-DE';
    else if (langCode === 'HE') u.lang = 'he-IL';
    else u.lang = 'cs-CZ';
    window.speechSynthesis.speak(u);
  }

  let todaySecondsStudied = 0;
  let lastUserActivityTime = Date.now();
  let isTimerPaused = false;

  function registerUserAction() {
    lastUserActivityTime = Date.now();
    if (isTimerPaused) {
      isTimerPaused = false;
      updateStudyTimerUI();
    }
  }

  window.addEventListener('click', registerUserAction, true);
  window.addEventListener('touchstart', registerUserAction, true);

  setInterval(() => {
    if (currentScreen === "PLAYING" && currentUser) {
      const idleTime = Date.now() - lastUserActivityTime;
      if (idleTime < 15000) {
        todaySecondsStudied++;
        localStorage.setItem(`time_${new Date().toDateString()}_${currentUser.name}`, todaySecondsStudied);
        isTimerPaused = false;
      } else {
        isTimerPaused = true;
      }
    } else {
      isTimerPaused = true;
    }
    updateStudyTimerUI();
  }, 1000);

  function updateStudyTimerUI() {
    const box = document.getElementById("study-timer");
    const footerGoal = document.getElementById("footer-goal");
    if (!box || !currentUser) return;

    const targetSec = (currentUser.targetMinutes || 15) * 60;
    const format = s => {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    };

    const spentMin = Math.floor(todaySecondsStudied / 60);
    if (footerGoal) {
      footerGoal.innerText = `Cíl: ${spentMin} / ${currentUser.targetMinutes || 15} min ⏱️`;
    }

    if (currentScreen !== "PLAYING" || isTimerPaused) {
      box.className = "study-timer-box paused";
      box.innerText = `⏸️ ${format(todaySecondsStudied)} / ${format(targetSec)}`;
    } else if (todaySecondsStudied < targetSec) {
      box.className = "study-timer-box";
      box.innerText = `⏱️ ${format(todaySecondsStudied)} / ${format(targetSec)}`;
    } else {
      const bonusSec = todaySecondsStudied - targetSec;
      box.className = "study-timer-box bonus";
      box.innerText = `★ BONUS: +${format(bonusSec)}`;
    }
  }

  function getAdaptiveWindowSize() {
    if (!currentUser) return 3;
    if (currentUser.grade >= 90) return 12;
    if (currentUser.grade >= 10) return 10; // SŠ
    if (currentUser.grade >= 9) return 9;   // 9. třída
    if (currentUser.grade >= 7) return 7;
    if (currentUser.grade >= 5) return 5;
    return 3;
  }

  let pexesoPairCount = 4;
  let pexesoCards = [];
  let pexesoFlipped = [];
  let pexesoMatched = [];
  let pexesoLocked = false;
  let pexesoAttempts = 0;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playTone(freq, type, duration) {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }
  function sndOk() { playTone(880, 'sine', 0.08); setTimeout(() => playTone(1320, 'sine', 0.1), 80); }
  function sndErr() { playTone(220, 'square', 0.15); }
  function sndFanfare() {
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.1), i * 110));
  }

  function addReward(count = 1, section = "Lekce") {
    if (!currentUser) return;
    currentUser.stars = (currentUser.stars || 0) + count;
    localStorage.setItem("cur_user", JSON.stringify(currentUser));
    updateFooter();

    try {
      const fd = new URLSearchParams();
      fd.append("action", "log_activity");
      fd.append("user", currentUser.name);
      fd.append("subject", selectedSubject);
      fd.append("section", section);
      fd.append("stars", count);
      fetch(API_URL, { method: "POST", mode: "no-cors", body: fd });
    } catch(e) {}
  }

  function updateFooter() {
    if (!currentUser) return;
    const gradeLabel = currentUser.grade >= 10 && currentUser.grade < 90 
      ? `${currentUser.grade - 9}. ročník SŠ` 
      : (currentUser.grade <= 9 ? `${currentUser.grade}. tř.` : 'Dospělý');
    document.getElementById("footer-user").innerText = `${currentUser.name} (${gradeLabel})`;
  }

  async function loadData() {
    const cached = localStorage.getItem("app_data");
    if (cached) {
      try {
        appData = JSON.parse(cached);
        renderScreen();
      } catch(e) {}
    }
    await syncData();
  }

  async function syncData() {
    document.getElementById("status-info").innerText = "Stahuji...";
    try {
      const res = await fetch(API_URL);
      const json = await res.json();
      if (json && json.items) {
        appData = json;
        localStorage.setItem("app_data", JSON.stringify(json));
        document.getElementById("status-info").innerText = "Data aktuální";

        if (currentUser && appData.users) {
          const foundU = appData.users.find(u => u.name.toLowerCase() === currentUser.name.toLowerCase());
          if (foundU) {
            currentUser.targetMinutes = foundU.targetMinutes || 15;
            currentUser.grade = foundU.grade;
            localStorage.setItem("cur_user", JSON.stringify(currentUser));
          }
        }
        renderScreen();
      }
    } catch(e) {
      document.getElementById("status-info").innerText = "Offline";
    }
  }

  async function saveWordMasteryToGoogle(itemQuestion, masteryLevel) {
    if (!currentUser) return;
    try {
      const uKey = currentUser.name.toLowerCase().trim();
      if (!appData.progress) appData.progress = {};
      if (!appData.progress[uKey]) appData.progress[uKey] = {};
      appData.progress[uKey][itemQuestion] = masteryLevel;
      localStorage.setItem("app_data", JSON.stringify(appData));

      const fd = new URLSearchParams();
      fd.append("action", "save_mastery");
      fd.append("user", currentUser.name);
      fd.append("subject", selectedSubject);
      fd.append("foreign", itemQuestion);
      fd.append("mastery", masteryLevel);
      fetch(API_URL, { method: "POST", mode: "no-cors", body: fd });
    } catch(e) {}
  }

  function goBack() {
    if (currentScreen === "PLAYING" && selectedGame === "PEXESO") setScreen("SELECT_PEXESO_SIZE");
    else if (currentScreen === "SELECT_PEXESO_SIZE") setScreen("SELECT_GAME");
    else if (currentScreen === "PLAYING") setScreen("SELECT_GAME");
    else if (currentScreen === "SELECT_GAME") setScreen("SELECT_GROUP");
    else if (currentScreen === "SELECT_GROUP") setScreen("SELECT_SUBJECT");
    else if (currentScreen === "SELECT_SUBJECT") setScreen("SELECT_USER");
  }

  function setScreen(scr) {
    currentScreen = scr;
    registerUserAction();
    renderScreen();
  }

  function getVocabItems() { return activeItems.filter(it => it.type === "SLOVO"); }
  function getQuizItems()  { return activeItems.filter(it => it.type === "KVIZ"); }
  function getSeqItems()   { return activeItems.filter(it => it.type === "RADA"); }

  function renderScreen() {
    updateFooter();
    updateStudyTimerUI();
    updateTTSBtnUI();
    const main = document.getElementById("main-content");
    const bUser = document.getElementById("badge-user");
    const bSubj = document.getElementById("badge-subj");
    const bGroup = document.getElementById("badge-group");

    bUser.innerText = currentUser ? currentUser.name : "Uživatel";

    // 1. VÝBĚR ŽÁKA
    if (currentScreen === "SELECT_USER" || !currentUser) {
      bSubj.style.display = "none";
      bGroup.style.display = "none";
      const uList = (appData.users && appData.users.length) ? appData.users : [
        {name: "Daniel", grade: 2, targetMinutes: 10},
        {name: "Pavel", grade: 5, targetMinutes: 15},
        {name: "Honzík", grade: 9, targetMinutes: 25},
        {name: "Táta", grade: 99, targetMinutes: 30}
      ];

      main.innerHTML = `
        <h2 style="font-size:18px;margin-bottom:12px;text-align:center;color:var(--col-yellow);">Kdo se jde učit?</h2>
        <div class="grid-2">
          ${uList.map(u => {
            const grLabel = u.grade >= 10 && u.grade < 90 ? `${u.grade - 9}. ročník SŠ` : (u.grade <= 9 ? `${u.grade}. třída ZŠ` : 'Dospělý');
            return `
              <div class="tile" style="${currentUser && currentUser.name === u.name ? 'border-color:var(--col-green);background:#142838;' : ''}" onclick="selectUser('${u.name}', ${u.grade}, ${u.targetMinutes||15})">
                <h2>${u.name}</h2>
                <p>${grLabel}</p>
                <p style="color:var(--col-yellow);margin-top:4px;">⏱️ Cíl: ${u.targetMinutes||15} min</p>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // 2. VÝBĚR PŘEDMĚTU
    else if (currentScreen === "SELECT_SUBJECT") {
      bSubj.style.display = "none";
      bGroup.style.display = "none";
      const showHebrew = currentUser.grade >= 99 || !filterExactGradeOnly;

      main.innerHTML = `
        <div class="grid-2">
          <div class="tile" onclick="chooseSubject('EN')"><h2>Angličtina</h2><p>Lekce ročníku & nepravidelná slovesa</p></div>
          <div class="tile" onclick="chooseSubject('DE')"><h2>Němčina</h2><p>Lekce, barvy, věty, členy</p></div>
          <div class="tile" onclick="chooseSubject('CZ')"><h2>Český jazyk</h2><p>Slovní druhy, pády, I/Y, básničky</p></div>
          <div class="tile" onclick="chooseSubject('PRV')"><h2>Prvouka & čas</h2><p>Dny, měsíce, abeceda</p></div>
          ${showHebrew ? `
            <div class="tile" style="border-color:var(--col-yellow);" onclick="chooseSubject('HE')">
              <h2 style="color:var(--col-yellow);">Hebrejština</h2>
              <p>Jonáš 1, text Tanachu</p>
            </div>
          ` : ''}
        </div>
      `;
    }

    // 3. VÝBĚR SKUPINY (LEKCE vs. TÉMATA S PŘÍSNÝM FILTREM ROČNÍKU!)
    else if (currentScreen === "SELECT_GROUP") {
      bSubj.style.display = "flex";
      bSubj.innerText = selectedSubject;
      bGroup.style.display = "none";

      // PŘÍSNÝ FILTR:
      // Zobrazí POUZE položky pro přesný ročník dítěte!
      // (Nebo položky společné jako slovesa A1-B2 pokud je minGrade 2 a méně u daného tématu, nebo když je filtr vypnutý)
      const subjItems = appData.items.filter(it => {
        if (it.subject !== selectedSubject) return false;
        if (!filterExactGradeOnly) return true; // Zobrazit vše
        
        // Dospělý vidí vše
        if (currentUser.grade >= 99) return true;

        // Běžný žák: Vidí POUZE svůj ročník (nebo slovesa/společná témata označená pro jeho věk)
        return it.minGrade === currentUser.grade || it.lesson.toLowerCase().includes('sloves') || it.topic.toLowerCase().includes('irregular');
      });

      const groupsMap = {};
      subjItems.forEach(it => {
        const key = (viewMode === "LESSONS") ? it.lesson : it.topic;
        if (!key) return;
        if (!groupsMap[key]) groupsMap[key] = { name: key, count: 0, minGrade: it.minGrade, types: new Set() };
        groupsMap[key].count++;
        groupsMap[key].types.add(it.type);
        if (it.minGrade > groupsMap[key].minGrade) groupsMap[key].minGrade = it.minGrade;
      });

      const groups = Object.values(groupsMap);
      const gradeStr = currentUser.grade >= 10 && currentUser.grade < 90 ? `${currentUser.grade - 9}. ročník SŠ` : `${currentUser.grade}. třída`;

      let html = `
        <div class="filter-bar">
          <div style="display:flex;gap:4px;">
            <button class="toggle-btn ${viewMode === 'LESSONS' ? 'on' : ''}" onclick="viewMode='LESSONS';renderScreen();">📁 Podle lekcí</button>
            <button class="toggle-btn ${viewMode === 'TOPICS' ? 'on' : ''}" onclick="viewMode='TOPICS';renderScreen();">🏷️ Podle témat</button>
          </div>
          <button class="toggle-btn ${filterExactGradeOnly ? 'on' : ''}" onclick="filterExactGradeOnly=!filterExactGradeOnly;renderScreen();">
            ${filterExactGradeOnly ? 'Jen ' + gradeStr : 'Všechny ročníky'}
          </button>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
      `;

      if (groups.length === 0) {
        html += `<div style="text-align:center;padding:25px;color:var(--col-text-muted);">Pro ${gradeStr} tu zatím není specifické téma. Klikněte nahoře na "Všechny ročníky".</div>`;
      } else {
        groups.forEach(g => {
          const typeLabels = Array.from(g.types).map(t => t === 'SLOVO' ? 'Slova' : (t === 'KVIZ' ? 'Kvíz' : 'Řada')).join(', ');
          const gGradeLabel = g.minGrade >= 10 && g.minGrade < 90 ? `${g.minGrade - 9}. ročník SŠ` : (g.minGrade <= 9 ? `${g.minGrade}. tř.` : 'Dospělý');
          html += `
            <div class="tile" style="flex-direction:row;justify-content:space-between;padding:12px;" onclick="chooseGroup('${g.name}')">
              <div style="text-align:left;">
                <h2>${g.name}</h2>
                <p>${typeLabels} (${gGradeLabel})</p>
              </div>
              <span style="color:var(--col-active-tab);font-weight:bold;">${g.count} úloh</span>
            </div>
          `;
        });
      }

      html += '</div>';
      main.innerHTML = html;
    }

    // 4. VÝBĚR HRY
    else if (currentScreen === "SELECT_GAME") {
      bSubj.style.display = "flex";
      bGroup.style.display = "flex";
      bGroup.innerText = selectedGroupKey;

      const vItems = getVocabItems();
      const qItems = getQuizItems();
      const sItems = getSeqItems();

      let tilesHtml = `<div class="grid-2">`;

      if (vItems.length > 0) {
        tilesHtml += `
          <div class="tile" onclick="startGame('CARDS')"><h2>1. Karty</h2><p>Čtení a výslovnost (${vItems.length})</p></div>
          <div class="tile" onclick="startGame('ADAPTIVE')"><h2>2. Zkoušení</h2><p>Konec až při 2 ★ (${vItems.length})</p></div>
          <div class="tile" onclick="startGame('SCRAMBLE')"><h2>3. Skládání</h2><p>Trénink pravopisu</p></div>
          <div class="tile" onclick="startGame('MISSING')"><h2>4. Doplň písmeno</h2><p>Doplň znak</p></div>
        `;
      }

      if (qItems.length > 0) {
        tilesHtml += `
          <div class="tile" style="border-color:var(--col-green);" onclick="startGame('QUIZ')">
            <h2 style="color:var(--col-green);">📝 Kvíz / Test</h2>
            <p>${qItems.length} otázek k procvičení</p>
          </div>
        `;
      }

      if (sItems.length > 0) {
        tilesHtml += `
          <div class="tile" style="border-color:var(--col-yellow);" onclick="startGame('SEQ')">
            <h2 style="color:var(--col-yellow);">⏱️ Řada na čas</h2>
            <p>Básničky, verše a posloupnosti</p>
          </div>
        `;
      }

      tilesHtml += `</div>`;

      if (vItems.length > 0) {
        tilesHtml += `
          <div class="tile" style="margin-top:10px;padding:12px;border-color:var(--col-yellow);" onclick="setScreen('SELECT_PEXESO_SIZE')">
            <h2 style="color:var(--col-yellow);">🃏 PEXESO (Hledání dvojic)</h2>
            <p>Procvič si paměť hravou formou</p>
          </div>
        `;
      }

      main.innerHTML = tilesHtml;
    }

    // 5. VÝBĚR VELIKOSTI PEXESA
    else if (currentScreen === "SELECT_PEXESO_SIZE") {
      bGroup.style.display = "flex";
      bGroup.innerText = selectedGroupKey;
      main.innerHTML = `
        <h2 style="font-size:18px;margin-bottom:12px;text-align:center;color:var(--col-yellow);">Vyber velikost pexesa:</h2>
        <div class="grid-2">
          <div class="tile" onclick="startPexesoGame(3)"><h2>6 KARET (2 × 3)</h2><p>3 dvojice – rychlovka</p></div>
          <div class="tile" onclick="startPexesoGame(4)"><h2>8 KARET (2 × 4)</h2><p>4 dvojice – pohodová hra</p></div>
          <div class="tile" onclick="startPexesoGame(6)"><h2>12 KARET (3 × 4)</h2><p>6 dvojic – klasika</p></div>
          <div class="tile" onclick="startPexesoGame(8)"><h2>16 KARET (4 × 4)</h2><p>8 dvojic – velká výzva!</p></div>
        </div>
      `;
    }

    // 6. SAMOTNÁ HRA
    else if (currentScreen === "PLAYING") {
      bSubj.style.display = "flex";
      bGroup.style.display = "flex";
      bGroup.innerText = selectedGroupKey;
      renderActiveGame();
    }
  }

  function selectUser(name, grade, targetMinutes) {
    currentUser = { name, grade, targetMinutes, stars: 0 };
    localStorage.setItem("cur_user", JSON.stringify(currentUser));
    todaySecondsStudied = Number(localStorage.getItem(`time_${new Date().toDateString()}_${currentUser.name}`) || 0);
    setScreen("SELECT_SUBJECT");
  }

  function chooseSubject(subj) {
    selectedSubject = subj;
    setScreen("SELECT_GROUP");
  }

  function chooseGroup(groupName) {
    selectedGroupKey = groupName;
    activeItems = appData.items.filter(it => {
      if (it.subject !== selectedSubject) return false;
      const key = (viewMode === "LESSONS") ? it.lesson : it.topic;
      return key === groupName;
    });
    setScreen("SELECT_GAME");
  }

  function startGame(game) {
    selectedGame = game;
    initGameState();
    setScreen("PLAYING");
  }

  function startPexesoGame(pairCount) {
    pexesoPairCount = pairCount;
    selectedGame = "PEXESO";
    initPexeso();
    setScreen("PLAYING");
  }

  // ==========================================
  // ADAPTIVNÍ HERNÍ ENGINE
  // ==========================================
  let vMastery = {};
  let vActivePool = 3;
  let vCurrentWord = 0;
  let vCardIdx = 0;
  let vQuizRevealed = false;

  let scrambleDeck = [];
  let scramblePlaced = [];
  let scrambleLetters = [];
  let scrambleHadMistake = false;
  let scrambleDone = false;
  let scrambleSolvedCount = 0;

  let missingDeck = [];
  let missingSlot = 0;
  let missingChoices = [];
  let missingChosen = -1;
  let missingSolvedCount = 0;

  let qCurStep = 0;
  let qAnswered = false;

  let seqTargetIdx = 0;
  let seqSlots = [];
  let seqStartTime = 0;
  let seqTimerInterval = null;
  let seqHintActive = false;
  let seqInactivityTimer = null;

  function getGraphemes(str) {
    if (window.Intl && Intl.Segmenter) {
      const segmenter = new Intl.Segmenter('und', { granularity: 'grapheme' });
      return Array.from(segmenter.segment(str), s => s.segment);
    }
    return str.split('');
  }

  function initGameState() {
    const vItems = getVocabItems();
    if (vItems.length > 0) {
      vMastery = {};
      let masteredCount = 0;
      const uKey = currentUser.name.toLowerCase().trim();
      const userProgress = (appData.progress && appData.progress[uKey]) ? appData.progress[uKey] : {};

      vItems.forEach((w, i) => {
        const m = Number(userProgress[w.question] || 0);
        vMastery[i] = m;
        if (m >= 2) masteredCount++;
      });

      const baseWin = getAdaptiveWindowSize();
      vActivePool = Math.min(vItems.length, Math.max(baseWin, masteredCount + baseWin));

      if (selectedGame === "CARDS") {
        vCardIdx = 0;
        if (isAutoTTS && vItems.length > 0) speakWord(vItems[0].question, selectedSubject);
      }
      if (selectedGame === "ADAPTIVE") pickNextAdaptiveWord();
      if (selectedGame === "SCRAMBLE") { scrambleDeck = []; scrambleSolvedCount = 0; initScramble(); }
      if (selectedGame === "MISSING") { missingDeck = []; missingSolvedCount = 0; initMissing(); }
    }
    if (selectedGame === "QUIZ") { qCurStep = 0; qAnswered = false; }
    if (selectedGame === "SEQ") initSequence();
  }

  function getMasteryStats() {
    const vItems = getVocabItems();
    if (vItems.length === 0) return { current: 0, total: 1, masteredCount: 0, totalWords: 1 };
    let current = 0;
    let masteredCount = 0;
    vItems.forEach((_, i) => {
      const m = vMastery[i] || 0;
      current += m;
      if (m >= 2) masteredCount++;
    });
    return {
      current: current,
      total: vItems.length * 2,
      masteredCount: masteredCount,
      totalWords: vItems.length
    };
  }

  function pickNextAdaptiveWord() {
    const vItems = getVocabItems();
    vQuizRevealed = false;

    const stats = getMasteryStats();
    if (stats.masteredCount >= stats.totalWords) {
      vCurrentWord = -1;
      return;
    }

    const unmastered = [];
    const mastered = [];

    for (let i = 0; i < vActivePool; i++) {
      if ((vMastery[i] || 0) < 2) unmastered.push(i);
      else mastered.push(i);
    }

    if (unmastered.length === 0 && vActivePool < vItems.length) {
      const step = Math.max(2, Math.floor(getAdaptiveWindowSize() / 2));
      vActivePool = Math.min(vItems.length, vActivePool + step);
      for (let i = 0; i < vActivePool; i++) {
        if ((vMastery[i] || 0) < 2) unmastered.push(i);
      }
    }

    if (unmastered.length > 0 && (Math.random() < 0.8 || mastered.length === 0)) {
      vCurrentWord = unmastered[Math.floor(Math.random() * unmastered.length)];
    } else if (mastered.length > 0) {
      vCurrentWord = mastered[Math.floor(Math.random() * mastered.length)];
    } else {
      vCurrentWord = 0;
    }
  }

  function answerAdaptive(known) {
    const vItems = getVocabItems();
    const w = vItems[vCurrentWord];

    if (known) {
      sndOk();
      addReward(1, selectedGroupKey);
      vMastery[vCurrentWord] = Math.min(2, (vMastery[vCurrentWord] || 0) + 1);

      if (vMastery[vCurrentWord] >= 2 && vActivePool < vItems.length) {
        vActivePool++;
      }
      saveWordMasteryToGoogle(w.question, vMastery[vCurrentWord]);
    } else {
      sndErr();
      vMastery[vCurrentWord] = 0;
      saveWordMasteryToGoogle(w.question, 0);
    }

    pickNextAdaptiveWord();
    renderActiveGame();
  }

  function revealAdaptiveQuiz() {
    vQuizRevealed = true;
    renderActiveGame();
    if (isAutoTTS && vCurrentWord !== -1) {
      const vItems = getVocabItems();
      speakWord(vItems[vCurrentWord].question, selectedSubject);
    }
  }

  function initScramble() {
    const vItems = getVocabItems();
    if (!scrambleDeck || scrambleDeck.length === 0) {
      scrambleDeck = vItems.map((_, i) => i).sort(() => Math.random() - 0.5);
    }
    vCurrentWord = scrambleDeck.pop();
    const w = vItems[vCurrentWord];
    scramblePlaced = [];
    scrambleHadMistake = false;
    scrambleDone = false;

    const graphemes = getGraphemes(w.question);
    scrambleLetters = graphemes.map(ch => ({ ch, used: false })).sort(() => Math.random() - 0.5);
  }

  function clickScrambleLetter(idx) {
    if (scrambleDone) return;
    const vItems = getVocabItems();
    const item = scrambleLetters[idx];
    if (item.used) return;

    const w = vItems[vCurrentWord];
    const targetGraphemes = getGraphemes(w.question);
    const expected = targetGraphemes[scramblePlaced.length];

    if (item.ch === expected) {
      sndOk();
      item.used = true;
      scramblePlaced.push(item.ch);

      if (scramblePlaced.length === targetGraphemes.length) {
        scrambleDone = true;
        scrambleSolvedCount++;
        if (!scrambleHadMistake) {
          addReward(1, selectedGroupKey);
          sndFanfare();
        }
        if (isAutoTTS) speakWord(w.question, selectedSubject);
      }
    } else {
      sndErr();
      scrambleHadMistake = true;
    }
    renderActiveGame();
  }

  function nextScrambleStep() {
    initScramble();
    renderActiveGame();
  }

  function initMissing() {
    const vItems = getVocabItems();
    if (!missingDeck || missingDeck.length === 0) {
      missingDeck = vItems.map((_, i) => i).sort(() => Math.random() - 0.5);
    }
    vCurrentWord = missingDeck.pop();
    const w = vItems[vCurrentWord];
    const letters = getGraphemes(w.question);
    missingSlot = Math.floor(Math.random() * letters.length);
    const correctCh = letters[missingSlot];
    missingChosen = -1;

    const alphabet = "abcdefghijklmnopqrstuvwxyz";
    missingChoices = [correctCh];
    while (missingChoices.length < 3) {
      let r = alphabet[Math.floor(Math.random() * alphabet.length)];
      if (!missingChoices.includes(r)) missingChoices.push(r);
    }
    missingChoices.sort(() => Math.random() - 0.5);
  }

  function clickMissingOption(idx) {
    if (missingChosen !== -1) return;
    missingChosen = idx;
    const vItems = getVocabItems();
    const w = vItems[vCurrentWord];
    const letters = getGraphemes(w.question);
    const isCorrect = missingChoices[idx] === letters[missingSlot];

    if (isCorrect) {
      sndOk();
      missingSolvedCount++;
      addReward(1, selectedGroupKey);
      if (isAutoTTS) speakWord(w.question, selectedSubject);
    } else {
      sndErr();
    }
    renderActiveGame();
  }

  function nextMissingStep() {
    initMissing();
    renderActiveGame();
  }

  function initPexeso() {
    const vItems = getVocabItems();
    const count = Math.min(pexesoPairCount, vItems.length);
    const shuffledWords = [...vItems].sort(() => Math.random() - 0.5).slice(0, count);

    pexesoCards = [];
    shuffledWords.forEach((w, wIdx) => {
      pexesoCards.push({ id: `f_${wIdx}`, wordIdx: wIdx, text: w.question, isForeign: true });
      pexesoCards.push({ id: `c_${wIdx}`, wordIdx: wIdx, text: w.answer, isForeign: false });
    });

    pexesoCards.sort(() => Math.random() - 0.5);
    pexesoFlipped = [];
    pexesoMatched = [];
    pexesoLocked = false;
    pexesoAttempts = 0;
  }

  function clickPexesoCard(index) {
    if (pexesoLocked) return;
    if (pexesoFlipped.includes(index)) return;
    if (pexesoMatched.includes(pexesoCards[index].wordIdx)) return;

    pexesoFlipped.push(index);
    const cardJustFlipped = pexesoCards[index];

    if (isAutoTTS && cardJustFlipped.isForeign) {
      speakWord(cardJustFlipped.text, selectedSubject);
    }

    renderActiveGame();

    if (pexesoFlipped.length === 2) {
      pexesoAttempts++;
      const idx1 = pexesoFlipped[0];
      const idx2 = pexesoFlipped[1];
      const card1 = pexesoCards[idx1];
      const card2 = pexesoCards[idx2];

      if (card1.wordIdx === card2.wordIdx) {
        sndOk();
        pexesoMatched.push(card1.wordIdx);
        pexesoFlipped = [];

        if (pexesoMatched.length === Math.min(pexesoPairCount, getVocabItems().length)) {
          sndFanfare();
          const maxIdeal = pexesoPairCount * 2;
          const starsEarned = (pexesoAttempts <= maxIdeal) ? (pexesoPairCount >= 6 ? 4 : 2) : 1;
          addReward(starsEarned, selectedGroupKey);
        }
        renderActiveGame();
      } else {
        sndErr();
        pexesoLocked = true;
        setTimeout(() => {
          pexesoFlipped = [];
          pexesoLocked = false;
          renderActiveGame();
        }, 900);
      }
    }
  }

  function renderActiveGame() {
    const main = document.getElementById("main-content");
    const isHebrew = selectedSubject === "HE";
    const vItems = getVocabItems();
    const qItems = getQuizItems();
    const sItems = getSeqItems();

    // 1. KARTY
    if (selectedGame === "CARDS") {
      const w = vItems[vCardIdx];
      const pct = Math.round(((vCardIdx + 1) / vItems.length) * 100);
      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Karty: ${vCardIdx + 1} z ${vItems.length}</span>
            <span style="color:var(--col-active-tab);">${pct} %</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}">
          ${w.question}
          <span class="audio-btn" onclick="speakWord('${w.question}', '${selectedSubject}')" title="Přečíst">🔊</span>
        </div>
        <div class="prompt-box" style="color:#fff;font-size:22px;">${w.answer}</div>
        <div style="text-align:center;color:var(--col-active-tab);font-size:18px;margin-bottom:12px;">[ ${w.help || ''} ]</div>
        <div class="grid-2">
          <div class="action-btn" onclick="vCardPrev()">Předchozí</div>
          <div class="action-btn" onclick="vCardNext()">Další (${vCardIdx+1}/${vItems.length})</div>
        </div>
      `;
    }

    // 2. ADAPTIVNÍ ZKOUŠENÍ: KONEC AŽ PŘI 100% ZVLÁDNUTÍ
    else if (selectedGame === "ADAPTIVE") {
      const stats = getMasteryStats();
      const pct = Math.round((stats.current / stats.total) * 100);

      if (stats.masteredCount >= stats.totalWords) {
        main.innerHTML = `
          <div style="text-align:center;padding:30px 10px;">
            <h2 style="color:var(--col-green);font-size:26px;margin-bottom:12px;">KOMPLETNĚ ZVLÁDNUTO! 🎉</h2>
            <p style="font-size:18px;color:#fff;margin-bottom:8px;">Všech ${stats.totalWords} položek umíš na 2 ★!</p>
            <div class="bargraph-container" style="margin:20px auto;max-width:320px;">
              <div class="bargraph-header"><span>Naučeno: 100 %</span><span style="color:var(--col-green);">${stats.current}/${stats.total} bodů</span></div>
              <div class="bargraph-track"><div class="bargraph-fill" style="width:100%;background:var(--col-green);"></div></div>
            </div>
            <div class="action-btn green" onclick="setScreen('SELECT_GAME')">ZPĚT DO MENU HRY ➔</div>
          </div>
        `;
        return;
      }

      const w = vItems[vCurrentWord];
      const mVal = vMastery[vCurrentWord] || 0;

      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Učení: ${stats.masteredCount} z ${stats.totalWords} hotovo (${stats.current}/${stats.total} b.)</span>
            <span style="color:var(--col-green);">${pct} %</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${pct}%;"></div></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--col-text-muted);margin-bottom:4px;">
          <span>Slovo: ${mVal}/2 ★</span>
          <span>Aktivní okno: ${vActivePool} z ${vItems.length}</span>
        </div>
        <div class="prompt-box" style="color:#fff;margin-top:2px;">${w.answer}</div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}" style="color:${vQuizRevealed ? 'var(--col-yellow)' : 'var(--col-text-muted)'};">
          ${vQuizRevealed ? w.question : '[ ? ? ? ]'}
          ${vQuizRevealed ? `<span class="audio-btn" onclick="speakWord('${w.question}', '${selectedSubject}')">🔊</span>` : ''}
        </div>
        ${vQuizRevealed ? `
          <div style="text-align:center;color:var(--col-active-tab);margin-bottom:8px;">[ ${w.help || ''} ]</div>
          <div class="grid-2">
            <div class="action-btn red" onclick="answerAdaptive(false)">Nevěděl jsem (0 ★)</div>
            <div class="action-btn green" onclick="answerAdaptive(true)">Věděl jsem (+1 ★)</div>
          </div>
        ` : `
          <div class="action-btn" onclick="revealAdaptiveQuiz()">ZKONTROLOVAT</div>
        `}
      `;
    }

    // 3. SKLÁDÁNÍ SLOVA
    else if (selectedGame === "SCRAMBLE") {
      const w = vItems[vCurrentWord];
      const targetGraphemes = getGraphemes(w.question);
      const pct = Math.min(100, Math.round((scrambleSolvedCount / vItems.length) * 100));

      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Vyřešeno: ${scrambleSolvedCount} z ${vItems.length}</span>
            <span style="color:var(--col-yellow);">${pct} %</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="prompt-box" style="font-size:22px;color:#fff;margin-top:4px;">Slož: <b>${w.answer}</b></div>
        <div class="slots-row ${isHebrew ? 'hebrew-text' : ''}">
          ${targetGraphemes.map((ch, i) => `
            <div class="letter-slot ${i < scramblePlaced.length ? 'filled' : ''}">
              ${i < scramblePlaced.length ? scramblePlaced[i] : '_'}
            </div>
          `).join('')}
        </div>
        ${!scrambleDone ? `
          <div class="letters-row">
            ${scrambleLetters.map((item, idx) => `
              <div class="letter-tile ${isHebrew ? 'hebrew' : ''} ${item.used ? 'used' : ''}" onclick="clickScrambleLetter(${idx})">
                ${item.ch}
              </div>
            `).join('')}
          </div>
        ` : `
          <div style="text-align:center;color:var(--col-active-tab);margin-bottom:6px;">[ ${w.help || ''} ]</div>
          <div class="action-btn ${scrambleHadMistake ? 'red' : 'green'}" onclick="nextScrambleStep()">
            ${scrambleHadMistake ? 'DOKONČENO S CHYBOU ➔ DALŠÍ' : 'SPRÁVNĚ! ➔ DALŠÍ SLOVO'}
          </div>
        `}
      `;
    }

    // 4. DOPLŇOVÁNÍ PÍSMENE
    else if (selectedGame === "MISSING") {
      const w = vItems[vCurrentWord];
      const letters = getGraphemes(w.question);
      const pct = Math.min(100, Math.round((missingSolvedCount / vItems.length) * 100));

      let maskedWord = "";
      letters.forEach((ch, idx) => {
        if (idx === missingSlot) {
          maskedWord += missingChosen === -1 ? " [ _ ] " : ` [ ${ch} ] `;
        } else {
          maskedWord += ch + " ";
        }
      });

      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Doplněno: ${missingSolvedCount} z ${vItems.length}</span>
            <span style="color:var(--col-yellow);">${pct} %</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="prompt-box" style="font-size:20px;color:#fff;margin-top:4px;">Doplň: <b>${w.answer}</b></div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}">${maskedWord}</div>
        <div class="grid-2">
          ${missingChoices.map((ch, i) => {
            const isCorrect = ch === letters[missingSlot];
            const cls = missingChosen !== -1 ? (isCorrect ? 'correct' : (i === missingChosen ? 'wrong' : '')) : '';
            return `<div class="opt-btn ${isHebrew ? 'hebrew' : ''} ${cls}" onclick="clickMissingOption(${i})">${ch}</div>`;
          }).join('')}
        </div>
        ${missingChosen !== -1 ? `<div class="action-btn" onclick="nextMissingStep()">DALŠÍ ➔</div>` : ''}
      `;
    }

    // 5. PEXESO
    else if (selectedGame === "PEXESO") {
      const totalPairs = Math.min(pexesoPairCount, vItems.length);
      const isComplete = pexesoMatched.length === totalPairs;
      const cols = 4;

      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Pexeso: ${pexesoMatched.length} / ${totalPairs} dvojic</span>
            <span style="color:var(--col-yellow);">Pokusy: ${pexesoAttempts}</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${(pexesoMatched.length / totalPairs) * 100}%;"></div></div>
        </div>
        ${!isComplete ? `
          <div class="pexeso-grid" style="grid-template-columns: repeat(${cols}, 1fr);">
            ${pexesoCards.map((c, i) => {
              const isMatched = pexesoMatched.includes(c.wordIdx);
              const isFlipped = pexesoFlipped.includes(i);
              let cls = isMatched ? 'matched' : (isFlipped ? 'flipped' : 'hidden');
              if (c.isForeign && isHebrew) cls += ' hebrew';
              return `
                <div class="pexeso-card ${cls}" onclick="clickPexesoCard(${i})">
                  ${isMatched || isFlipped ? c.text : '❓'}
                </div>
              `;
            }).join('')}
          </div>
        ` : `
          <div style="text-align:center;padding:30px 10px;">
            <h2 style="color:var(--col-green);font-size:26px;margin-bottom:8px;">VÝBORNĚ! PEXESO SPLNĚNO!</h2>
            <p style="color:var(--col-yellow);font-size:18px;margin-bottom:6px;">Hotovo za ${pexesoAttempts} pokusů!</p>
            <p style="color:var(--col-text-muted);font-size:14px;margin-bottom:20px;">
              ${pexesoAttempts <= totalPairs * 2 ? 'Skvělá paměť! Žádné zbytečné klikání.' : 'Příště zkus klikat rozvážněji a méně naslepo!'}
            </p>
            <div class="action-btn green" onclick="initPexeso();renderActiveGame();">HRÁT ZNOVU ➔</div>
            <div class="action-btn" style="margin-top:10px;" onclick="setScreen('SELECT_PEXESO_SIZE')">ZMĚNIT VELIKOST PEXESA</div>
          </div>
        `}
      `;
    }

    // 6. KVÍZ
    else if (selectedGame === "QUIZ") {
      const q = qItems[qCurStep];
      const pct = Math.round(((qCurStep + 1) / qItems.length) * 100);
      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Kvíz: ${qCurStep + 1} z ${qItems.length}</span>
            <span style="color:var(--col-active-tab);">${pct} %</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="prompt-box" style="font-size:20px;color:#fff;">${q.question}</div>
        <div class="grid-2" style="margin-top:10px;">
          ${q.options.map((opt, i) => `
            <div class="opt-btn ${qAnswered ? (opt === q.answer ? 'correct' : 'wrong') : ''}" onclick="clickQuizOpt('${opt}')">
              ${opt}
            </div>
          `).join('')}
        </div>
        ${qAnswered ? `
          <div style="text-align:center;color:var(--col-yellow);margin-top:8px;">${q.help || ''}</div>
          <div class="action-btn" onclick="nextQuizStep()">DALŠÍ ➔</div>
        ` : ''}
      `;
    }

    // 7. POSLOUPNOSTI NA ČAS
    else if (selectedGame === "SEQ") {
      const seqConfig = sItems[0];
      const itemsList = seqConfig.answer.split('|').map(s => s.trim()).filter(Boolean);
      const isFinished = seqTargetIdx >= itemsList.length;
      const targetWord = itemsList[seqTargetIdx];
      const pct = Math.round((seqTargetIdx / itemsList.length) * 100);

      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Položka ${Math.min(seqTargetIdx + 1, itemsList.length)} z ${itemsList.length} ${seqHintActive ? '<b style="color:var(--col-yellow);">[NÁPOVĚDA]</b>' : ''}</span>
            <span id="seq-timer" style="color:var(--col-yellow);font-weight:bold;">0.0 s</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}" style="margin:8px 0;min-height:56px;color:#fff;font-size:22px;">
          ${itemsList.slice(0, seqTargetIdx).join(' ')} 
          <span style="color:var(--col-yellow);">${seqHintActive ? `[ ${targetWord}! ]` : '[ ??? ]'}</span>
        </div>
        ${!isFinished ? `
          <div class="grid-2">
            ${seqSlots.map((itemIdx, slot) => {
              const isHintSlot = (seqHintActive && itemIdx === seqTargetIdx);
              return `
                <div id="seq-btn-${slot}" class="opt-btn ${isHebrew ? 'hebrew' : ''} ${isHintSlot ? 'hint' : ''}" onclick="clickSeqSlot(${slot})">
                  ${itemIdx !== -1 ? itemsList[itemIdx] : ''}
                </div>
              `;
            }).join('')}
          </div>
        ` : `
          <div class="action-btn green" onclick="initSequence();renderActiveGame();">DOKONČENO! HRÁT ZNOVU</div>
        `}
      `;
    }
  }

  function vCardPrev() {
    const vItems = getVocabItems();
    vCardIdx = (vCardIdx + vItems.length - 1) % vItems.length;
    renderActiveGame();
    if (isAutoTTS && vItems.length > 0) speakWord(vItems[vCardIdx].question, selectedSubject);
  }
  function vCardNext() {
    const vItems = getVocabItems();
    vCardIdx = (vCardIdx + 1) % vItems.length;
    renderActiveGame();
    if (isAutoTTS && vItems.length > 0) speakWord(vItems[vCardIdx].question, selectedSubject);
  }

  function clickQuizOpt(chosen) {
    if (qAnswered) return;
    const qItems = getQuizItems();
    const q = qItems[qCurStep];
    qAnswered = true;
    if (chosen === q.answer) { sndOk(); addReward(1, selectedGroupKey); }
    else sndErr();
    renderActiveGame();
  }
  function nextQuizStep() {
    const qItems = getQuizItems();
    qCurStep++;
    qAnswered = false;
    if (qCurStep >= qItems.length) setScreen("SELECT_GAME");
    else renderActiveGame();
  }

  function resetInactivityTimer() {
    if (seqInactivityTimer) clearTimeout(seqInactivityTimer);
    seqInactivityTimer = setTimeout(() => {
      seqHintActive = true;
      renderActiveGame();
    }, 3000);
  }

  function initSequence() {
    const sItems = getSeqItems();
    if (sItems.length === 0) return;
    const itemsList = sItems[0].answer.split('|').map(s => s.trim()).filter(Boolean);

    seqTargetIdx = 0;
    seqHintActive = false;
    seqSlots = [-1, -1, -1, -1];
    seqSlots[0] = 0;
    if (itemsList.length > 1) seqSlots[1] = 1;
    for (let s = 2; s < Math.min(4, itemsList.length); s++) seqSlots[s] = s;
    seqSlots.sort(() => Math.random() - 0.5);

    seqStartTime = Date.now();
    if (seqTimerInterval) clearInterval(seqTimerInterval);
    seqTimerInterval = setInterval(() => {
      const el = document.getElementById("seq-timer");
      if (el && seqTargetIdx < itemsList.length) {
        el.innerText = ((Date.now() - seqStartTime) / 1000).toFixed(1) + " s";
      }
    }, 100);

    resetInactivityTimer();
  }

  function clickSeqSlot(slot) {
    const sItems = getSeqItems();
    const itemsList = sItems[0].answer.split('|').map(s => s.trim()).filter(Boolean);
    const btnEl = document.getElementById(`seq-btn-${slot}`);

    if (seqSlots[slot] === seqTargetIdx) {
      sndOk();
      seqTargetIdx++;
      seqHintActive = false;

      if (seqTargetIdx >= itemsList.length) {
        clearInterval(seqTimerInterval);
        if (seqInactivityTimer) clearTimeout(seqInactivityTimer);
        sndFanfare();
        addReward(3, selectedGroupKey);
      } else {
        const next = seqTargetIdx + 1;
        seqSlots[slot] = next < itemsList.length ? next : -1;
        resetInactivityTimer();
      }
      renderActiveGame();
    } else {
      sndErr();
      if (btnEl) {
        btnEl.classList.add("wrong");
        setTimeout(() => { if (btnEl) btnEl.classList.remove("wrong"); }, 250);
      }
      seqHintActive = true;
      resetInactivityTimer();
      renderActiveGame();
    }
  }

  loadData();
</script>
</body>
</html>
