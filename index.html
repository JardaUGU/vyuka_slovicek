<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Výukový Systém</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --col-bg: #0b1528;
      --col-card: #18263e;
      --col-card-border: #31507d;
      --col-active-tab: #00bcd4;
      --col-green: #22c55e;
      --col-red: #ef4444;
      --col-yellow: #facc15;
      --col-orange: #f97316;
      --col-text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Roboto', sans-serif;
    }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }
    #app-container {
      width: 100vw;
      max-width: 680px;
      height: 100vh;
      max-height: 560px;
      background-color: var(--col-bg);
      display: flex;
      flex-direction: column;
      border: 2px solid var(--col-card-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    @media (max-width: 680px), (max-height: 560px) {
      #app-container { border-radius: 0; border: none; max-width: 100vw; max-height: 100vh; }
    }
    header {
      height: 48px;
      background-color: var(--col-card);
      border-bottom: 2px solid var(--col-card-border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
    }
    .nav-btn {
      background: var(--col-active-tab);
      color: #fff;
      border: 1px solid #fff;
      border-radius: 6px;
      height: 34px;
      min-width: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    .badge {
      background: #242c3a;
      border: 1px solid var(--col-card-border);
      padding: 0 10px;
      height: 32px;
      display: flex;
      align-items: center;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .badge.active { background: var(--col-active-tab); border-color: #fff; }
    .spacer { flex: 1; }

    /* Ukazatel času v hlavičce */
    .study-timer-box {
      background: #101c2e;
      border: 1px solid var(--col-card-border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .study-timer-box.bonus {
      border-color: var(--col-yellow);
      color: var(--col-yellow);
      background: #2d2605;
    }

    main {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
    }
    footer {
      height: 32px;
      background-color: var(--col-card);
      border-top: 1px solid var(--col-card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 13px;
      color: var(--col-yellow);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .tile {
      background-color: var(--col-card);
      border: 1px solid var(--col-card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 10px;
      transition: transform 0.05s, border-color 0.1s;
    }
    .tile:active { transform: scale(0.97); border-color: #fff; }
    .tile h2 { font-size: 18px; color: #fff; margin-bottom: 4px; }
    .tile p { font-size: 12px; color: var(--col-text-muted); }

    /* Progress bar cvičení */
    .exercise-progress-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111a2a;
      border: 1px solid var(--col-card-border);
      border-radius: 8px;
      padding: 6px 12px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
    }
    .progress-pill {
      background: var(--col-card);
      border: 1px solid var(--col-active-tab);
      padding: 2px 8px;
      border-radius: 12px;
      color: var(--col-yellow);
    }

    .prompt-box {
      background: var(--col-card);
      border: 1px solid var(--col-card-border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      color: var(--col-yellow);
      margin-bottom: 10px;
    }
    .hebrew-text {
      font-family: 'Tinos', serif;
      direction: rtl;
      font-size: 32px !important;
      line-height: 1.4;
    }
    .action-btn {
      background: var(--col-active-tab);
      border: 1px solid #fff;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      margin-top: 8px;
    }
    .action-btn.green { background: var(--col-green); }
    .action-btn.red { background: var(--col-red); }

    .opt-btn {
      background: var(--col-card);
      border: 1px solid var(--col-active-tab);
      color: #fff;
      padding: 12px 6px;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .opt-btn.hebrew {
      font-family: 'Tinos', serif;
      direction: rtl;
      font-size: 26px;
    }
    .opt-btn.hint {
      background: #4d4411 !important;
      border-color: var(--col-yellow) !important;
      color: var(--col-yellow) !important;
    }
    .opt-btn.correct { background: var(--col-green) !important; border-color: #fff; }
    .opt-btn.wrong { background: var(--col-red) !important; border-color: #fff; }

    /* Velká tlačítka skládání (dvouřádkové) */
    .slots-row, .letters-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 10px auto;
      flex-wrap: wrap;
      max-width: 580px;
    }
    .letter-slot {
      min-width: 52px;
      height: 56px;
      padding: 0 8px;
      background: var(--col-card);
      border: 2px solid var(--col-active-tab);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }
    .letter-slot.filled { background: #143c28; border-color: var(--col-green); color: var(--col-green); }
    .letter-tile {
      min-width: 52px;
      height: 56px;
      padding: 0 8px;
      background: var(--col-card);
      border: 2px solid var(--col-active-tab);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      transition: transform 0.05s;
    }
    .letter-tile:active { transform: scale(0.92); }
    .letter-tile.hebrew { font-family: 'Tinos', serif; font-size: 32px; }
    .letter-tile.used { background: #181c24; border-color: #282d37; color: #4b5563; cursor: default; box-shadow: none; }

    /* Pexeso mřížka */
    .pexeso-grid {
      display: grid;
      gap: 8px;
      width: 100%;
      height: 100%;
      max-height: 380px;
      margin: auto 0;
    }
    .pexeso-card {
      background: var(--col-card);
      border: 2px solid var(--col-card-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
      color: #fff;
    }
    .pexeso-card:active { transform: scale(0.96); }
    .pexeso-card.hidden { background: #121c2c; color: var(--col-text-muted); font-size: 24px; }
    .pexeso-card.flipped { background: #1d3557; border-color: var(--col-active-tab); color: #fff; }
    .pexeso-card.matched { background: #143c28; border-color: var(--col-green); color: var(--col-green); cursor: default; }
    .pexeso-card.hebrew { font-family: 'Tinos', serif; direction: rtl; font-size: 22px; }

    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #101b2d;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .toggle-btn {
      background: #24344d;
      color: #fff;
      border: 1px solid var(--col-card-border);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .toggle-btn.on { background: var(--col-active-tab); border-color: #fff; }
  </style>
</head>
<body>

<div id="app-container">
  <header>
    <div id="btn-back" class="nav-btn" onclick="goBack()">&lt;</div>
    <div id="badge-user" class="badge" onclick="setScreen('SELECT_USER')">Uživatel</div>
    <div id="badge-subj" class="badge" style="display:none;" onclick="setScreen('SELECT_TOPIC')">Předmět</div>
    <div id="badge-topic" class="badge" style="display:none;" onclick="setScreen('SELECT_GAME')">Téma</div>
    <div class="spacer"></div>
    <div id="study-timer" class="study-timer-box" title="Čas učení dnes">⏱️ 00:00 / 15:00</div>
    <div class="nav-btn" onclick="syncData()" title="Synchronizovat">🔄</div>
  </header>

  <main id="main-content">
    <div style="text-align:center; margin-top:50px; color:var(--col-text-muted);">
      Načítám data z Google Sheets...
    </div>
  </main>

  <footer>
    <div id="footer-user">Žák: --</div>
    <div id="footer-goal">Cíl: 0/15 ★</div>
    <div id="status-info">Online</div>
  </footer>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxaxBIXP-ECpWstcqRDw8RuT_ds6UwcplU_3pZ9_-ksELN5FVeGt5EHjjexkJVmx1FR_w/exec";

  let appData = { users: [], vocab: [], quizzes: [], sequences: [] };
  let currentUser = JSON.parse(localStorage.getItem("cur_user") || '{"name":"Honzík","grade":9,"goal":25,"stars":0,"targetMinutes":15}');
  let filterGradeOnly = true;

  let currentScreen = "SELECT_USER";
  let selectedSubject = "";
  let currentTopicType = "";
  let currentTopicIndex = -1;
  let selectedGame = "";

  // 1. STAV PROGRESU CVIČENÍ (Cíl např. 10 bodů, při chybě klesá)
  const EXERCISE_TARGET = 10;
  let exerciseScore = 0;

  // 2. STOPKY ČASU UČENÍ (POVINNÝ + BONUSOVÝ ČAS)
  let todaySecondsStudied = Number(localStorage.getItem(`time_${new Date().toDateString()}_${currentUser.name}`) || 0);
  setInterval(() => {
    todaySecondsStudied++;
    localStorage.setItem(`time_${new Date().toDateString()}_${currentUser.name}`, todaySecondsStudied);
    updateStudyTimerUI();
  }, 1000);

  function updateStudyTimerUI() {
    const box = document.getElementById("study-timer");
    if (!box) return;

    const targetSec = (currentUser.targetMinutes || 15) * 60;
    const format = s => {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    };

    if (todaySecondsStudied < targetSec) {
      box.classList.remove("bonus");
      box.innerText = `⏱️ ${format(todaySecondsStudied)} / ${format(targetSec)}`;
    } else {
      const bonusSec = todaySecondsStudied - targetSec;
      box.classList.add("bonus");
      box.innerText = `★ BONUS: +${format(bonusSec)}`;
    }
  }

  // 4. PEXESO STAV S POČÍTADLEM POKUSŮ
  let pexesoPairCount = 4;
  let pexesoCards = [];
  let pexesoFlipped = [];
  let pexesoMatched = [];
  let pexesoLocked = false;
  let pexesoAttempts = 0; // Počet otočení

  // Zvuky
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playTone(freq, type, duration) {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }
  function sndOk() { playTone(880, 'sine', 0.08); setTimeout(() => playTone(1320, 'sine', 0.1), 80); }
  function sndErr() { playTone(220, 'square', 0.15); }
  function sndFanfare() {
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.1), i * 110));
  }

  function addReward(count = 1, section = "Lekce") {
    currentUser.stars = (currentUser.stars || 0) + count;
    localStorage.setItem("cur_user", JSON.stringify(currentUser));
    updateFooter();

    try {
      const fd = new URLSearchParams();
      fd.append("action", "log_activity");
      fd.append("user", currentUser.name);
      fd.append("section", section);
      fd.append("stars", count);
      fetch(API_URL, { method: "POST", mode: "no-cors", body: fd });
    } catch(e) {}
  }

  function updateFooter() {
    document.getElementById("footer-user").innerText = `${currentUser.name} (${currentUser.grade <= 9 ? currentUser.grade + '. tř.' : 'Dospělý'})`;
    document.getElementById("footer-goal").innerText = `Hvězdy: ${currentUser.stars}/${currentUser.goal} ★`;
  }

  async function loadData() {
    const cached = localStorage.getItem("app_data");
    if (cached) {
      try {
        appData = JSON.parse(cached);
        renderScreen();
      } catch(e) {}
    }
    await syncData();
  }

  async function syncData() {
    document.getElementById("status-info").innerText = "Stahuji...";
    try {
      const res = await fetch(API_URL);
      const json = await res.json();
      if (json && json.vocab) {
        appData = json;
        localStorage.setItem("app_data", JSON.stringify(json));
        document.getElementById("status-info").innerText = "Data aktuální";
        const foundU = appData.users.find(u => u.name === currentUser.name);
        if (foundU) {
          currentUser.goal = foundU.goal;
          currentUser.grade = foundU.grade;
        }
        renderScreen();
      }
    } catch(e) {
      document.getElementById("status-info").innerText = "Offline";
    }
  }

  async function saveWordMasteryToGoogle(lessonId, foreignWord, masteryLevel) {
    try {
      const fd = new URLSearchParams();
      fd.append("action", "save_mastery");
      fd.append("lessonId", lessonId);
      fd.append("foreign", foreignWord);
      fd.append("mastery", masteryLevel);
      fetch(API_URL, { method: "POST", mode: "no-cors", body: fd });
    } catch(e) {}
  }

  function goBack() {
    if (currentScreen === "PLAYING" && selectedGame === "PEXESO") setScreen("SELECT_PEXESO_SIZE");
    else if (currentScreen === "SELECT_PEXESO_SIZE") setScreen("SELECT_GAME");
    else if (currentScreen === "PLAYING") setScreen("SELECT_GAME");
    else if (currentScreen === "SELECT_GAME") setScreen("SELECT_TOPIC");
    else if (currentScreen === "SELECT_TOPIC") setScreen("SELECT_SUBJECT");
    else if (currentScreen === "SELECT_SUBJECT") setScreen("SELECT_USER");
  }

  function setScreen(scr) {
    currentScreen = scr;
    renderScreen();
  }

  function getActiveTopic() {
    if (currentTopicType === "VOCAB") return appData.vocab[currentTopicIndex];
    if (currentTopicType === "QUIZ") return appData.quizzes[currentTopicIndex];
    if (currentTopicType === "SEQ") return appData.sequences[currentTopicIndex];
    return null;
  }

  // 2. AUTOMATICKÝ PŘECHOD NA DALŠÍ AKTIVITU V ŘADĚ
  function checkAutoAdvanceActivity() {
    if (exerciseScore >= EXERCISE_TARGET) {
      sndFanfare();
      addReward(3, getActiveTopic().title);

      const gameSequence = ['CARDS', 'ADAPTIVE', 'SCRAMBLE', 'MISSING', 'PEXESO'];
      const curIdx = gameSequence.indexOf(selectedGame);

      setTimeout(() => {
        if (curIdx !== -1 && curIdx < gameSequence.length - 1) {
          const nextGame = gameSequence[curIdx + 1];
          if (nextGame === 'PEXESO') {
            startPexesoGame(4);
          } else {
            startGame(nextGame);
          }
        } else {
          setScreen("SELECT_GAME");
        }
      }, 1200);
      return true;
    }
    return false;
  }

  function renderScreen() {
    updateFooter();
    updateStudyTimerUI();
    const main = document.getElementById("main-content");
    const bUser = document.getElementById("badge-user");
    const bSubj = document.getElementById("badge-subj");
    const bTopic = document.getElementById("badge-topic");

    bUser.innerText = currentUser.name;

    // 1. VÝBĚR ŽÁKA
    if (currentScreen === "SELECT_USER") {
      bSubj.style.display = "none";
      bTopic.style.display = "none";
      const uList = (appData.users && appData.users.length) ? appData.users : [
        {name: "Daniel", grade: 2, goal: 10, targetMinutes: 10},
        {name: "Pavel", grade: 5, goal: 15, targetMinutes: 15},
        {name: "Míša", grade: 7, goal: 20, targetMinutes: 20},
        {name: "Honzík", grade: 9, goal: 25, targetMinutes: 25},
        {name: "Táta", grade: 99, goal: 30, targetMinutes: 30}
      ];

      main.innerHTML = `
        <h2 style="font-size:18px;margin-bottom:12px;text-align:center;color:var(--col-yellow);">Kdo se jde učit?</h2>
        <div class="grid-2">
          ${uList.map(u => `
            <div class="tile" style="${currentUser.name === u.name ? 'border-color:var(--col-green);background:#142838;' : ''}" onclick="selectUser('${u.name}', ${u.grade}, ${u.goal}, ${u.targetMinutes||15})">
              <h2>${u.name}</h2>
              <p>${u.grade <= 9 ? u.grade + '. třída ZŠ' : 'Dospělý'}</p>
              <p style="color:var(--col-yellow);margin-top:4px;">Cíl: ${u.goal} ★ | ⏱️ ${u.targetMinutes||15} min</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    // 2. VÝBĚR PŘEDMĚTU
    else if (currentScreen === "SELECT_SUBJECT") {
      bSubj.style.display = "none";
      bTopic.style.display = "none";

      const showHebrew = currentUser.grade >= 99 || !filterGradeOnly;

      main.innerHTML = `
        <div class="grid-2">
          <div class="tile" onclick="chooseSubject('CZ')"><h2>Český jazyk</h2><p>Slovní druhy, pády, I/Y, básničky</p></div>
          <div class="tile" onclick="chooseSubject('EN')"><h2>Angličtina</h2><p>Project 1 & slovíčka</p></div>
          <div class="tile" onclick="chooseSubject('DE')"><h2>Němčina</h2><p>Barvy, čísla, věty, členy</p></div>
          <div class="tile" onclick="chooseSubject('PRV')"><h2>Prvouka & čas</h2><p>Dny, měsíce, abeceda</p></div>
          ${showHebrew ? `
            <div class="tile" style="border-color:var(--col-yellow);" onclick="chooseSubject('HE')">
              <h2 style="color:var(--col-yellow);">Hebrejština</h2>
              <p>Jonáš 1, text Tanachu</p>
            </div>
          ` : ''}
        </div>
      `;
    }

    // 3. VÝBĚR TÉMATU S FILTREM ROČNÍKU
    else if (currentScreen === "SELECT_TOPIC") {
      bSubj.style.display = "flex";
      bSubj.innerText = selectedSubject;
      bTopic.style.display = "none";

      let html = `
        <div class="filter-bar">
          <span>Filtr (${currentUser.grade <= 9 ? currentUser.grade + '. tř.' : 'Dospělý'}):</span>
          <button class="toggle-btn ${filterGradeOnly ? 'on' : ''}" onclick="filterGradeOnly=!filterGradeOnly;renderScreen();">
            ${filterGradeOnly ? 'Jen pro mě' : 'Zobrazit vše'}
          </button>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
      `;

      let countShown = 0;

      appData.vocab.forEach((l, idx) => {
        if (l.lang.toUpperCase() === selectedSubject) {
          if (filterGradeOnly && l.minGrade > currentUser.grade) return;
          countShown++;
          html += `<div class="tile" style="flex-direction:row;justify-content:space-between;padding:12px;" onclick="selectTopic('VOCAB', ${idx})">
            <div style="text-align:left;">
              <h2>${l.title}</h2>
              <p>Lekce od ${l.minGrade <= 9 ? l.minGrade + '. třídy' : 'Dospělý'}</p>
            </div>
            <span style="color:var(--col-active-tab);font-weight:bold;">${l.words.length} slov</span>
          </div>`;
        }
      });

      appData.quizzes.forEach((q, idx) => {
        if (q.subject.toUpperCase() === selectedSubject) {
          if (filterGradeOnly && q.minGrade > currentUser.grade) return;
          countShown++;
          html += `<div class="tile" style="flex-direction:row;justify-content:space-between;padding:12px;" onclick="selectTopic('QUIZ', ${idx})">
            <div style="text-align:left;">
              <h2>${q.title}</h2>
              <p>Kvíz od ${q.minGrade <= 9 ? q.minGrade + '. třídy' : 'Dospělý'}</p>
            </div>
            <span style="color:var(--col-active-tab);font-weight:bold;">${q.questions.length} ot.</span>
          </div>`;
        }
      });

      appData.sequences.forEach((s, idx) => {
        if (s.category.toUpperCase() === selectedSubject) {
          if (filterGradeOnly && s.minGrade > currentUser.grade) return;
          countShown++;
          html += `<div class="tile" style="flex-direction:row;justify-content:space-between;padding:12px;" onclick="selectTopic('SEQ', ${idx})">
            <div style="text-align:left;">
              <h2>${s.title}</h2>
              <p>Řada na čas od ${s.minGrade <= 9 ? s.minGrade + '. třídy' : 'Dospělý'}</p>
            </div>
            <span style="color:var(--col-active-tab);font-weight:bold;">${s.count} položek</span>
          </div>`;
        }
      });

      if (countShown === 0) {
        html += `<div style="text-align:center;padding:25px;color:var(--col-text-muted);">Pro tento profil tu není specifické téma. Klikněte nahoře na "Zobrazit vše".</div>`;
      }

      html += '</div>';
      main.innerHTML = html;
    }

    // 4. VÝBĚR HRY
    else if (currentScreen === "SELECT_GAME") {
      const topic = getActiveTopic();
      bSubj.style.display = "flex";
      bTopic.style.display = "flex";
      bTopic.innerText = topic.title;

      main.innerHTML = `
        <div class="grid-2">
          <div class="tile" onclick="startGame('CARDS')"><h2>1. Karty</h2><p>Prohlížení a čtení</p></div>
          <div class="tile" onclick="startGame('ADAPTIVE')"><h2>2. Zkoušení</h2><p>Test z hlavy (mění skóre)</p></div>
          <div class="tile" onclick="startGame('SCRAMBLE')"><h2>3. Skládání</h2><p>Trénink písmen (velká tlačítka)</p></div>
          <div class="tile" onclick="startGame('MISSING')"><h2>4. Doplň písmeno</h2><p>Doplň chybějící znak</p></div>
        </div>
        ${currentTopicType === 'VOCAB' ? `
          <div class="tile" style="margin-top:10px;padding:14px;border-color:var(--col-yellow);" onclick="setScreen('SELECT_PEXESO_SIZE')">
            <h2 style="color:var(--col-yellow);">🃏 5. PEXESO</h2>
            <p>Hledej dvojice (slovo ↔ překlad)</p>
          </div>
        ` : ''}
      `;
    }

    // 5. VÝBĚR VELIKOSTI PEXESA
    else if (currentScreen === "SELECT_PEXESO_SIZE") {
      const topic = getActiveTopic();
      bSubj.style.display = "flex";
      bTopic.style.display = "flex";
      bTopic.innerText = topic.title;

      main.innerHTML = `
        <h2 style="font-size:18px;margin-bottom:12px;text-align:center;color:var(--col-yellow);">Vyber velikost pexesa:</h2>
        <div class="grid-2">
          <div class="tile" onclick="startPexesoGame(3)"><h2>6 KARET (2 × 3)</h2><p>3 dvojice – rychlovka</p></div>
          <div class="tile" onclick="startPexesoGame(4)"><h2>8 KARET (2 × 4)</h2><p>4 dvojice – pohodová hra</p></div>
          <div class="tile" onclick="startPexesoGame(6)"><h2>12 KARET (3 × 4)</h2><p>6 dvojic – klasika</p></div>
          <div class="tile" onclick="startPexesoGame(8)"><h2>16 KARET (4 × 4)</h2><p>8 dvojic – velká výzva!</p></div>
        </div>
      `;
    }

    // 6. SAMOTNÁ HRA
    else if (currentScreen === "PLAYING") {
      const topic = getActiveTopic();
      bSubj.style.display = "flex";
      bTopic.style.display = "flex";
      bTopic.innerText = topic.title;
      renderActiveGame();
    }
  }

  function selectUser(name, grade, goal, targetMinutes) {
    currentUser = { name, grade, goal, targetMinutes, stars: 0 };
    localStorage.setItem("cur_user", JSON.stringify(currentUser));
    todaySecondsStudied = Number(localStorage.getItem(`time_${new Date().toDateString()}_${currentUser.name}`) || 0);
    setScreen("SELECT_SUBJECT");
  }

  function chooseSubject(subj) {
    selectedSubject = subj;
    setScreen("SELECT_TOPIC");
  }

  function selectTopic(type, index) {
    currentTopicType = type;
    currentTopicIndex = index;
    if (type === "VOCAB") setScreen("SELECT_GAME");
    else {
      selectedGame = type;
      initGameState();
      setScreen("PLAYING");
    }
  }

  function startGame(game) {
    selectedGame = game;
    exerciseScore = 0; // Reset počítadla série
    initGameState();
    setScreen("PLAYING");
  }

  function startPexesoGame(pairCount) {
    pexesoPairCount = pairCount;
    selectedGame = "PEXESO";
    initPexeso();
    setScreen("PLAYING");
  }

  // ==========================================
  // ADAPTIVNÍ HERNÍ ENGINE
  // ==========================================
  let vMastery = {};
  let vActivePool = 3;
  let vCurrentWord = 0;
  let vCardIdx = 0;
  let vQuizRevealed = false;

  let scrambleDeck = [];
  let scramblePlaced = [];
  let scrambleLetters = [];
  let scrambleHadMistake = false;
  let scrambleDone = false;

  let missingDeck = [];
  let missingSlot = 0;
  let missingChoices = [];
  let missingChosen = -1;

  let qCurStep = 0;
  let qAnswered = false;

  let seqTargetIdx = 0;
  let seqSlots = [];
  let seqStartTime = 0;
  let seqTimerInterval = null;
  let seqHintActive = false;
  let seqInactivityTimer = null;

  function getGraphemes(str) {
    if (window.Intl && Intl.Segmenter) {
      const segmenter = new Intl.Segmenter('und', { granularity: 'grapheme' });
      return Array.from(segmenter.segment(str), s => s.segment);
    }
    return str.split('');
  }

  function initGameState() {
    const topic = getActiveTopic();
    if (currentTopicType === "VOCAB") {
      vMastery = {};
      let masteredCount = 0;
      topic.words.forEach((w, i) => {
        const m = Number(w.mastery || 0);
        vMastery[i] = m;
        if (m >= 2) masteredCount++;
      });
      vActivePool = Math.min(topic.words.length, Math.max(3, masteredCount + 3));

      if (selectedGame === "CARDS") vCardIdx = 0;
      if (selectedGame === "ADAPTIVE") pickNextAdaptiveWord();
      if (selectedGame === "SCRAMBLE") { scrambleDeck = []; initScramble(); }
      if (selectedGame === "MISSING") { missingDeck = []; initMissing(); }
    }
    if (selectedGame === "QUIZ") { qCurStep = 0; qAnswered = false; }
    if (selectedGame === "SEQ") initSequence();
  }

  function pickNextAdaptiveWord() {
    const topic = getActiveTopic();
    vQuizRevealed = false;
    const unmastered = [];
    const mastered = [];

    for (let i = 0; i < vActivePool; i++) {
      if ((vMastery[i] || 0) < 2) unmastered.push(i);
      else mastered.push(i);
    }

    if (unmastered.length === 0 && vActivePool < topic.words.length) {
      vActivePool = Math.min(topic.words.length, vActivePool + 2);
      for (let i = 0; i < vActivePool; i++) {
        if ((vMastery[i] || 0) < 2) unmastered.push(i);
      }
    }

    if (unmastered.length > 0 && (Math.random() < 0.8 || mastered.length === 0)) {
      vCurrentWord = unmastered[Math.floor(Math.random() * unmastered.length)];
    } else if (mastered.length > 0) {
      vCurrentWord = mastered[Math.floor(Math.random() * mastered.length)];
    } else {
      vCurrentWord = 0;
    }
  }

  function answerAdaptive(known) {
    const topic = getActiveTopic();
    const w = topic.words[vCurrentWord];

    if (known) {
      sndOk();
      exerciseScore = Math.min(EXERCISE_TARGET, exerciseScore + 1); // 1. POSTUP VPŘED
      vMastery[vCurrentWord] = Math.min(2, (vMastery[vCurrentWord] || 0) + 1);

      if (vMastery[vCurrentWord] >= 2 && vActivePool < topic.words.length) {
        vActivePool++;
      }
      saveWordMasteryToGoogle(topic.id, w.foreign, vMastery[vCurrentWord]);
    } else {
      sndErr();
      exerciseScore = Math.max(0, exerciseScore - 1); // 1. PŘI CHYBĚ KLESNE O 1 ZPĚT!
      vMastery[vCurrentWord] = 0;
      saveWordMasteryToGoogle(topic.id, w.foreign, 0);
    }

    // 2. Kontrola, zda je splněno 10/10 a přejde se automaticky na další hru
    if (!checkAutoAdvanceActivity()) {
      pickNextAdaptiveWord();
      renderActiveGame();
    }
  }

  function initScramble() {
    const topic = getActiveTopic();
    if (!scrambleDeck || scrambleDeck.length === 0) {
      scrambleDeck = topic.words.map((_, i) => i).sort(() => Math.random() - 0.5);
    }
    vCurrentWord = scrambleDeck.pop();
    const w = topic.words[vCurrentWord];
    scramblePlaced = [];
    scrambleHadMistake = false;
    scrambleDone = false;

    const graphemes = getGraphemes(w.foreign);
    scrambleLetters = graphemes.map(ch => ({ ch, used: false })).sort(() => Math.random() - 0.5);
  }

  function clickScrambleLetter(idx) {
    if (scrambleDone) return;
    const topic = getActiveTopic();
    const item = scrambleLetters[idx];
    if (item.used) return;

    const w = topic.words[vCurrentWord];
    const targetGraphemes = getGraphemes(w.foreign);
    const expected = targetGraphemes[scramblePlaced.length];

    if (item.ch === expected) {
      sndOk();
      item.used = true;
      scramblePlaced.push(item.ch);

      if (scramblePlaced.length === targetGraphemes.length) {
        scrambleDone = true;
        if (!scrambleHadMistake) {
          exerciseScore = Math.min(EXERCISE_TARGET, exerciseScore + 1); // +1 bod
          sndFanfare();
        } else {
          exerciseScore = Math.max(0, exerciseScore - 1); // Chyba vrátí skóre o 1 zpět!
        }
      }
    } else {
      sndErr();
      scrambleHadMistake = true;
    }
    renderActiveGame();
  }

  function nextScrambleStep() {
    if (!checkAutoAdvanceActivity()) {
      initScramble();
      renderActiveGame();
    }
  }

  function initMissing() {
    const topic = getActiveTopic();
    if (!missingDeck || missingDeck.length === 0) {
      missingDeck = topic.words.map((_, i) => i).sort(() => Math.random() - 0.5);
    }
    vCurrentWord = missingDeck.pop();
    const w = topic.words[vCurrentWord];
    const letters = getGraphemes(w.foreign);
    missingSlot = Math.floor(Math.random() * letters.length);
    const correctCh = letters[missingSlot];
    missingChosen = -1;

    const alphabet = "abcdefghijklmnopqrstuvwxyz";
    missingChoices = [correctCh];
    while (missingChoices.length < 3) {
      let r = alphabet[Math.floor(Math.random() * alphabet.length)];
      if (!missingChoices.includes(r)) missingChoices.push(r);
    }
    missingChoices.sort(() => Math.random() - 0.5);
  }

  function clickMissingOption(idx) {
    if (missingChosen !== -1) return;
    missingChosen = idx;
    const topic = getActiveTopic();
    const w = topic.words[vCurrentWord];
    const letters = getGraphemes(w.foreign);
    const isCorrect = missingChoices[idx] === letters[missingSlot];

    if (isCorrect) {
      sndOk();
      exerciseScore = Math.min(EXERCISE_TARGET, exerciseScore + 1);
    } else {
      sndErr();
      exerciseScore = Math.max(0, exerciseScore - 1); // Chyba srazí postup o 1
    }
    renderActiveGame();
  }

  function nextMissingStep() {
    if (!checkAutoAdvanceActivity()) {
      initMissing();
      renderActiveGame();
    }
  }

  // 4. PEXESO S POČÍTADLEM POKUSŮ A EFEKTIVITOU
  function initPexeso() {
    const topic = getActiveTopic();
    const count = Math.min(pexesoPairCount, topic.words.length);
    const shuffledWords = [...topic.words].sort(() => Math.random() - 0.5).slice(0, count);

    pexesoCards = [];
    shuffledWords.forEach((w, wIdx) => {
      pexesoCards.push({ id: `f_${wIdx}`, wordIdx: wIdx, text: w.foreign, isForeign: true });
      pexesoCards.push({ id: `c_${wIdx}`, wordIdx: wIdx, text: w.czech, isForeign: false });
    });

    pexesoCards.sort(() => Math.random() - 0.5);
    pexesoFlipped = [];
    pexesoMatched = [];
    pexesoLocked = false;
    pexesoAttempts = 0; // Reset pokusů
  }

  function clickPexesoCard(index) {
    if (pexesoLocked) return;
    if (pexesoFlipped.includes(index)) return;
    if (pexesoMatched.includes(pexesoCards[index].wordIdx)) return;

    pexesoFlipped.push(index);
    renderActiveGame();

    if (pexesoFlipped.length === 2) {
      pexesoAttempts++; // Každé 2 otočené karty = 1 pokus
      const idx1 = pexesoFlipped[0];
      const idx2 = pexesoFlipped[1];
      const card1 = pexesoCards[idx1];
      const card2 = pexesoCards[idx2];

      if (card1.wordIdx === card2.wordIdx) {
        sndOk();
        pexesoMatched.push(card1.wordIdx);
        pexesoFlipped = [];

        if (pexesoMatched.length === Math.min(pexesoPairCount, getActiveTopic().words.length)) {
          sndFanfare();
          // Ochrana proti zběsilému klikání: Plná odměna jen při rozumném počtu pokusů
          const maxIdealAttempts = pexesoPairCount * 2;
          const starsEarned = (pexesoAttempts <= maxIdealAttempts) ? (pexesoPairCount >= 6 ? 4 : 2) : 1;
          addReward(starsEarned, getActiveTopic().title);
        }
        renderActiveGame();
      } else {
        sndErr();
        pexesoLocked = true;
        setTimeout(() => {
          pexesoFlipped = [];
          pexesoLocked = false;
          renderActiveGame();
        }, 900);
      }
    }
  }

  // ==========================================
  // VYKRESLOVÁNÍ
  // ==========================================
  function renderActiveGame() {
    const main = document.getElementById("main-content");
    const topic = getActiveTopic();
    const isHebrew = selectedSubject === "HE";

    // 1. KARTY
    if (selectedGame === "CARDS") {
      const w = topic.words[vCardIdx];
      main.innerHTML = `
        <div class="exercise-progress-bar">
          <span>Prohlížení karet</span>
          <span class="progress-pill">${vCardIdx+1} / ${Math.min(EXERCISE_TARGET, topic.words.length)}</span>
        </div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}">${w.foreign}</div>
        <div class="prompt-box" style="color:#fff;font-size:22px;">${w.czech}</div>
        <div style="text-align:center;color:var(--col-active-tab);font-size:18px;margin-bottom:12px;">[ ${w.pron || ''} ]</div>
        <div class="grid-2">
          <div class="action-btn" onclick="vCardPrev()">Předchozí</div>
          <div class="action-btn" onclick="vCardNext()">Další (${vCardIdx+1}/${topic.words.length})</div>
        </div>
      `;
    }

    // 2. ADAPTIVNÍ ZKOUŠENÍ
    else if (selectedGame === "ADAPTIVE") {
      const w = topic.words[vCurrentWord];
      const mVal = vMastery[vCurrentWord] || 0;
      main.innerHTML = `
        <div class="exercise-progress-bar">
          <span>Test z hlavy (Cíl do postupu)</span>
          <span class="progress-pill" style="color:${exerciseScore > 0 ? 'var(--col-green)' : 'var(--col-yellow)'};">
            ${exerciseScore} / ${EXERCISE_TARGET}
          </span>
        </div>
        <div class="prompt-box" style="color:#fff;">${w.czech}</div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}" style="color:${vQuizRevealed ? 'var(--col-yellow)' : 'var(--col-text-muted)'};">
          ${vQuizRevealed ? w.foreign : '[ ? ? ? ]'}
        </div>
        ${vQuizRevealed ? `
          <div style="text-align:center;color:var(--col-active-tab);margin-bottom:8px;">[ ${w.pron || ''} ]</div>
          <div class="grid-2">
            <div class="action-btn red" onclick="answerAdaptive(false)">Nevěděl (-1 bod)</div>
            <div class="action-btn green" onclick="answerAdaptive(true)">Věděl jsem (+1 bod)</div>
          </div>
        ` : `
          <div class="action-btn" onclick="vQuizRevealed=true;renderActiveGame();">ZKONTROLOVAT</div>
        `}
      `;
    }

    // 3. SKLÁDÁNÍ SLOVA
    else if (selectedGame === "SCRAMBLE") {
      const w = topic.words[vCurrentWord];
      const targetGraphemes = getGraphemes(w.foreign);

      main.innerHTML = `
        <div class="exercise-progress-bar">
          <span>Skládání slov (bez chyby)</span>
          <span class="progress-pill" style="color:${exerciseScore > 0 ? 'var(--col-green)' : 'var(--col-yellow)'};">
            ${exerciseScore} / ${EXERCISE_TARGET}
          </span>
        </div>
        <div class="prompt-box" style="font-size:22px;color:#fff;margin-top:4px;">Slož: <b>${w.czech}</b></div>
        <div class="slots-row ${isHebrew ? 'hebrew-text' : ''}">
          ${targetGraphemes.map((ch, i) => `
            <div class="letter-slot ${i < scramblePlaced.length ? 'filled' : ''}">
              ${i < scramblePlaced.length ? scramblePlaced[i] : '_'}
            </div>
          `).join('')}
        </div>
        ${!scrambleDone ? `
          <div class="letters-row">
            ${scrambleLetters.map((item, idx) => `
              <div class="letter-tile ${isHebrew ? 'hebrew' : ''} ${item.used ? 'used' : ''}" onclick="clickScrambleLetter(${idx})">
                ${item.ch}
              </div>
            `).join('')}
          </div>
        ` : `
          <div style="text-align:center;color:var(--col-active-tab);margin-bottom:6px;">[ ${w.pron || ''} ]</div>
          <div class="action-btn ${scrambleHadMistake ? 'red' : 'green'}" onclick="nextScrambleStep()">
            ${scrambleHadMistake ? 'CHYBA (-1 BOD) ➔ DALŠÍ' : 'SPRÁVNĚ (+1 BOD) ➔ DALŠÍ'}
          </div>
        `}
      `;
    }

    // 4. DOPLŇOVÁNÍ PÍSMENE
    else if (selectedGame === "MISSING") {
      const w = topic.words[vCurrentWord];
      const letters = getGraphemes(w.foreign);

      let maskedWord = "";
      letters.forEach((ch, idx) => {
        if (idx === missingSlot) {
          maskedWord += missingChosen === -1 ? " [ _ ] " : ` [ ${ch} ] `;
        } else {
          maskedWord += ch + " ";
        }
      });

      main.innerHTML = `
        <div class="exercise-progress-bar">
          <span>Doplňování znaku</span>
          <span class="progress-pill" style="color:${exerciseScore > 0 ? 'var(--col-green)' : 'var(--col-yellow)'};">
            ${exerciseScore} / ${EXERCISE_TARGET}
          </span>
        </div>
        <div class="prompt-box" style="font-size:20px;color:#fff;margin-top:4px;">Doplň: <b>${w.czech}</b></div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}">${maskedWord}</div>
        <div class="grid-2">
          ${missingChoices.map((ch, i) => {
            const isCorrect = ch === letters[missingSlot];
            const cls = missingChosen !== -1 ? (isCorrect ? 'correct' : (i === missingChosen ? 'wrong' : '')) : '';
            return `<div class="opt-btn ${isHebrew ? 'hebrew' : ''} ${cls}" onclick="clickMissingOption(${i})">${ch}</div>`;
          }).join('')}
        </div>
        ${missingChosen !== -1 ? `<div class="action-btn" onclick="nextMissingStep()">DALŠÍ ➔</div>` : ''}
      `;
    }

    // 5. PEXESO
    else if (selectedGame === "PEXESO") {
      const totalPairs = Math.min(pexesoPairCount, topic.words.length);
      const isComplete = pexesoMatched.length === totalPairs;
      const cols = 4;

      main.innerHTML = `
        <div class="exercise-progress-bar">
          <span>Dvojice: ${pexesoMatched.length} / ${totalPairs}</span>
          <span class="progress-pill">Pokusy: ${pexesoAttempts}</span>
        </div>
        ${!isComplete ? `
          <div class="pexeso-grid" style="grid-template-columns: repeat(${cols}, 1fr);">
            ${pexesoCards.map((c, i) => {
              const isMatched = pexesoMatched.includes(c.wordIdx);
              const isFlipped = pexesoFlipped.includes(i);
              let cls = isMatched ? 'matched' : (isFlipped ? 'flipped' : 'hidden');
              if (c.isForeign && isHebrew) cls += ' hebrew';
              return `
                <div class="pexeso-card ${cls}" onclick="clickPexesoCard(${i})">
                  ${isMatched || isFlipped ? c.text : '❓'}
                </div>
              `;
            }).join('')}
          </div>
        ` : `
          <div style="text-align:center;padding:30px 10px;">
            <h2 style="color:var(--col-green);font-size:26px;margin-bottom:8px;">VÝBORNĚ! PEXESO SPLNĚNO!</h2>
            <p style="color:var(--col-yellow);font-size:18px;margin-bottom:6px;">Hotovo za ${pexesoAttempts} pokusů!</p>
            <p style="color:var(--col-text-muted);font-size:14px;margin-bottom:20px;">
              ${pexesoAttempts <= totalPairs * 2 ? 'Skvělá paměť! Žádné zbytečné klikání.' : 'Příště zkus klikat rozvážněji a méně naslepo!'}
            </p>
            <div class="action-btn green" onclick="initPexeso();renderActiveGame();">HRÁT ZNOVU ➔</div>
            <div class="action-btn" style="margin-top:10px;" onclick="setScreen('SELECT_PEXESO_SIZE')">ZMĚNIT VELIKOST PEXESA</div>
          </div>
        `}
      `;
    }

    // 6. KVÍZ
    else if (selectedGame === "QUIZ") {
      const q = topic.questions[qCurStep];
      main.innerHTML = `
        <div class="exercise-progress-bar">
          <span>Kvíz</span>
          <span class="progress-pill">${qCurStep+1} / ${topic.questions.length}</span>
        </div>
        <div class="prompt-box" style="font-size:20px;color:#fff;">${q.prompt}</div>
        <div class="grid-2" style="margin-top:10px;">
          ${q.options.map((opt, i) => `
            <div class="opt-btn ${qAnswered ? (i === q.correctIdx ? 'correct' : 'wrong') : ''}" onclick="clickQuizOpt(${i})">
              ${opt}
            </div>
          `).join('')}
        </div>
        ${qAnswered ? `<div class="action-btn" onclick="nextQuizStep()">DALŠÍ ➔</div>` : ''}
      `;
    }

    // 7. POSLOUPNOSTI NA ČAS
    else if (selectedGame === "SEQ") {
      const isFinished = seqTargetIdx >= topic.items.length;
      const targetWord = topic.items[seqTargetIdx];

      main.innerHTML = `
        <div class="exercise-progress-bar">
          <span>Položka ${Math.min(seqTargetIdx+1, topic.items.length)} / ${topic.items.length} ${seqHintActive ? '<b style="color:var(--col-yellow);">[NÁPOVĚDA]</b>' : ''}</span>
          <span id="seq-timer" class="progress-pill">0.0 s</span>
        </div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}" style="margin:8px 0;min-height:56px;color:#fff;font-size:22px;">
          ${topic.items.slice(0, seqTargetIdx).join(' ')} 
          <span style="color:var(--col-yellow);">${seqHintActive ? `[ ${targetWord}! ]` : '[ ??? ]'}</span>
        </div>
        ${!isFinished ? `
          <div class="grid-2">
            ${seqSlots.map((itemIdx, slot) => {
              const isHintSlot = (seqHintActive && itemIdx === seqTargetIdx);
              return `
                <div id="seq-btn-${slot}" class="opt-btn ${isHebrew ? 'hebrew' : ''} ${isHintSlot ? 'hint' : ''}" onclick="clickSeqSlot(${slot})">
                  ${itemIdx !== -1 ? topic.items[itemIdx] : ''}
                </div>
              `;
            }).join('')}
          </div>
        ` : `
          <div class="action-btn green" onclick="initSequence();renderActiveGame();">DOKONČENO! HRÁT ZNOVU</div>
        `}
      `;
    }
  }

  function vCardPrev() {
    const topic = getActiveTopic();
    vCardIdx = (vCardIdx + topic.words.length - 1) % topic.words.length;
    renderActiveGame();
  }
  function vCardNext() {
    const topic = getActiveTopic();
    vCardIdx = vCardIdx + 1;
    if (vCardIdx >= Math.min(EXERCISE_TARGET, topic.words.length)) {
      // Po prohlédnutí 10 karet automaticky přejde na zkoušení!
      exerciseScore = EXERCISE_TARGET;
      checkAutoAdvanceActivity();
    } else {
      renderActiveGame();
    }
  }

  function clickQuizOpt(idx) {
    if (qAnswered) return;
    const topic = getActiveTopic();
    const q = topic.questions[qCurStep];
    qAnswered = true;
    if (idx === q.correctIdx) { sndOk(); addReward(1, topic.title); }
    else sndErr();
    renderActiveGame();
  }
  function nextQuizStep() {
    const topic = getActiveTopic();
    qCurStep++;
    qAnswered = false;
    if (qCurStep >= topic.questions.length) setScreen("SELECT_TOPIC");
    else renderActiveGame();
  }

  function resetInactivityTimer() {
    if (seqInactivityTimer) clearTimeout(seqInactivityTimer);
    seqInactivityTimer = setTimeout(() => {
      seqHintActive = true;
      renderActiveGame();
    }, 3000);
  }

  function initSequence() {
    const topic = getActiveTopic();
    seqTargetIdx = 0;
    seqHintActive = false;
    seqSlots = [-1, -1, -1, -1];
    seqSlots[0] = 0;
    if (topic.items.length > 1) seqSlots[1] = 1;
    for (let s = 2; s < Math.min(4, topic.items.length); s++) seqSlots[s] = s;
    seqSlots.sort(() => Math.random() - 0.5);

    seqStartTime = Date.now();
    if (seqTimerInterval) clearInterval(seqTimerInterval);
    seqTimerInterval = setInterval(() => {
      const el = document.getElementById("seq-timer");
      if (el && seqTargetIdx < topic.items.length) {
        el.innerText = ((Date.now() - seqStartTime) / 1000).toFixed(1) + " s";
      }
    }, 100);

    resetInactivityTimer();
  }

  function clickSeqSlot(slot) {
    const topic = getActiveTopic();
    const btnEl = document.getElementById(`seq-btn-${slot}`);

    if (seqSlots[slot] === seqTargetIdx) {
      sndOk();
      seqTargetIdx++;
      seqHintActive = false;

      if (seqTargetIdx >= topic.items.length) {
        clearInterval(seqTimerInterval);
        if (seqInactivityTimer) clearTimeout(seqInactivityTimer);
        sndFanfare();
        addReward(3, topic.title);
      } else {
        const next = seqTargetIdx + 1;
        seqSlots[slot] = next < topic.items.length ? next : -1;
        resetInactivityTimer();
      }
      renderActiveGame();
    } else {
      sndErr();
      if (btnEl) {
        btnEl.classList.add("wrong");
        setTimeout(() => { if (btnEl) btnEl.classList.remove("wrong"); }, 250);
      }
      seqHintActive = true;
      resetInactivityTimer();
      renderActiveGame();
    }
  }

  loadData();
</script>
</body>
</html>
