<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Výukový Systém</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Výuka">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1528">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7.1">
</head>
<body>

<div id="app-container">
  <header>
    <div id="btn-back" class="nav-btn" onclick="goBack()">&lt;</div>
    <div id="badge-user" class="badge" onclick="setScreen('SELECT_USER')">Uživatel</div>
    <div id="badge-subj" class="badge" style="display:none;" onclick="setScreen('SELECT_GROUP')">Předmět</div>
    <div id="badge-group" class="badge" style="display:none;" onclick="setScreen('SELECT_GAME')">Skupina</div>
    <div class="spacer"></div>
    <div id="btn-tts-auto" class="tts-toggle-btn active" onclick="toggleAutoTTS()" title="Automatické čtení">🔊 Auto</div>
    <div id="study-timer" class="study-timer-box" title="Čas studia dnes">⏱️ 00:00 / 15:00</div>
    <div class="nav-btn" onclick="syncData()" title="Synchronizovat">🔄</div>
  </header>

  <main id="main-content">
    <div style="text-align:center; margin-top:50px; color:var(--col-text-muted);">
      Načítám výuku...
    </div>
  </main>

  <footer>
    <div id="footer-user">Žák: --</div>
    <div id="footer-status" style="color:var(--col-active-tab);cursor:pointer;" onclick="forceHardReload()">v7.1 (OK)</div>
    <div id="footer-goal">0 / 15 min ⏱️</div>
  </footer>
</div>

<!-- NADEFINOVANÉ POŘADÍ SKRIPTŮ (DŮLEŽITÉ) -->
<script src="main.js?v=7.1"></script>
<script src="game_core.js?v=7.1"></script>
<script src="game_modes.js?v=7.1"></script>
<script src="game_arcade.js?v=7.1"></script>
<script src="game_pexeso.js?v=7.1"></script>
<script src="game_snake.js?v=7.1"></script>
<script src="game_campaign.js?v=7.1"></script>
<script src="game_math.js?v=7.1"></script>
<script src="game_story.js?v=7.1"></script>

</body>
</html>
