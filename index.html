<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Výukový Systém</title>
  
  <!-- Invariant: iOS Fullscreen & Standalone PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Výuka">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1528">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --col-bg: #0b1528;
      --col-card: #18263e;
      --col-card-border: #31507d;
      --col-active-tab: #00bcd4;
      --col-green: #22c55e;
      --col-red: #ef4444;
      --col-yellow: #facc15;
      --col-orange: #f97316;
      --col-text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Roboto', sans-serif;
    }
    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }
    #app-container {
      width: 100vw;
      max-width: 680px;
      height: 100vh;
      max-height: 600px;
      background-color: var(--col-bg);
      display: flex;
      flex-direction: column;
      border: 2px solid var(--col-card-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    @media (max-width: 680px), (max-height: 600px) {
      #app-container { border-radius: 0; border: none; max-width: 100vw; max-height: 100vh; }
    }
    header {
      height: 48px;
      background-color: var(--col-card);
      border-bottom: 2px solid var(--col-card-border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
    }
    .nav-btn {
      background: var(--col-active-tab);
      color: #fff;
      border: 1px solid #fff;
      border-radius: 6px;
      height: 34px;
      min-width: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    .badge {
      background: #242c3a;
      border: 1px solid var(--col-card-border);
      padding: 0 8px;
      height: 32px;
      display: flex;
      align-items: center;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      max-width: 130px;
    }
    .badge.active { background: var(--col-active-tab); border-color: #fff; }
    .spacer { flex: 1; }

    .tts-toggle-btn {
      background: #24344d;
      border: 1px solid var(--col-card-border);
      color: #fff;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .tts-toggle-btn.active { background: var(--col-green); border-color: #fff; }

    .study-timer-box {
      background: #101c2e;
      border: 1px solid var(--col-card-border);
      padding: 4px 7px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .study-timer-box.bonus { border-color: var(--col-yellow); color: var(--col-yellow); background: #2d2605; }
    .study-timer-box.paused { border-color: var(--col-orange); color: var(--col-orange); }

    main {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
    }
    footer {
      height: 32px;
      background-color: var(--col-card);
      border-top: 1px solid var(--col-card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 12px;
      color: var(--col-yellow);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .tile {
      background-color: var(--col-card);
      border: 1px solid var(--col-card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 10px;
      transition: transform 0.05s, border-color 0.1s;
    }
    .tile:active { transform: scale(0.97); border-color: #fff; }
    .tile h2 { font-size: 17px; color: #fff; margin-bottom: 4px; }
    .tile p { font-size: 12px; color: var(--col-text-muted); }

    .bargraph-container {
      background: #111a2a;
      border: 1px solid var(--col-card-border);
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bargraph-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
    }
    .bargraph-track {
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .bargraph-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--col-active-tab), var(--col-green));
      border-radius: 5px;
      transition: width 0.3s ease;
    }

    .prompt-box {
      background: var(--col-card);
      border: 1px solid var(--col-card-border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      color: var(--col-yellow);
      margin-bottom: 10px;
      position: relative;
    }
    .hebrew-text {
      font-family: 'Tinos', serif;
      direction: rtl;
      font-size: 32px !important;
      line-height: 1.4;
    }
    .audio-btn {
      position: absolute;
      right: 12px;
      top: 12px;
      font-size: 20px;
      cursor: pointer;
      opacity: 0.8;
    }

    .action-btn {
      background: var(--col-active-tab);
      border: 1px solid #fff;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      margin-top: 8px;
    }
    .action-btn.green { background: var(--col-green); }
    .action-btn.red { background: var(--col-red); }

    .opt-btn {
      background: var(--col-card);
      border: 1px solid var(--col-active-tab);
      color: #fff;
      padding: 12px 6px;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .opt-btn.hebrew { font-family: 'Tinos', serif; direction: rtl; font-size: 26px; }
    .opt-btn.hint { background: #4d4411 !important; border-color: var(--col-yellow) !important; color: var(--col-yellow) !important; }
    .opt-btn.correct { background: var(--col-green) !important; border-color: #fff; }
    .opt-btn.wrong { background: var(--col-red) !important; border-color: #fff; }

    /* Velká tlačítka skládání */
    .slots-row, .letters-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 8px auto;
      flex-wrap: wrap;
      max-width: 580px;
    }
    .letter-slot {
      min-width: 50px;
      height: 52px;
      padding: 0 10px;
      background: var(--col-card);
      border: 2px solid var(--col-active-tab);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }
    .letter-slot.word-slot {
      min-width: 80px;
      font-size: 19px;
    }
    .letter-slot.filled { background: #143c28; border-color: var(--col-green); color: var(--col-green); }
    .letter-tile {
      min-width: 50px;
      height: 52px;
      padding: 0 10px;
      background: var(--col-card);
      border: 2px solid var(--col-active-tab);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      transition: transform 0.05s;
    }
    .letter-tile.word-tile {
      min-width: 80px;
      font-size: 19px;
      padding: 6px 12px;
    }
    .letter-tile:active { transform: scale(0.92); }
    .letter-tile.hebrew { font-family: 'Tinos', serif; font-size: 30px; }
    .letter-tile.used { background: #181c24; border-color: #282d37; color: #4b5563; cursor: default; box-shadow: none; }

    .pexeso-grid {
      display: grid;
      gap: 10px;
      width: 100%;
      flex: 1;
      min-height: 340px;
      margin: 4px 0;
    }
    .pexeso-card {
      background: var(--col-card);
      border: 2px solid var(--col-card-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .pexeso-card:active { transform: scale(0.95); }
    .pexeso-card.hidden { background: #121c2c; color: var(--col-text-muted); font-size: 26px; }
    .pexeso-card.flipped { background: #1d3557; border-color: var(--col-active-tab); color: #fff; }
    .pexeso-card.matched { background: #143c28; border-color: var(--col-green); color: var(--col-green); cursor: default; }
    .pexeso-card.hebrew { font-family: 'Tinos', serif; direction: rtl; font-size: 24px; }

    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #101b2d;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .toggle-btn {
      background: #24344d;
      color: #fff;
      border: 1px solid var(--col-card-border);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .toggle-btn.on { background: var(--col-active-tab); border-color: #fff; }

    /* Streak oheň */
    .streak-badge {
      color: var(--col-orange);
      font-weight: bold;
      font-size: 13px;
      margin-left: 4px;
    }
  </style>
</head>
<body>

<div id="app-container">
  <header>
    <div id="btn-back" class="nav-btn" onclick="goBack()">&lt;</div>
    <div id="badge-user" class="badge" onclick="setScreen('SELECT_USER')">Uživatel</div>
    <div id="badge-subj" class="badge" style="display:none;" onclick="setScreen('SELECT_GROUP')">Předmět</div>
    <div id="badge-group" class="badge" style="display:none;" onclick="setScreen('SELECT_GAME')">Skupina</div>
    <div class="spacer"></div>
    <div id="btn-tts-auto" class="tts-toggle-btn active" onclick="toggleAutoTTS()" title="Automatické čtení">🔊 Auto</div>
    <div id="study-timer" class="study-timer-box" title="Čas studia dnes">⏱️ 00:00 / 15:00</div>
    <div class="nav-btn" onclick="syncData()" title="Synchronizovat">🔄</div>
  </header>

  <main id="main-content">
    <div style="text-align:center; margin-top:50px; color:var(--col-text-muted);">
      Načítám data z Google Sheets...
    </div>
  </main>

  <footer>
    <div id="footer-user">Žák: --</div>
    <div id="footer-status" style="color:var(--col-active-tab);cursor:pointer;" onclick="forceHardReload()">v4.0 (Obnovit)</div>
    <div id="footer-goal">0 / 15 min ⏱️</div>
  </footer>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxaxBIXP-ECpWstcqRDw8RuT_ds6UwcplU_3pZ9_-ksELN5FVeGt5EHjjexkJVmx1FR_w/exec";

  let appData = { users: [], progress: {}, items: [] };
  let currentUser = JSON.parse(localStorage.getItem("cur_user") || 'null');
  let filterExactGradeOnly = true;
  let viewMode = "LESSONS";

  let currentScreen = "SELECT_USER";
  let selectedSubject = "";
  let selectedGroupKey = "";
  let activeItems = [];
  let selectedGame = "";

  // Směr zkoušení: DIR_OUT = CZ -> Cizí, DIR_IN = Cizí -> CZ
  let testingDirection = localStorage.getItem("testing_dir") || "DIR_OUT";

  function forceHardReload() {
    window.location.href = window.location.origin + window.location.pathname + '?reload=' + Date.now();
  }

  // --- TRVALÁ SPRÁVA ČASU & STREAK ---
  function getStudyTimeKey(userName) {
    const d = new Date();
    const dateKey = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    const uKey = (userName || 'user').toLowerCase().trim();
    return `study_sec_${dateKey}_${uKey}`;
  }

  function loadUserStudyTime(userName) {
    if (!userName) return 0;
    return Number(localStorage.getItem(getStudyTimeKey(userName)) || 0);
  }

  function getUserStreak(userName) {
    if (!userName) return 0;
    return Number(localStorage.getItem(`streak_${userName.toLowerCase().trim()}`) || 0);
  }

  function updateUserStreak(userName, targetMinutes) {
    if (!userName) return;
    const uKey = userName.toLowerCase().trim();
    const d = new Date();
    const todayStr = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    const lastCompleted = localStorage.getItem(`streak_last_date_${uKey}`);
    
    if (lastCompleted === todayStr) return; // Dnes už započteno

    let streak = Number(localStorage.getItem(`streak_${uKey}`) || 0);
    const yest = new Date(Date.now() - 86400000);
    const yestStr = `${yest.getFullYear()}-${yest.getMonth() + 1}-${yest.getDate()}`;

    if (lastCompleted === yestStr) {
      streak += 1;
    } else {
      streak = 1;
    }

    localStorage.setItem(`streak_${uKey}`, streak);
    localStorage.setItem(`streak_last_date_${uKey}`, todayStr);
  }

  let todaySecondsStudied = currentUser ? loadUserStudyTime(currentUser.name) : 0;
  let lastUserActivityTime = Date.now();
  let isTimerPaused = false;

  function registerUserAction() {
    lastUserActivityTime = Date.now();
    if (isTimerPaused) {
      isTimerPaused = false;
      updateStudyTimerUI();
    }
  }

  window.addEventListener('click', registerUserAction, true);
  window.addEventListener('touchstart', registerUserAction, true);

  // INVARIANT: Přísná pauza po 15 sekundách bez dotyku
  setInterval(() => {
    if (currentScreen === "PLAYING" && currentUser) {
      const idleTime = Date.now() - lastUserActivityTime;
      if (idleTime < 15000) {
        todaySecondsStudied++;
        localStorage.setItem(getStudyTimeKey(currentUser.name), todaySecondsStudied);
        isTimerPaused = false;

        const targetSec = (currentUser.targetMinutes || 15) * 60;
        if (todaySecondsStudied >= targetSec) {
          updateUserStreak(currentUser.name, currentUser.targetMinutes || 15);
        }
      } else {
        isTimerPaused = true;
      }
    } else {
      isTimerPaused = true;
    }
    updateStudyTimerUI();
  }, 1000);

  function updateStudyTimerUI() {
    const box = document.getElementById("study-timer");
    const footerGoal = document.getElementById("footer-goal");
    if (!box || !currentUser) return;

    const targetSec = (currentUser.targetMinutes || 15) * 60;
    const format = s => {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    };

    const spentMin = Math.floor(todaySecondsStudied / 60);
    if (footerGoal) {
      footerGoal.innerText = `${spentMin} / ${currentUser.targetMinutes || 15} min ⏱️`;
    }

    if (currentScreen !== "PLAYING" || isTimerPaused) {
      box.className = "study-timer-box paused";
      box.innerText = `⏸️ ${format(todaySecondsStudied)} / ${format(targetSec)}`;
    } else if (todaySecondsStudied < targetSec) {
      box.className = "study-timer-box";
      box.innerText = `⏱️ ${format(todaySecondsStudied)} / ${format(targetSec)}`;
    } else {
      const bonusSec = todaySecondsStudied - targetSec;
      box.className = "study-timer-box bonus";
      box.innerText = `★ BONUS: +${format(bonusSec)}`;
    }
  }

  // --- AUTOMATICKÁ VÝSLOVNOST ---
  let isAutoTTS = localStorage.getItem("auto_tts") !== "false";

  function toggleAutoTTS() {
    isAutoTTS = !isAutoTTS;
    localStorage.setItem("auto_tts", isAutoTTS);
    updateTTSBtnUI();
  }

  function updateTTSBtnUI() {
    const btn = document.getElementById("btn-tts-auto");
    if (!btn) return;
    btn.className = isAutoTTS ? "tts-toggle-btn active" : "tts-toggle-btn";
    btn.innerText = isAutoTTS ? "🔊 Auto" : "🔇 Vyp";
  }

  function speakWord(text, subjectName) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    let toSpeak = text;
    if (text.toLowerCase().includes('read - read - read') || text.toLowerCase().includes('read-read-read')) {
      toSpeak = "read, red, red";
    } else if (text.includes('-')) {
      toSpeak = text.replace(/\//g, ' or ').replace(/-/g, ', ');
    }

    const u = new SpeechSynthesisUtterance(toSpeak);
    const s = (subjectName || selectedSubject || '').toLowerCase();
    
    let targetLang = 'cs-CZ';
    if (s.includes('angli') || s === 'en') targetLang = 'en-US';
    else if (s.includes('nemc') || s === 'de') targetLang = 'de-DE';
    else if (s.includes('hebr') || s === 'he') targetLang = 'he-IL';

    u.lang = targetLang;
    u.rate = 0.86;

    const voices = window.speechSynthesis.getVoices();
    if (voices.length > 0) {
      const match = voices.find(v => v.lang.startsWith(targetLang.split('-')[0]));
      if (match) u.voice = match;
    }

    window.speechSynthesis.speak(u);
  }

  function getAdaptiveWindowSize(grade) {
    const g = parseInt(grade) || 2;
    if (g >= 90) return 12;
    if (g >= 10) return 10;
    return Math.max(3, g);
  }

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playTone(freq, type, duration) {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }
  function sndOk() { playTone(880, 'sine', 0.08); setTimeout(() => playTone(1320, 'sine', 0.1), 80); }
  function sndErr() { playTone(220, 'square', 0.15); }
  function sndFanfare() {
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.1), i * 110));
  }

  function addReward(count = 1, section = "Lekce") {
    if (!currentUser) return;
    currentUser.stars = (currentUser.stars || 0) + count;
    localStorage.setItem("cur_user", JSON.stringify(currentUser));
    updateFooter();

    try {
      const fd = new URLSearchParams();
      fd.append("action", "log_activity");
      fd.append("user", currentUser.name);
      fd.append("subject", selectedSubject);
      fd.append("section", section);
      fd.append("stars", count);
      fd.append("minutes", (todaySecondsStudied / 60).toFixed(1));
      fetch(API_URL, { method: "POST", mode: "no-cors", body: fd });
    } catch(e) {}
  }

  function updateFooter() {
    if (!currentUser) return;
    const g = parseInt(currentUser.grade) || 2;
    const gradeLabel = g >= 10 && g < 90 ? `${g - 9}. ročník SŠ` : (g <= 9 ? `${g}. tř.` : 'Dospělý');
    const streak = getUserStreak(currentUser.name);
    document.getElementById("footer-user").innerHTML = `${currentUser.name} (${gradeLabel}) <span class="streak-badge">🔥 ${streak}</span>`;
  }

  async function loadData() {
    const cached = localStorage.getItem("app_data");
    if (cached) {
      try {
        appData = JSON.parse(cached);
        if (!appData.items) appData.items = [];
        renderScreen();
      } catch(e) {}
    }
    await syncData();
  }

  async function syncData() {
    const statusEl = document.getElementById("footer-status");
    if (statusEl) statusEl.innerText = "Stahuji...";
    try {
      const res = await fetch(API_URL);
      const json = await res.json();
      
      if (!json.items) {
        if (statusEl) statusEl.innerText = "Chyba API";
        return;
      }

      appData = json;
      localStorage.setItem("app_data", JSON.stringify(json));

      const subjs = [...new Set(appData.items.map(i => i.subject))];
      if (statusEl) statusEl.innerText = `OK: ${appData.items.length} úloh`;

      if (currentUser && appData.users) {
        const foundU = appData.users.find(u => u.name.toLowerCase() === currentUser.name.toLowerCase());
        if (foundU) {
          currentUser.targetMinutes = foundU.targetMinutes || 15;
          currentUser.grade = parseInt(foundU.grade) || 2;
          localStorage.setItem("cur_user", JSON.stringify(currentUser));
        }
      }
      renderScreen();
    } catch(e) {
      if (statusEl) statusEl.innerText = "Offline";
    }
  }

  // Uložení pokroku do Google Sheets s 4-prvkovým klíčem
  async function saveWordMasteryToGoogle(itemQuestion, masteryLevel, direction) {
    if (!currentUser) return;
    try {
      const uKey = currentUser.name.toLowerCase().trim();
      const compKey = `${selectedSubject}:::${itemQuestion}:::${direction}`;
      
      if (!appData.progress) appData.progress = {};
      if (!appData.progress[uKey]) appData.progress[uKey] = {};
      appData.progress[uKey][compKey] = masteryLevel;
      localStorage.setItem("app_data", JSON.stringify(appData));

      const fd = new URLSearchParams();
      fd.append("action", "save_mastery");
      fd.append("user", currentUser.name);
      fd.append("subject", selectedSubject);
      fd.append("foreign", itemQuestion);
      fd.append("mastery", masteryLevel);
      fd.append("direction", direction);
      fetch(API_URL, { method: "POST", mode: "no-cors", body: fd });
    } catch(e) {}
  }

  function getSavedMastery(itemQuestion, direction) {
    if (!currentUser || !appData.progress) return 0;
    const uKey = currentUser.name.toLowerCase().trim();
    const userMap = appData.progress[uKey];
    if (!userMap) return 0;
    const compKey = `${selectedSubject}:::${itemQuestion}:::${direction}`;
    if (userMap[compKey] !== undefined) return Number(userMap[compKey]);
    // Zpětná kompatibilita pro stará data bez směru
    if (userMap[itemQuestion] !== undefined) return Number(userMap[itemQuestion]);
    return 0;
  }

    if (currentScreen === "PLAYING" && selectedGame === "PEXESO") setScreen("SELECT_PEXESO_SIZE");
    else if (currentScreen === "SELECT_PEXESO_SIZE") setScreen("SELECT_GAME");
    else if (currentScreen === "PLAYING") {

      else setScreen("SELECT_GAME");

    else if (currentScreen === "SELECT_GAME") setScreen("SELECT_GROUP");
    else if (currentScreen === "SELECT_GROUP") setScreen("SELECT_SUBJECT");
    else if (currentScreen === "SELECT_SUBJECT") setScreen("SELECT_USER");
  }

  function getVocabItems() { return (activeItems || []).filter(it => it.type === "SLOVO"); }

  // Zjištění rychlé volby (der/die/das, a/an, i/y)
  function getQuickChoiceMode() {
    const s = selectedSubject.toLowerCase();
    if (s.includes("nemc") || s === "de") return "DER_DIE_DAS";
    if (s.includes("angli") || s === "en") return "A_AN";
    if (s.includes("cest") || s === "cs") return "I_Y";
    return null;
  }

  // Výpočet procenta zvládnutí skupiny (Mastery bar v menu)
  function getGroupMasteryPercent(groupItems, subjName) {
    if (!currentUser || !groupItems || groupItems.length === 0) return 0;
    const vList = groupItems.filter(it => it.type === "SLOVO");
    if (vList.length === 0) return 0;

    let points = 0;
    const totalPossible = vList.length * 4; // 2 body pro DIR_OUT + 2 body pro DIR_IN

    vList.forEach(it => {
      const mOut = getSavedMastery(it.question, "DIR_OUT");
      const mIn = getSavedMastery(it.question, "DIR_IN");
      points += (mOut + mIn);
    });

    return Math.min(100, Math.round((points / totalPossible) * 100));
  }

  function selectUser(name, grade, targetMinutes) {
    currentUser = { name, grade: parseInt(grade) || 2, targetMinutes: parseInt(targetMinutes) || 15, stars: 0 };
    localStorage.setItem("cur_user", JSON.stringify(currentUser));
    todaySecondsStudied = loadUserStudyTime(currentUser.name);
    lastUserActivityTime = Date.now();
    isTimerPaused = false;
    updateStudyTimerUI();
    setScreen("SELECT_SUBJECT");
  }

  function chooseSubject(subj) {
    selectedSubject = subj;
    setScreen("SELECT_GROUP");
  }

  function chooseGroup(groupName) {
    selectedGroupKey = groupName;
    const userG = parseInt(currentUser.grade) || 2;
    activeItems = (appData.items || []).filter(it => {
      if (it.subject !== selectedSubject) return false;
      if (filterExactGradeOnly && userG < 90) {
        if ((parseInt(it.minGrade) || 2) !== userG) return false;
      }
      const key = (viewMode === "LESSONS") ? it.lesson : it.topic;
      return key === groupName;
    });
    setScreen("SELECT_GAME");
  }

  function startGame(game) {
    selectedGame = game;
    initGameState();
    setScreen("PLAYING");
  }

  function startPexesoGame(pairCount) {
    pexesoPairCount = pairCount;
    selectedGame = "PEXESO";

  function toggleTestingDirection() {

    localStorage.setItem("testing_dir", testingDirection);
    initGameState();
    renderActiveGame();
  }

  // ==========================================
  // HERNÍ ENGINE: ZKOUŠENÍ, SCRAMBLE, QUICK, MATH
  // ==========================================
  let vMastery = {};
  let vActivePool = 3;
  let vCurrentWord = 0;
  let vCardIdx = 0;
  let vQuizRevealed = false;

  let scrambleDeck = [];
  let scramblePlaced = [];
  let scrambleTiles = [];
  let scrambleIsWordMode = false;
  let scrambleHadMistake = false;
  let scrambleDone = false;
  let scrambleSolvedCount = 0;

  let missingDeck = [];
  let missingSlot = 0;
  let missingChoices = [];
  let missingChosen = -1;
  let missingSolvedCount = 0;

  let quickDeck = [];
  let quickCurrentItem = null;
  let quickSolvedCount = 0;

  let qCurStep = 0;
  let qAnswered = false;

  let seqTargetIdx = 0;
  let seqSlots = [];
  let seqStartTime = 0;
  let seqTimerInterval = null;
  let seqHintActive = false;
  let seqInactivityTimer = null;

  // PROCEDURÁLNÍ MATEMATIKA
  let mathTask = null;
  let mathStreak = 0;
  let mathAnswered = false;

  function getGraphemes(str) {
    if (window.Intl && Intl.Segmenter) {
      const segmenter = new Intl.Segmenter('und', { granularity: 'grapheme' });
      return Array.from(segmenter.segment(str), s => s.segment);
    }
    return str.split('');
  }

  function initGameState() {
    const vItems = getVocabItems();
    if (vItems.length > 0) {
      vMastery = {};
      let masteredCount = 0;

      vItems.forEach((w, i) => {
        const m = getSavedMastery(w.question, testingDirection);
        vMastery[i] = m;
        if (m >= 2) masteredCount++;
      });

      const baseWin = getAdaptiveWindowSize(currentUser.grade);
      vActivePool = Math.min(vItems.length, Math.max(baseWin, masteredCount + baseWin));

      if (selectedGame === "CARDS") {
        vCardIdx = 0;
        if (isAutoTTS && vItems.length > 0) speakWord(vItems[0].question, selectedSubject);
      }
      if (selectedGame === "ADAPTIVE") pickNextAdaptiveWord();
      if (selectedGame === "SCRAMBLE") { scrambleDeck = []; scrambleSolvedCount = 0; initScramble(); }
      if (selectedGame === "MISSING") { missingDeck = []; missingSolvedCount = 0; initMissing(); }
      if (selectedGame === "QUICK_CHOICE") { quickDeck = []; quickSolvedCount = 0; initQuickChoice(); }
    }
    if (selectedGame === "QUIZ") { qCurStep = 0; qAnswered = false; }
    if (selectedGame === "SEQ") initSequence();
  }

  function getMasteryStats() {
    const vItems = getVocabItems();
    if (vItems.length === 0) return { current: 0, total: 1, masteredCount: 0, totalWords: 1 };
    let current = 0;
    let masteredCount = 0;
    vItems.forEach((_, i) => {
      const m = vMastery[i] || 0;
      current += m;
      if (m >= 2) masteredCount++;
    });
    return {
      current: current,
      total: vItems.length * 2,
      masteredCount: masteredCount,
      totalWords: vItems.length
    };
  }

  function pickNextAdaptiveWord() {
    const vItems = getVocabItems();
    vQuizRevealed = false;

    const stats = getMasteryStats();
    if (stats.masteredCount >= stats.totalWords) {
      vCurrentWord = -1;
      return;
    }

    const unmastered = [];
    const mastered = [];

    for (let i = 0; i < vActivePool; i++) {
      if ((vMastery[i] || 0) < 2) unmastered.push(i);
      else mastered.push(i);
    }

    if (unmastered.length === 0 && vActivePool < vItems.length) {
      const step = Math.max(2, Math.floor(getAdaptiveWindowSize(currentUser.grade) / 2));
      vActivePool = Math.min(vItems.length, vActivePool + step);
      for (let i = 0; i < vActivePool; i++) {
        if ((vMastery[i] || 0) < 2) unmastered.push(i);
      }
    }

    if (unmastered.length > 0 && (Math.random() < 0.8 || mastered.length === 0)) {
      vCurrentWord = unmastered[Math.floor(Math.random() * unmastered.length)];
    } else if (mastered.length > 0) {
      vCurrentWord = mastered[Math.floor(Math.random() * mastered.length)];
    } else {
      vCurrentWord = 0;
    }
  }

  function answerAdaptive(known) {
    const vItems = getVocabItems();
    const w = vItems[vCurrentWord];

    if (known) {
      sndOk();
      addReward(1, selectedGroupKey);
      vMastery[vCurrentWord] = Math.min(2, (vMastery[vCurrentWord] || 0) + 1);

      if (vMastery[vCurrentWord] >= 2 && vActivePool < vItems.length) {
        vActivePool++;
      }
      saveWordMasteryToGoogle(w.question, vMastery[vCurrentWord], testingDirection);
    } else {
      sndErr();
      vMastery[vCurrentWord] = 0;
      saveWordMasteryToGoogle(w.question, 0, testingDirection);
    }

    pickNextAdaptiveWord();
    renderActiveGame();
  }

  function revealAdaptiveQuiz() {
    vQuizRevealed = true;
    renderActiveGame();
    if (isAutoTTS && vCurrentWord !== -1) {
      const vItems = getVocabItems();
      speakWord(vItems[vCurrentWord].question, selectedSubject);
    }
  }

  // --- CHYTRÉ SKLÁDÁNÍ (Písmena vs. Celá slova/fráze) ---
  function initScramble() {
    const vItems = getVocabItems();
    if (!scrambleDeck || scrambleDeck.length === 0) {
      scrambleDeck = vItems.map((_, i) => i).sort(() => Math.random() - 0.5);
    }
    vCurrentWord = scrambleDeck.pop();
    const w = vItems[vCurrentWord];
    scramblePlaced = [];
    scrambleHadMistake = false;
    scrambleDone = false;

    const rawTarget = w.question.trim();
    const words = rawTarget.split(/\s+/);

    // Pokud je zadání delší fráze nebo trojice (např. be - was - been), skládáme celá slova
    if (words.length >= 3 || rawTarget.length > 15) {
      scrambleIsWordMode = true;
      // Rozdělení podle pomlček nebo mezer
      let tokens = rawTarget.includes('-') 
        ? rawTarget.split('-').map(s => s.trim()) 
        : words;
      
      scrambleTiles = tokens.map((chunk, idx) => ({ text: chunk, originalIdx: idx, used: false }))
                            .sort(() => Math.random() - 0.5);
    } else {
      scrambleIsWordMode = false;
      const graphemes = getGraphemes(rawTarget);
      scrambleTiles = graphemes.map((ch, idx) => ({ text: ch, originalIdx: idx, used: false }))
                               .sort(() => Math.random() - 0.5);
    }
  }

  function clickScrambleTile(idx) {
    if (scrambleDone) return;
    const item = scrambleTiles[idx];
    if (item.used) return;

    const vItems = getVocabItems();
    const w = vItems[vCurrentWord];

    let targetTokens = [];
    if (scrambleIsWordMode) {
      targetTokens = w.question.includes('-')
        ? w.question.split('-').map(s => s.trim())
        : w.question.trim().split(/\s+/);
    } else {
      targetTokens = getGraphemes(w.question.trim());
    }

    const expected = targetTokens[scramblePlaced.length];

    if (item.text === expected) {
      sndOk();
      item.used = true;
      scramblePlaced.push(item.text);

      if (scramblePlaced.length === targetTokens.length) {
        scrambleDone = true;
        scrambleSolvedCount++;
        if (!scrambleHadMistake) {
          addReward(1, selectedGroupKey);
          sndFanfare();
        }
        if (isAutoTTS) speakWord(w.question, selectedSubject);
      }
    } else {
      sndErr();
      scrambleHadMistake = true;
    }
    renderActiveGame();
  }

  function nextScrambleStep() {
    initScramble();
    renderActiveGame();
  }

  // --- RYCHLÁ VOLBA (TŘÍDĚNÍ: DER/DIE/DAS, A/AN, I/Y) ---
  function initQuickChoice() {
    const vItems = getVocabItems();
    const mode = getQuickChoiceMode();
    if (!quickDeck || quickDeck.length === 0) {
      quickDeck = vItems.filter(it => {
        if (mode === "DER_DIE_DAS") return /^(der|die|das)\s/i.test(it.question);
        if (mode === "A_AN") return /^(a|an)\s/i.test(it.question);
        if (mode === "I_Y") return it.question.includes('_');
        return true;
      }).sort(() => Math.random() - 0.5);
    }
    if (quickDeck.length === 0) {
      // Pokud filtr nic nenašel, vezmeme celý balíček
      quickDeck = [...vItems].sort(() => Math.random() - 0.5);
    }
    quickCurrentItem = quickDeck.pop();
  }

  function answerQuickChoice(choice) {
    if (!quickCurrentItem) return;
    const mode = getQuickChoiceMode();
    let isCorrect = false;

    if (mode === "DER_DIE_DAS") {
      isCorrect = quickCurrentItem.question.toLowerCase().startsWith(choice.toLowerCase() + " ");
    } else if (mode === "A_AN") {
      isCorrect = quickCurrentItem.question.toLowerCase().startsWith(choice.toLowerCase() + " ");
    } else if (mode === "I_Y") {
      isCorrect = quickCurrentItem.answer.trim().toLowerCase() === choice.toLowerCase();
    }

    if (isCorrect) {
      sndOk();
      quickSolvedCount++;
      addReward(1, selectedGroupKey);
      if (isAutoTTS) speakWord(quickCurrentItem.question, selectedSubject);
      setTimeout(() => {
        if (quickDeck.length > 0) {
          quickCurrentItem = quickDeck.pop();
        } else {
          initQuickChoice();
        }
        renderActiveGame();
      }, 350);
    } else {
      sndErr();
    }
  }

  // --- PROCEDURÁLNÍ MATEMATICKÝ ENGINE ---
  function startMathProceduralGame() {
    selectedSubject = "Matematika (Početní dril)";
    selectedGroupKey = `${currentUser.grade}. ročník`;
    selectedGame = "PROCEDURAL_MATH";
    mathStreak = 0;
    generateNextMathTask();
    setScreen("PLAYING");
  }

  function generateNextMathTask() {
    const g = parseInt(currentUser.grade) || 2;
    mathAnswered = false;

    // 2. TŘÍDA: Sčítání a odčítání do 20 (i s přechodem), desítky do 100, malá násobilka 2-5
    if (g <= 2) {
      const types = ['ADD_20', 'SUB_20', 'TENS_100', 'MUL_SMALL'];
      const pick = types[Math.floor(Math.random() * types.length)];
      if (pick === 'ADD_20') {
        const a = Math.floor(Math.random() * 11) + 2;
        const b = Math.floor(Math.random() * (20 - a)) + 1;
        mathTask = { q: `${a} + ${b} = ?`, ans: a + b, opts: makeNumberOptions(a + b) };
      } else if (pick === 'SUB_20') {
        const ans = Math.floor(Math.random() * 15) + 1;
        const b = Math.floor(Math.random() * (20 - ans)) + 1;
        const a = ans + b;
        mathTask = { q: `${a} - ${b} = ?`, ans: ans, opts: makeNumberOptions(ans) };
      } else if (pick === 'TENS_100') {
        const a = (Math.floor(Math.random() * 8) + 1) * 10;
        const b = (Math.floor(Math.random() * (10 - a / 10)) + 1) * 10;
        mathTask = { q: `${a} + ${b} = ?`, ans: a + b, opts: makeNumberOptions(a + b, 10) };
      } else {
        const a = Math.floor(Math.random() * 4) + 2; // 2, 3, 4, 5
        const b = Math.floor(Math.random() * 10) + 1;
        mathTask = { q: `${a} · ${b} = ?`, ans: a * b, opts: makeNumberOptions(a * b) };
      }
    }
    // 3.–5. TŘÍDA: Násobilka 1-10, dělení, sčítání a odčítání do 1000
    else if (g <= 5) {
      const types = ['MUL_FULL', 'DIV_EXACT', 'ADD_1000'];
      const pick = types[Math.floor(Math.random() * types.length)];
      if (pick === 'MUL_FULL') {
        const a = Math.floor(Math.random() * 9) + 2;
        const b = Math.floor(Math.random() * 9) + 2;
        mathTask = { q: `${a} · ${b} = ?`, ans: a * b, opts: makeNumberOptions(a * b) };
      } else if (pick === 'DIV_EXACT') {
        const b = Math.floor(Math.random() * 8) + 2;
        const ans = Math.floor(Math.random() * 9) + 1;
        const a = b * ans;
        mathTask = { q: `${a} : ${b} = ?`, ans: ans, opts: makeNumberOptions(ans) };
      } else {
        const a = Math.floor(Math.random() * 400) + 50;
        const b = Math.floor(Math.random() * 400) + 50;
        mathTask = { q: `${a} + ${b} = ?`, ans: a + b, opts: makeNumberOptions(a + b) };
      }
    }
    // 6.–9. TŘÍDA: Celá čísla, zlomky, rovnice ax + b = c
    else {
      const types = ['NEG_ARITH', 'EQUATION', 'SQUARE'];
      const pick = types[Math.floor(Math.random() * types.length)];
      if (pick === 'NEG_ARITH') {
        const a = Math.floor(Math.random() * 20) - 10;
        const b = Math.floor(Math.random() * 20) - 10;
        mathTask = { q: `(${a}) + (${b}) = ?`, ans: a + b, opts: makeNumberOptions(a + b) };
      } else if (pick === 'EQUATION') {
        const a = Math.floor(Math.random() * 4) + 2; // 2..5
        const x = Math.floor(Math.random() * 10) + 1;
        const b = Math.floor(Math.random() * 10) + 1;
        const c = a * x + b;
        mathTask = { q: `${a}x + ${b} = ${c}  (x = ?)`, ans: x, opts: makeNumberOptions(x) };
      } else {
        const x = Math.floor(Math.random() * 15) + 2;
        mathTask = { q: `${x}² = ?`, ans: x * x, opts: makeNumberOptions(x * x) };
      }
    }
  }

  function makeNumberOptions(correct, step = 1) {
    const opts = [correct];
    while (opts.length < 4) {
      const delta = (Math.floor(Math.random() * 5) - 2) * step;
      const fake = correct + (delta === 0 ? step : delta);
      if (!opts.includes(fake) && fake >= 0) opts.push(fake);
    }
    return opts.sort(() => Math.random() - 0.5);
  }

  function answerMathTask(chosen) {
    if (mathAnswered) return;
    mathAnswered = true;
    const isCorrect = chosen === mathTask.ans;

    if (isCorrect) {
      sndOk();
      mathStreak++;
      addReward(1, "Matematika");
      if (mathStreak % 5 === 0) sndFanfare();
      setTimeout(() => {
        generateNextMathTask();
        renderActiveGame();
      }, 350);
    } else {
      sndErr();
      mathStreak = 0;
      renderActiveGame();
    }
  }

  function initMissing() {
    const vItems = getVocabItems();
    if (!missingDeck || missingDeck.length === 0) {
      missingDeck = vItems.map((_, i) => i).sort(() => Math.random() - 0.5);
    }
    vCurrentWord = missingDeck.pop();
    const w = vItems[vCurrentWord];
    const letters = getGraphemes(w.question);
    missingSlot = Math.floor(Math.random() * letters.length);
    const correctCh = letters[missingSlot];
    missingChosen = -1;

    const alphabet = "abcdefghijklmnopqrstuvwxyz";
    missingChoices = [correctCh];
    while (missingChoices.length < 3) {
      let r = alphabet[Math.floor(Math.random() * alphabet.length)];
      if (!missingChoices.includes(r)) missingChoices.push(r);
    }
    missingChoices.sort(() => Math.random() - 0.5);
  }

  function clickMissingOption(idx) {
    if (missingChosen !== -1) return;
    missingChosen = idx;
    const vItems = getVocabItems();
    const w = vItems[vCurrentWord];
    const letters = getGraphemes(w.question);
    const isCorrect = missingChoices[idx] === letters[missingSlot];

    if (isCorrect) {
      sndOk();
      missingSolvedCount++;
      addReward(1, selectedGroupKey);
      if (isAutoTTS) speakWord(w.question, selectedSubject);
    } else {
      sndErr();
    }
    renderActiveGame();
  }

  function nextMissingStep() {
    initMissing();
    renderActiveGame();
  }

  let pexesoPairCount = 4;
  let pexesoCards = [];
  let pexesoFlipped = [];
  let pexesoMatched = [];
  let pexesoLocked = false;
  let pexesoAttempts = 0;

  function initPexeso() {
    const vItems = getVocabItems();
    const count = Math.min(pexesoPairCount, vItems.length);
    const shuffledWords = [...vItems].sort(() => Math.random() - 0.5).slice(0, count);

    pexesoCards = [];
    shuffledWords.forEach((w, wIdx) => {
      pexesoCards.push({ id: `f_${wIdx}`, wordIdx: wIdx, text: w.question, isForeign: true });
      pexesoCards.push({ id: `c_${wIdx}`, wordIdx: wIdx, text: w.answer, isForeign: false });
    });

    pexesoCards.sort(() => Math.random() - 0.5);
    pexesoFlipped = [];
    pexesoMatched = [];
    pexesoLocked = false;
    pexesoAttempts = 0;
  }

  function clickPexesoCard(index) {
    if (pexesoLocked) return;
    if (pexesoFlipped.includes(index)) return;
    if (pexesoMatched.includes(pexesoCards[index].wordIdx)) return;

    pexesoFlipped.push(index);
    const cardJustFlipped = pexesoCards[index];

    if (isAutoTTS && cardJustFlipped.isForeign) {
      speakWord(cardJustFlipped.text, selectedSubject);
    }

    renderActiveGame();

    if (pexesoFlipped.length === 2) {
      pexesoAttempts++;
      const idx1 = pexesoFlipped[0];
      const idx2 = pexesoFlipped[1];
      const card1 = pexesoCards[idx1];
      const card2 = pexesoCards[idx2];

      if (card1.wordIdx === card2.wordIdx) {
        sndOk();
        pexesoMatched.push(card1.wordIdx);
        pexesoFlipped = [];

        if (pexesoMatched.length === Math.min(pexesoPairCount, getVocabItems().length)) {
          sndFanfare();
          const maxIdeal = pexesoPairCount * 2;
          const starsEarned = (pexesoAttempts <= maxIdeal) ? (pexesoPairCount >= 6 ? 4 : 2) : 1;
          addReward(starsEarned, selectedGroupKey);
        }
        renderActiveGame();
      } else {
        sndErr();
        pexesoLocked = true;
        setTimeout(() => {
          pexesoFlipped = [];
          pexesoLocked = false;
          renderActiveGame();
        }, 900);
      }
    }
  }

  function renderActiveGame() {
    const main = document.getElementById("main-content");
    const isHebrew = selectedSubject.toLowerCase().includes('hebr') || selectedSubject === 'HE';
    const vItems = getVocabItems();
    const qItems = getQuizItems();
    const sItems = getSeqItems();

    // 1. KARTY
    if (selectedGame === "CARDS") {
      const w = vItems[vCardIdx];
      const pct = Math.round(((vCardIdx + 1) / vItems.length) * 100);
      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Karty: ${vCardIdx + 1} z ${vItems.length}</span>
            <span style="color:var(--col-active-tab);">${pct} %</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}">
          ${w.question}
          <span class="audio-btn" onclick="speakWord('${w.question}', '${selectedSubject}')" title="Přečíst">🔊</span>
        </div>
        <div class="prompt-box" style="color:#fff;font-size:22px;">${w.answer}</div>
        <div style="text-align:center;color:var(--col-active-tab);font-size:18px;margin-bottom:12px;">[ ${w.help || ''} ]</div>
        <div class="grid-2">
          <div class="action-btn" onclick="vCardPrev()">Předchozí</div>
          <div class="action-btn" onclick="vCardNext()">Další (${vCardIdx+1}/${vItems.length})</div>
        </div>
      `;
    }

    // 2. OBOUSMĚRNÉ ADAPTIVNÍ ZKOUŠENÍ
    else if (selectedGame === "ADAPTIVE") {
      const stats = getMasteryStats();
      const pct = Math.round((stats.current / stats.total) * 100);
      const isDirOut = testingDirection === "DIR_OUT";

      if (stats.masteredCount >= stats.totalWords) {
        main.innerHTML = `
          <div style="text-align:center;padding:30px 10px;">
            <h2 style="color:var(--col-green);font-size:26px;margin-bottom:12px;">KOMPLETNĚ ZVLÁDNUTO! 🎉</h2>
            <p style="font-size:17px;color:#fff;margin-bottom:8px;">Všech ${stats.totalWords} položek v tomto směru (${isDirOut ? '🇨🇿 ➔ Cizí' : 'Cizí ➔ 🇨🇿'}) umíš na 2 ★!</p>
            <div class="action-btn" style="margin-bottom:10px;" onclick="toggleTestingDirection()">PŘEPNOUT NA DRUHÝ SMĚR ⇄</div>
            <div class="action-btn green" onclick="setScreen('SELECT_GAME')">ZPĚT DO MENU HRY ➔</div>
          </div>
        `;
        return;
      }

      const w = vItems[vCurrentWord];
      const mVal = vMastery[vCurrentWord] || 0;

      // Směr: DIR_OUT = prompt česky, odpověď cizí | DIR_IN = prompt cizí, odpověď česky
      const promptText = isDirOut ? w.answer : w.question;
      const targetText = isDirOut ? w.question : w.answer;

      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Učení: ${stats.masteredCount} z ${stats.totalWords} (${stats.current}/${stats.total} b.)</span>
            <span style="color:var(--col-green);">${pct} %</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${pct}%;"></div></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--col-text-muted);margin-bottom:4px;">
          <span>Slovo: ${mVal}/2 ★</span>
          <button class="toggle-btn on" onclick="toggleTestingDirection()" style="font-size:11px;padding:2px 8px;">
            Směr: ${isDirOut ? '🇨🇿 ➔ Cizí' : 'Cizí ➔ 🇨🇿'} ⇄
          </button>
        </div>
        <div class="prompt-box" style="color:#fff;margin-top:2px;">${promptText}</div>
        <div class="prompt-box ${(!isDirOut && isHebrew) ? 'hebrew-text' : (isDirOut && isHebrew && vQuizRevealed ? 'hebrew-text' : '')}" style="color:${vQuizRevealed ? 'var(--col-yellow)' : 'var(--col-text-muted)'};">
          ${vQuizRevealed ? targetText : '[ ? ? ? ]'}
          ${(vQuizRevealed && isDirOut) ? `<span class="audio-btn" onclick="speakWord('${w.question}', '${selectedSubject}')">🔊</span>` : ''}
        </div>
        ${vQuizRevealed ? `
          <div style="text-align:center;color:var(--col-active-tab);margin-bottom:8px;">[ ${w.help || ''} ]</div>
          <div class="grid-2">
            <div class="action-btn red" onclick="answerAdaptive(false)">Nevěděl jsem (0 ★)</div>
            <div class="action-btn green" onclick="answerAdaptive(true)">Věděl jsem (+1 ★)</div>
          </div>
        ` : `
          <div class="action-btn" onclick="revealAdaptiveQuiz()">ZKONTROLOVAT</div>
        `}
      `;
    }

    // 3. SKLÁDÁNÍ (SLOVA / PÍSMENA)
    else if (selectedGame === "SCRAMBLE") {
      const w = vItems[vCurrentWord];
      const pct = Math.min(100, Math.round((scrambleSolvedCount / vItems.length) * 100));

      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Vyřešeno: ${scrambleSolvedCount} z ${vItems.length}</span>
            <span style="color:var(--col-yellow);">${pct} %</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="prompt-box" style="font-size:20px;color:#fff;margin-top:4px;">Slož: <b>${w.answer}</b></div>
        <div class="slots-row ${isHebrew ? 'hebrew-text' : ''}">
          ${scrambleTiles.map((tile, i) => `
            <div class="letter-slot ${scrambleIsWordMode ? 'word-slot' : ''} ${i < scramblePlaced.length ? 'filled' : ''}">
              ${i < scramblePlaced.length ? scramblePlaced[i] : '_'}
            </div>
          `).join('')}
        </div>
        ${!scrambleDone ? `
          <div class="letters-row">
            ${scrambleTiles.map((item, idx) => `
              <div class="letter-tile ${scrambleIsWordMode ? 'word-tile' : ''} ${isHebrew ? 'hebrew' : ''} ${item.used ? 'used' : ''}" onclick="clickScrambleTile(${idx})">
                ${item.text}
              </div>
            `).join('')}
          </div>
        ` : `
          <div style="text-align:center;color:var(--col-active-tab);margin-bottom:6px;">[ ${w.help || ''} ]</div>
          <div class="action-btn ${scrambleHadMistake ? 'red' : 'green'}" onclick="nextScrambleStep()">
            ${scrambleHadMistake ? 'DOKONČENO S CHYBOU ➔ DALŠÍ' : 'SPRÁVNĚ! ➔ DALŠÍ SLOVO'}
          </div>
        `}
      `;
    }

    // 4. RYCHLÁ VOLBA (DER/DIE/DAS, A/AN, I/Y)
    else if (selectedGame === "QUICK_CHOICE") {
      const mode = getQuickChoiceMode();
      const it = quickCurrentItem;
      if (!it) {
        initQuickChoice();
        return;
      }

      let promptClean = it.question;
      let btns = [];

      if (mode === "DER_DIE_DAS") {
        promptClean = it.question.replace(/^(der|die|das)\s+/i, '');
        btns = ['DER', 'DIE', 'DAS'];
      } else if (mode === "A_AN") {
        promptClean = it.question.replace(/^(a|an)\s+/i, '');
        btns = ['A', 'AN'];
      } else if (mode === "I_Y") {
        btns = ['I / Í', 'Y / Ý'];
      }

      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Rychlá volba: ${quickSolvedCount} vyřešeno</span>
            <span style="color:var(--col-yellow);">Zbývá: ${quickDeck.length + 1}</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:100%;"></div></div>
        </div>
        <div class="prompt-box" style="font-size:32px;color:#fff;margin:25px 0;">${promptClean}</div>
        <p style="text-align:center;color:var(--col-text-muted);font-size:16px;margin-bottom:15px;">${it.answer}</p>
        <div style="display:flex;gap:10px;justify-content:center;">
          ${btns.map(b => `
            <div class="opt-btn" style="flex:1;height:65px;font-size:22px;font-weight:bold;" onclick="answerQuickChoice('${b}')">${b}</div>
          `).join('')}
        </div>
      `;
    }

    // 5. PROCEDURÁLNÍ MATEMATIKA
    else if (selectedGame === "PROCEDURAL_MATH") {
      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Série správně: ${mathStreak} 🔥</span>
            <span style="color:var(--col-active-tab);">${selectedGroupKey}</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${Math.min(100, mathStreak * 10)}%;"></div></div>
        </div>
        <div class="prompt-box" style="font-size:36px;color:#fff;margin:20px 0;">${mathTask.q}</div>
        <div class="grid-2">
          ${mathTask.opts.map(opt => `
            <div class="opt-btn ${mathAnswered ? (opt === mathTask.ans ? 'correct' : 'wrong') : ''}" style="height:60px;font-size:26px;font-weight:bold;" onclick="answerMathTask(${opt})">
              ${opt}
            </div>
          `).join('')}
        </div>
      `;
    }

    // 6. DOPLŇOVÁNÍ PÍSMENE
    else if (selectedGame === "MISSING") {
      const w = vItems[vCurrentWord];
      const letters = getGraphemes(w.question);
      const pct = Math.min(100, Math.round((missingSolvedCount / vItems.length) * 100));

      let maskedWord = "";
      letters.forEach((ch, idx) => {
        if (idx === missingSlot) {
          maskedWord += missingChosen === -1 ? " [ _ ] " : ` [ ${ch} ] `;
        } else {
          maskedWord += ch + " ";
        }
      });

      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Doplněno: ${missingSolvedCount} z ${vItems.length}</span>
            <span style="color:var(--col-yellow);">${pct} %</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="prompt-box" style="font-size:20px;color:#fff;margin-top:4px;">Doplň: <b>${w.answer}</b></div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}">${maskedWord}</div>
        <div class="grid-2">
          ${missingChoices.map((ch, i) => {
            const isCorrect = ch === letters[missingSlot];
            const cls = missingChosen !== -1 ? (isCorrect ? 'correct' : (i === missingChosen ? 'wrong' : '')) : '';
            return `<div class="opt-btn ${isHebrew ? 'hebrew' : ''} ${cls}" onclick="clickMissingOption(${i})">${ch}</div>`;
          }).join('')}
        </div>
        ${missingChosen !== -1 ? `<div class="action-btn" onclick="nextMissingStep()">DALŠÍ ➔</div>` : ''}
      `;
    }

    // 7. PEXESO
    else if (selectedGame === "PEXESO") {
      const totalPairs = Math.min(pexesoPairCount, vItems.length);
      const isComplete = pexesoMatched.length === totalPairs;

      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Pexeso: ${pexesoMatched.length} / ${totalPairs} dvojic</span>
            <span style="color:var(--col-yellow);">Pokusy: ${pexesoAttempts}</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${(pexesoMatched.length / totalPairs) * 100}%;"></div></div>
        </div>
        ${!isComplete ? `
          <div class="pexeso-grid" style="grid-template-columns: repeat(4, 1fr);">
            ${pexesoCards.map((c, i) => {
              const isMatched = pexesoMatched.includes(c.wordIdx);
              const isFlipped = pexesoFlipped.includes(i);
              let cls = isMatched ? 'matched' : (isFlipped ? 'flipped' : 'hidden');
              if (c.isForeign && isHebrew) cls += ' hebrew';
              return `
                <div class="pexeso-card ${cls}" onclick="clickPexesoCard(${i})">
                  ${isMatched || isFlipped ? c.text : '❓'}
                </div>
              `;
            }).join('')}
          </div>
        ` : `
          <div style="text-align:center;padding:30px 10px;">
            <h2 style="color:var(--col-green);font-size:26px;margin-bottom:8px;">VÝBORNĚ! PEXESO SPLNĚNO!</h2>
            <p style="color:var(--col-yellow);font-size:18px;margin-bottom:6px;">Hotovo za ${pexesoAttempts} pokusů!</p>
            <div class="action-btn green" onclick="initPexeso();renderActiveGame();">HRÁT ZNOVU ➔</div>
            <div class="action-btn" style="margin-top:10px;" onclick="setScreen('SELECT_PEXESO_SIZE')">ZMĚNIT VELIKOST PEXESA</div>
          </div>
        `}
      `;
    }

    // 8. KVÍZ
    else if (selectedGame === "QUIZ") {
      const q = qItems[qCurStep];
      const pct = Math.round(((qCurStep + 1) / qItems.length) * 100);
      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Kvíz: ${qCurStep + 1} z ${qItems.length}</span>
            <span style="color:var(--col-active-tab);">${pct} %</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="prompt-box" style="font-size:20px;color:#fff;">${q.question}</div>
        <div class="grid-2" style="margin-top:10px;">
          ${q.options.map(opt => `
            <div class="opt-btn ${qAnswered ? (opt === q.answer ? 'correct' : 'wrong') : ''}" onclick="clickQuizOpt('${opt}')">
              ${opt}
            </div>
          `).join('')}
        </div>
        ${qAnswered ? `
          <div style="text-align:center;color:var(--col-yellow);margin-top:8px;">${q.help || ''}</div>
          <div class="action-btn" onclick="nextQuizStep()">DALŠÍ ➔</div>
        ` : ''}
      `;
    }

    // 9. ŘADA NA ČAS
    else if (selectedGame === "SEQ") {
      const seqConfig = sItems[0];
      const itemsList = seqConfig.answer.split('|').map(s => s.trim()).filter(Boolean);
      const isFinished = seqTargetIdx >= itemsList.length;
      const targetWord = itemsList[seqTargetIdx];
      const pct = Math.round((seqTargetIdx / itemsList.length) * 100);

      main.innerHTML = `
        <div class="bargraph-container">
          <div class="bargraph-header">
            <span>Položka ${Math.min(seqTargetIdx + 1, itemsList.length)} z ${itemsList.length} ${seqHintActive ? '<b style="color:var(--col-yellow);">[NÁPOVĚDA]</b>' : ''}</span>
            <span id="seq-timer" style="color:var(--col-yellow);font-weight:bold;">0.0 s</span>
          </div>
          <div class="bargraph-track"><div class="bargraph-fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="prompt-box ${isHebrew ? 'hebrew-text' : ''}" style="margin:8px 0;min-height:56px;color:#fff;font-size:22px;">
          ${itemsList.slice(0, seqTargetIdx).join(' ')} 
          <span style="color:var(--col-yellow);">${seqHintActive ? `[ ${targetWord}! ]` : '[ ??? ]'}</span>
        </div>
        ${!isFinished ? `
          <div class="grid-2">
            ${seqSlots.map((itemIdx, slot) => {
              const isHintSlot = (seqHintActive && itemIdx === seqTargetIdx);
              return `
                <div id="seq-btn-${slot}" class="opt-btn ${isHebrew ? 'hebrew' : ''} ${isHintSlot ? 'hint' : ''}" onclick="clickSeqSlot(${slot})">
                  ${itemIdx !== -1 ? itemsList[itemIdx] : ''}
                </div>
              `;
            }).join('')}
          </div>
        ` : `
          <div class="action-btn green" onclick="initSequence();renderActiveGame();">DOKONČENO! HRÁT ZNOVU</div>
        `}
      `;
    }
  }

  function vCardPrev() {
    const vItems = getVocabItems();
    vCardIdx = (vCardIdx + vItems.length - 1) % vItems.length;
    renderActiveGame();
    if (isAutoTTS && vItems.length > 0) speakWord(vItems[vCardIdx].question, selectedSubject);
  }
  function vCardNext() {
    const vItems = getVocabItems();
    vCardIdx = (vCardIdx + 1) % vItems.length;
    renderActiveGame();
    if (isAutoTTS && vItems.length > 0) speakWord(vItems[vCardIdx].question, selectedSubject);
  }

  function clickQuizOpt(chosen) {
    if (qAnswered) return;
    const qItems = getQuizItems();
    const q = qItems[qCurStep];
    qAnswered = true;
    if (chosen === q.answer) { sndOk(); addReward(1, selectedGroupKey); }
    else sndErr();
    renderActiveGame();
  }
  function nextQuizStep() {
    const qItems = getQuizItems();
    qCurStep++;
    qAnswered = false;
    if (qCurStep >= qItems.length) setScreen("SELECT_GAME");
    else renderActiveGame();
  }

  function resetInactivityTimer() {
    if (seqInactivityTimer) clearTimeout(seqInactivityTimer);
    seqInactivityTimer = setTimeout(() => {
      seqHintActive = true;
      renderActiveGame();
    }, 3000);
  }

  function initSequence() {
    const sItems = getSeqItems();
    if (sItems.length === 0) return;
    const itemsList = sItems[0].answer.split('|').map(s => s.trim()).filter(Boolean);

    seqTargetIdx = 0;
    seqHintActive = false;
    seqSlots = [-1, -1, -1, -1];
    seqSlots[0] = 0;
    if (itemsList.length > 1) seqSlots[1] = 1;
    for (let s = 2; s < Math.min(4, itemsList.length); s++) seqSlots[s] = s;
    seqSlots.sort(() => Math.random() - 0.5);

    seqStartTime = Date.now();
    if (seqTimerInterval) clearInterval(seqTimerInterval);
    seqTimerInterval = setInterval(() => {
      const el = document.getElementById("seq-timer");
      if (el && seqTargetIdx < itemsList.length) {
        el.innerText = ((Date.now() - seqStartTime) / 1000).toFixed(1) + " s";
      }
    }, 100);

    resetInactivityTimer();
  }

  function clickSeqSlot(slot) {
    const sItems = getSeqItems();
    const itemsList = sItems[0].answer.split('|').map(s => s.trim()).filter(Boolean);
    const btnEl = document.getElementById(`seq-btn-${slot}`);

    if (seqSlots[slot] === seqTargetIdx) {
      sndOk();
      seqTargetIdx++;
      seqHintActive = false;

      if (seqTargetIdx >= itemsList.length) {
        clearInterval(seqTimerInterval);
        if (seqInactivityTimer) clearTimeout(seqInactivityTimer);
        sndFanfare();
        addReward(3, selectedGroupKey);
      } else {
        const next = seqTargetIdx + 1;
        seqSlots[slot] = next < itemsList.length ? next : -1;
        resetInactivityTimer();
      }
      renderActiveGame();
    } else {
      sndErr();
      if (btnEl) {
        btnEl.classList.add("wrong");
        setTimeout(() => { if (btnEl) btnEl.classList.remove("wrong"); }, 250);
      }
      seqHintActive = true;
      resetInactivityTimer();
      renderActiveGame();
    }
  }

  loadData();
</script>
</body>
</html>
